function logReq(a,outcome){
  const p0=apptPets(a)[0]||{};
  STATE.reqHistory.unshift({hid:nid(),rid:a._reqId||"",pet:apptPetNames(a),breed:p0.breed||"",size:p0.size||"",
    svcs:(p0.svcs||[]).slice(),owner:a.owner,phone:a.phone,email:a.email||"",addr:a.addr,zone:a.zone,
    when:a.when,time:a.time,price:a.price,photo:apptPhoto(a),groomer:a.groomer,vanId:a.vanId,
    recurring:a.recurring||null,outcome:outcome,at:Date.now(),pets:JSON.parse(JSON.stringify(apptPets(a)))});
}
/* Recurrencia: mismo día de la semana y misma hora. */
function genRepeats(a){
  if(!a.recurring)return 0;
  const every=Math.max(1,+a.recurring||4);
  const n=Math.max(1,Math.min(26,+(STATE.settings.repeatCount||6)));
  const dur=apptDur(a);
  const seriesId=a.seriesId||nid();a.seriesId=seriesId;
  let made=0;
  for(let k=1;k<=n;k++){
    const d=new Date(a.when+"T12:00");
    d.setDate(d.getDate()+every*7*k);
    const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(STATE.appointments.some(x=>x.seriesId===seriesId&&x.when===iso))continue;
    const c=JSON.parse(JSON.stringify(a));
    c.id=nid();c.when=iso;c.status="conf";c.seriesId=seriesId;c.payments=[];c.tip=0;c.paid=false;c.paidAmt=0;
    delete c._reqId;delete c.proposal;delete c.reminded;delete c.remindedAt;delete c.doneAt;delete c.onWayAt;delete c.conflict;
    const v=pickVan(iso,a.time,apptDur(c),{zone:a.zone,svcs:allSvcIds(c.pets)});
    if(v)c.vanId=v; else c.conflict=true;
    STATE.appointments.push(c);made++;touchAppts();
  }
  return made;
}
function acceptRequest(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  a.status="conf";
  if(a._reqId){deleteRequestDoc(a._reqId);delete a._reqId;}
  upsertClient({name:a.owner,phone:a.phone,email:a.email,addr:a.addr,zone:a.zone,lat:a.lat,lng:a.lng,pets:apptPets(a)});
  const c=clientOf(a);if(c)a.clientId=c.id;
  genRepeats(a);logReq(a,"accepted");
  refreshBiz();flushPersist();toast(t("t_reqAccepted"));
}
function declineRequest(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  if(a._reqId)deleteRequestDoc(a._reqId);
  logReq(a,"declined");
  STATE.appointments=STATE.appointments.filter(x=>x.id!==id);
  refreshBiz();flushPersist();toast(t("t_reqDeclined"));
}
function openPropose(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const slotOpts=(STATE.slots||[]).slice().sort().map(s=>'<option value="'+s+'" '+(s===a.time?"selected":"")+'>'+fmtTime(s)+'</option>').join("");
  openModal('<div class="modal-head"><div class="av">📅</div><div><h2>'+t("req_proposeTitle")+'</h2><div class="mh-sub">'+esc(apptPetNames(a))+' · '+esc(a.owner||"")+'</div></div><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="row"><div class="field"><label>'+t("req_newDate")+'</label><input class="input" id="pp_date" type="date" value="'+a.when+'"></div>'+
    '<div class="field"><label>'+t("req_newTime")+'</label><select class="input" id="pp_time">'+slotOpts+'</select></div></div>'+
    '<div class="field"><label>'+t("req_note")+'</label><input class="input" id="pp_note"></div>'+
    '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">'+t("back")+'</button><button class="btn btn-primary" onclick="sendProposal(\''+id+'\')">'+t("req_send")+'</button></div>');
}
function sendProposal(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  a.proposal={date:document.getElementById("pp_date").value,time:document.getElementById("pp_time").value,note:document.getElementById("pp_note").value.trim()};
  a.status="modProposed";
  if(a._reqId)updateRequestDoc(a._reqId,{proposal:a.proposal,status:"modProposed"});
  waOpen(a.phone,fill(tpl("resched"),apptVars(a,{date:fmtDate(a.proposal.date),time:fmtTime(a.proposal.time),oldDate:fmtDate(a.when),oldTime:fmtTime(a.time)})));
  closeModal();refreshBiz();flushPersist();toast(t("t_reqProposed"));
}
function clientAcceptProposal(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a||!a.proposal)return;
  a.when=a.proposal.date;a.time=a.proposal.time;a.status="conf";delete a.proposal;
  if(a._reqId){deleteRequestDoc(a._reqId);delete a._reqId;}
  upsertClient({name:a.owner,phone:a.phone,email:a.email,addr:a.addr,zone:a.zone,pets:apptPets(a)});
  const c=clientOf(a);if(c)a.clientId=c.id;
  genRepeats(a);logReq(a,"accepted");
  refreshBiz();flushPersist();toast(t("t_reqAccepted"));
}
function clientRejectProposal(id){declineRequest(id);}
function restoreReq(hid){
  const h=(STATE.reqHistory||[]).find(x=>x.hid===hid);if(!h)return;
  const pets=h.pets&&h.pets.length?h.pets:[{name:h.pet,breed:h.breed,size:h.size,svcs:h.svcs||[],photo:h.photo||"",notes:""}];
  STATE.appointments.push(normalizeAppt({id:nid(),pets:pets,owner:h.owner,phone:h.phone,phoneKey:phoneKey(h.phone),
    email:h.email,addr:h.addr,zone:h.zone,when:h.when,time:h.time,price:h.price,groomer:h.groomer,vanId:h.vanId,
    status:"requested",paid:false,recurring:h.recurring}));
  STATE.reqHistory=STATE.reqHistory.filter(x=>x.hid!==hid);
  refreshBiz();flushPersist();toast(t("t_reqRestored"));
}
function deleteReqForever(hid){STATE.reqHistory=STATE.reqHistory.filter(x=>x.hid!==hid);renderRequests();persist();toast(t("t_reqDeleted"));}

/* ===== calendario ===== */
function calISO(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function hexToRgba(hex,a){try{const n=parseInt(String(hex).slice(1),16);return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';}catch(e){return 'rgba(200,200,200,'+a+')';}}
function renderCalendar(){
  const cal=STATE.cal;if(!cal)return;
  const first=new Date(cal.y,cal.m,1);
  const mt=first.toLocaleDateString(loc(),{month:"long",year:"numeric"});
  document.getElementById("calTitle").textContent=mt.charAt(0).toUpperCase()+mt.slice(1);
  document.getElementById("calTodayBtn").textContent=t("cal_today");
  document.getElementById("calDow").innerHTML=t("cal_dow").map(d=>'<span>'+d+'</span>').join("");
  const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(cal.y,cal.m+1,0).getDate();
  const today=addDays(0);
  const pool=visibleAppts();
  let cells="";
  for(let i=0;i<startDow;i++)cells+='<div class="cal-cell empty-day"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const iso=calISO(cal.y,cal.m,d);
    const dayAppts=pool.filter(a=>a.when===iso&&isLive(a)).sort((a,b)=>String(a.time).localeCompare(String(b.time)));
    const cls=["cal-cell"];if(iso===today)cls.push("today");if(iso===cal.sel)cls.push("sel");
    let ev="";
    dayAppts.slice(0,3).forEach(a=>{
      const v=vanById(a.vanId);const c=v?v.color:"#b9a7ae";
      ev+='<button class="cal-ev" style="--vc:'+c+';background:'+hexToRgba(c,0.14)+'" onclick="event.stopPropagation();openAppt(\''+a.id+'\')"><span class="ed" style="background:'+c+'"></span><span class="et"><span class="etime">'+esc(a.time)+' </span>'+esc(apptPetNames(a))+'</span></button>';
    });
    if(dayAppts.length>3)ev+='<span class="cal-more">+'+(dayAppts.length-3)+'</span>';
    cells+='<div class="'+cls.join(" ")+'" onclick="calSelect(\''+iso+'\')"><span class="dn">'+d+'</span><div class="cal-evs">'+ev+'</div></div>';
  }
  document.getElementById("calGrid").innerHTML=cells;
  document.getElementById("calLegend").innerHTML=STATE.vans.map(v=>'<span><span class="ld" style="background:'+v.color+'"></span>'+esc(v.name)+'</span>').join("");
  renderCalDay();
}
function renderCalDay(){
  const iso=STATE.cal.sel;
  const left=daySeatsLeft(iso),capT=dayCapacity(iso);
  document.getElementById("calDayLabel").innerHTML=t("cal_dayAppts",{d:fmtDateLong(iso)})+
    ' <span class="seat-pill'+(left?'':' none')+'">'+t("seats_pill",{n:left,c:capT})+'</span>';
  const ab=document.getElementById("calAddBtn");if(ab)ab.textContent=t("cal_new");
  const list=visibleAppts().filter(a=>a.when===iso&&isLive(a)).sort((a,b)=>String(a.time).localeCompare(String(b.time)));
  document.getElementById("calDayList").innerHTML=list.length?list.map(apptRow).join(""):'<div class="empty">'+t("cal_noDay")+'</div>';
}
function calSelect(iso){STATE.cal.sel=iso;renderCalendar();}
function calShift(delta){
  let m=STATE.cal.m+delta,y=STATE.cal.y;
  if(m<0){m=11;y--;}if(m>11){m=0;y++;}
  STATE.cal.y=y;STATE.cal.m=m;
  const sd=new Date(STATE.cal.sel+"T12:00");
  if(sd.getFullYear()!==y||sd.getMonth()!==m)STATE.cal.sel=calISO(y,m,1);
  renderCalendar();
}
function calGoToday(){const today=addDays(0);const d=new Date(today+"T12:00");STATE.cal.y=d.getFullYear();STATE.cal.m=d.getMonth();STATE.cal.sel=today;renderCalendar();}
</script>
<script>
/* ============================================================
   CLIENTES
   ============================================================ */
function setClientView(v){STATE.clientView=v;
  document.getElementById("ctAll").classList.toggle("on",v==="all");
  document.getElementById("ctCold").classList.toggle("on",v==="cold");
  renderClients();}
function clientHaystack(c){
  return norm([c.name,(c.altNames||[]).join(" "),c.phone,fmtPhone(c.phone),c.email,c.addr,c.zone,c.notes,
    (c.pets||[]).map(p=>p.name+" "+p.breed).join(" ")].join(" "));
}
function renderClients(){
  const cont=document.getElementById("clientList");if(!cont)return;
  if(isStaff()){cont.innerHTML="";return;}
  const q=STATE.search.clients;
  let list=(STATE.clients||[]).slice();
  if(STATE.clientView==="cold")list=list.filter(isColdClient);
  if(q)list=list.filter(c=>matches(clientHaystack(c),q));
  const withStats=list.map(c=>({c:c,s:clientStats(c)}));
  withStats.sort((a,b)=>{
    if(STATE.clientView==="cold")return (a.s.last||"").localeCompare(b.s.last||"");
    return b.s.spent-a.s.spent;
  });
  const cnt=document.getElementById("clientCount");
  if(cnt){
    if(q)cnt.textContent=t("res_found",{n:withStats.length});
    else if(STATE.clientView==="cold")cnt.textContent=withStats.length?t("cli_coldCount",{n:withStats.length,d:+STATE.settings.coldDays||60}):"";
    else cnt.textContent="";
  }
  if(!withStats.length){
    cont.innerHTML='<div class="empty">'+(q?t("res_none",{q:esc(q)}):(STATE.clientView==="cold"?t("cli_coldNone"):t("no_clients")))+'</div>';
    return;
  }
  cont.innerHTML=withStats.map((o,i)=>{
    const c=o.c,s=o.s;
    const pets=(c.pets||[]).map(p=>p.name).filter(Boolean);
    const ph=(c.pets||[]).find(p=>p.photo);
    const av=ph?'<div class="cli-avatar"><img src="'+esc(ph.photo)+'" alt=""></div>':'<div class="cli-avatar">'+DOG_EMOJI[i%DOG_EMOJI.length]+'</div>';
    const sub=s.last?t("cli_lastVisit",{d:fmtDate(s.last)+" · "+t("cli_daysAgo",{n:daysBetween(s.last,addDays(0))})}):t("cli_never");
    const cold=isColdClient(c);
    return '<button class="cli-card'+(cold?' cold':'')+'" onclick="openClient(\''+c.id+'\')">'+av+
      '<div class="ci"><div class="cn">'+esc(c.name)+'</div><div class="cd">'+esc(pets.join(", ")||"—")+' · '+esc(c.zone||"")+'</div>'+
      '<div class="cd" style="font-size:11.5px">'+esc(sub)+'</div></div>'+
      '<div class="cv"><div class="tot">'+money(s.spent)+'</div><div class="vis">'+s.visits+' '+t("visits")+'</div></div></button>';
  }).join("");
}
function openClient(cid){
  const c=(STATE.clients||[]).find(x=>x.id===cid);if(!c)return;
  const s=clientStats(c);
  const pets=(c.pets||[]).map(p=>'<span class="pet-pill">🐾 '+esc(p.name)+' · '+esc(p.breed||"")+' · '+sizeLabel(p.size)+'</span>').join("")||'<span class="hint">—</span>';
  const hist=s.all.slice().sort((a,b)=>b.when.localeCompare(a.when)).slice(0,8).map(a=>
    '<div class="hist-item"><span class="hk">'+fmtDate(a.when)+' · '+esc(apptSvcNames(a))+'</span><span class="hv">'+money(apptTotal(a))+'</span></div>').join("")||'<div class="hint">—</div>';
  const mapUrl="https://maps.google.com/?q="+encodeURIComponent((c.addr||"")+" "+(c.zone||""));
  const ph=(c.pets||[]).find(p=>p.photo);
  const av=ph?'<div class="av"><img src="'+esc(ph.photo)+'" alt=""></div>':'<div class="av">👤</div>';
  openModal('<div class="modal-head">'+av+'<div><h2>'+esc(c.name)+'</h2><div class="mh-sub">'+t("cm_visits",{n:s.visits})+' · '+t("cm_total",{amt:money(s.spent)})+'</div></div><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="mrow"><div class="mi">📞</div><div><div class="mk">'+t("cm_phone")+'</div><a class="mv" href="tel:'+esc(c.phone)+'">'+esc(fmtPhone(c.phone))+'</a></div></div>'+
    (c.email?'<div class="mrow"><div class="mi">✉️</div><div><div class="mk">Email</div><a class="mv" href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></div></div>':'')+
    '<div class="mrow"><div class="mi">📍</div><div><div class="mk">'+t("m_address")+' · '+esc(c.zone||"")+'</div><a class="mv" href="'+mapUrl+'" target="_blank">'+esc(c.addr||"—")+' ↗</a></div></div>'+
    (s.next?'<div class="mrow"><div class="mi">📅</div><div><div class="mk">'+t("sec_upcoming")+'</div><div class="mv">'+fmtDate(s.next.when)+' · '+fmtTime(s.next.time)+'</div></div></div>':'')+
    (c.notes?'<div class="mrow"><div class="mi">📝</div><div><div class="mk">'+t("cli_notes")+'</div><div class="mv" style="font-weight:400">'+esc(c.notes)+'</div></div></div>':'')+
    '<div style="padding:14px 0 4px"><div class="mk" style="font-size:12px;color:var(--muted);margin-bottom:8px">'+t("cm_pets")+'</div>'+pets+'</div>'+
    '<div class="sec-title" style="font-size:14px">'+t("cm_history")+'</div>'+hist+
    '<div class="modal-actions">'+
      '<button class="btn btn-primary btn-sm" onclick="openNewAppt(addDays(1),\''+c.id+'\')">'+t("cli_book")+'</button>'+
      '<button class="btn btn-ghost btn-sm" onclick="openClientEdit(\''+c.id+'\')">'+t("cli_edit")+'</button>'+
      '<button class="btn btn-wa btn-sm full" onclick="winbackClient(\''+c.id+'\')">'+t("cm_winback")+'</button>'+
    '</div>');
}
let _cePets=[];
function openClientEdit(cid){
  const c=cid?(STATE.clients||[]).find(x=>x.id===cid):null;
  _cePets=c?JSON.parse(JSON.stringify(c.pets||[])):[];
  const zoneOpts='<option value=""></option>'+(STATE.zones||[]).map(z=>'<option '+((c&&c.zone===z)?"selected":"")+'>'+esc(z)+'</option>').join("");
  openModal('<div class="modal-head"><div class="av">👤</div><div><h2>'+(c?t("cli_edit"):t("cli_new"))+'</h2></div><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="field"><label>'+t("cli_name")+'</label><input class="input" id="ce_name" value="'+esc(c?c.name:"")+'"></div>'+
    '<div class="row"><div class="field"><label>'+t("cli_phone")+'</label><input class="input" id="ce_phone" inputmode="tel" value="'+esc(c?c.phone:"")+'"></div>'+
    '<div class="field"><label>'+t("cli_email")+'</label><input class="input" id="ce_email" inputmode="email" value="'+esc(c?c.email:"")+'"></div></div>'+
    '<div id="ce_phoneErr" style="display:none;margin:-8px 0 14px"></div>'+
    '<div class="field addr-field"><label>'+t("cli_addr")+'</label><input class="input" id="ce_addr" autocomplete="off" value="'+esc(c?c.addr:"")+'"><div class="addr-sug" id="ce_sug"></div><div class="addr-state" id="ce_state"></div></div>'+
    '<div class="field"><label>'+t("cli_zone")+'</label><select class="input" id="ce_zone">'+zoneOpts+'</select></div>'+
    '<label class="lab-strong">'+t("cli_pets")+'</label><div id="cePets"></div>'+
    '<button class="mini-add" onclick="ceAddPet()">'+t("cli_addPet")+'</button>'+
    '<div class="field"><label>'+t("cli_notes")+'</label><textarea class="input" id="ce_notes">'+esc(c?c.notes:"")+'</textarea></div>'+
    '<div class="modal-actions">'+(c?'<button class="btn btn-danger btn-sm" onclick="deleteClient(\''+c.id+'\')">'+t("delete_btn")+'</button>':'')+
    '<button class="btn btn-primary btn-sm'+(c?'':' full')+'" onclick="saveClient(\''+(c?c.id:"")+'\')">'+t("save_btn")+'</button></div>');
  renderCePets();
  const pi=document.getElementById("ce_phone");
  if(pi)pi.addEventListener("input",()=>{const b=document.getElementById("ce_phoneErr");if(b)b.style.display="none";});
  _ceAddr={addr:c?c.addr:"",lat:c?c.lat:null,lng:c?c.lng:null};
  attachAddr("ce_addr","ce_sug","ce_state",r=>{_ceAddr=r;});
}
let _ceAddr={addr:"",lat:null,lng:null};
function ceAddPet(){_cePets.push({name:"",breed:"",size:"Medium",photo:"",notes:""});renderCePets();}
function ceDelPet(i){_cePets.splice(i,1);renderCePets();}
function ceSet(i,f,v){if(_cePets[i])_cePets[i][f]=v;}
function renderCePets(){
  const el=document.getElementById("cePets");if(!el)return;
  el.innerHTML=_cePets.length?_cePets.map((p,i)=>{
    const sizeOpts=SIZES.map(s=>'<option value="'+s+'" '+(p.size===s?"selected":"")+'>'+sizeLabel(s)+'</option>').join("");
    return '<div class="dogcard" style="padding:11px"><div class="dh"><span class="idx">'+(i+1)+'</span><span class="dt">'+esc(p.name||("#"+(i+1)))+'</span><button class="vx" onclick="ceDelPet('+i+')">✕</button></div>'+
      '<div class="row"><div class="field" style="margin-bottom:8px"><input class="input" placeholder="'+t("petName_ph")+'" value="'+esc(p.name)+'" oninput="ceSet('+i+',\'name\',this.value)"></div>'+
      '<div class="field" style="margin-bottom:8px"><input class="input" list="breedDatalist" placeholder="'+t("breed_lbl")+'" value="'+esc(p.breed)+'" oninput="ceSet('+i+',\'breed\',this.value)"></div></div>'+
      '<div class="field" style="margin-bottom:0"><select class="input" onchange="ceSet('+i+',\'size\',this.value)">'+sizeOpts+'</select></div></div>';
  }).join(""):'<div class="hint" style="padding:4px 0 8px">—</div>';
}
function saveClient(cid){
  const g=x=>document.getElementById(x);
  const name=g("ce_name").value.trim(),phone=g("ce_phone").value.trim();
  if(!name||!phone){toast(t("cli_needName"));return;}
  if(!validPhone(phone)){cePhoneError(t("cli_phoneShort"));return;}
  // Nadie puede quedarse con un numero que ya es de otro cliente.
  const other=phoneOwner(phone,cid);
  if(other){ceDupeBlock(other,cid);return;}
  const pets=_cePets.filter(p=>p.name&&p.name.trim());
  const data={name:name,phone:phone,email:g("ce_email").value.trim(),addr:_ceAddr.addr||g("ce_addr").value.trim(),
    lat:_ceAddr.lat,lng:_ceAddr.lng,zone:g("ce_zone").value,notes:g("ce_notes").value.trim(),pets:pets};
  if(cid){
    const c=(STATE.clients||[]).find(x=>x.id===cid);
    if(c){Object.assign(c,data);c.phoneKey=phoneKey(phone);c.pets=pets;}
  }else{
    const c=Object.assign({id:nid(),phoneKey:phoneKey(phone),createdAt:Date.now(),pets:[]},data);
    c.pets=pets;
    STATE.clients.push(c);
  }
  closeModal();refreshBiz();flushPersist();toast(t("cli_saved"));
}
function cePhoneError(msg,extra){
  const box=document.getElementById("ce_phoneErr");if(!box)return;
  box.style.display="";
  box.innerHTML='<div class="dupe-warn">⚠️ '+msg+(extra||"")+'</div>';
  const inp=document.getElementById("ce_phone");if(inp)inp.scrollIntoView({block:"center",behavior:"smooth"});
}
function ceDupeBlock(other,cid){
  cePhoneError(t("cli_phoneTaken",{n:esc(other.name)}),
    ' <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="openClient(\''+other.id+'\')">'+t("cli_openIt")+'</button>'+
    (cid?' <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="mergeInto(\''+cid+'\',\''+other.id+'\')">'+t("cli_merge",{n:esc(other.name)})+'</button>':''));
}
/* Unir dos fichas: las citas y los perros pasan al cliente que se queda. */
function mergeInto(fromId,toId){
  const from=(STATE.clients||[]).find(x=>x.id===fromId),to=(STATE.clients||[]).find(x=>x.id===toId);
  if(!from||!to)return;
  mergePets(to.pets,from.pets);
  if(!to.email&&from.email)to.email=from.email;
  if(!to.addr&&from.addr){to.addr=from.addr;to.lat=from.lat;to.lng=from.lng;}
  if(from.notes)to.notes=(to.notes?to.notes+" · ":"")+from.notes;
  if(from.name&&norm(from.name)!==norm(to.name)){to.altNames=to.altNames||[];if(to.altNames.indexOf(from.name)<0)to.altNames.push(from.name);}
  STATE.appointments.forEach(a=>{if(a.clientId===fromId){a.clientId=toId;a.owner=to.name;a.phone=to.phone;a.phoneKey=to.phoneKey;}});
  STATE.clients=STATE.clients.filter(x=>x.id!==fromId);
  closeModal();refreshBiz();flushPersist();toast(t("cli_merged",{n:to.name}));
}
function deleteClient(cid){
  if(!confirm(t("confirm_del")))return;
  STATE.clients=STATE.clients.filter(x=>x.id!==cid);
  closeModal();refreshBiz();flushPersist();toast(t("cli_deleted"));
}
function winbackClient(cid){
  const c=(STATE.clients||[]).find(x=>x.id===cid);if(!c)return;
  const s=clientStats(c);
  const days=s.last?daysBetween(s.last,addDays(0)):"—";
  const pet=(c.pets||[])[0];
  const msg=fill(tpl("winback"),{owner:(c.name||"").split(" ")[0],pet:pet?pet.name:"tu peludo",days:days,biz:STATE.brand.name||""});
  if(waOpen(c.phone,msg)){c.winbackAt=Date.now();persist();toast(t("t_msgSent",{n:(c.name||"").split(" ")[0]}));}
}
function openWinbackAll(){
  const cold=(STATE.clients||[]).filter(isColdClient);
  if(!cold.length){toast(t("cli_coldNone"));return;}
  const rows=cold.slice(0,40).map(c=>{
    const s=clientStats(c);
    const d=s.last?daysBetween(s.last,addDays(0)):"—";
    return '<div class="rem-row"><div style="min-width:0"><b>'+esc(c.name)+'</b><div class="rs">'+esc((c.pets||[]).map(p=>p.name).join(", ")||"—")+' · '+(s.last?t("cli_daysAgo",{n:d}):t("cli_never"))+'</div>'+
      '<div class="rs">📲 '+esc(fmtPhone(c.phone)||"—")+'</div></div>'+
      '<div class="ra"><button class="btn btn-wa btn-sm" onclick="winbackClient(\''+c.id+'\')">'+t("rm_send")+'</button></div></div>';
  }).join("");
  openModal('<div class="modal-head"><div class="av">📣</div><div><h2>'+t("cli_winbackAll")+'</h2><div class="mh-sub">'+t("cli_coldCount",{n:cold.length,d:+STATE.settings.coldDays||60})+'</div></div><button class="x" onclick="closeModal()">×</button></div>'+rows+
    '<div class="modal-actions"><button class="btn btn-primary full" onclick="closeModal()">'+t("ok_btn")+'</button></div>');
}

/* ============================================================
   CITA — ficha, edición, duplicado, cobro
   ============================================================ */
function openModal(html){document.getElementById("modalBody").innerHTML='<div class="grab"></div>'+html;document.getElementById("modalBg").classList.add("show");}
function closeModal(){document.getElementById("modalBg").classList.remove("show");}
function chargeSummary(a){
  const bits=[];
  if(a.comboOn)bits.push('<span class="cs-disc">'+t("ch_combo")+'</span>');
  if(+a.discount>0)bits.push('<span class="cs-disc">'+t("ch_discount")+' −'+money(a.discount)+'</span>');
  if(+a.tip>0)bits.push('<span>'+t("ch_tip")+' '+money(a.tip)+'</span>');
  const bal=apptBalance(a);
  if(bal>0.009&&apptPaidAmt(a)>0)bits.push('<span class="cs-bal">'+t("ch_balance")+' '+money(bal)+'</span>');
  if(a.chargeNote)bits.push('<span>📝 '+esc(a.chargeNote)+'</span>');
  return bits.length?'<div class="cs-line">'+bits.join(' · ')+'</div>':'';
}
function openAppt(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const mapUrl=(a.lat&&a.lng)?("https://maps.google.com/?q="+a.lat+","+a.lng):("https://maps.google.com/?q="+encodeURIComponent((a.addr||"")+" "+(a.zone||"")));
  const gopts='<option value="">'+t("m_unassigned")+'</option>'+STATE.staff.map(g=>'<option '+(g.name===a.groomer?'selected':'')+'>'+esc(g.name)+'</option>').join("");
  const vopts='<option value="">'+t("m_unassigned")+'</option>'+STATE.vans.map(v=>{
    const load=vanLoad(a.when,v.id,a.id),cap=vanDailyCap(v);
    return '<option value="'+v.id+'" '+(v.id===a.vanId?'selected':'')+'>'+esc(v.name)+' · '+load+'/'+cap+(load>=cap&&v.id!==a.vanId?' ('+t("van_full")+')':'')+'</option>';
  }).join("");
  const ph=apptPhoto(a);
  const headAv=ph?'<div class="av"><img src="'+esc(ph)+'" alt=""></div>':'<div class="av">'+apptIcon(a)+'</div>';
  const dogRows=apptPets(a).map((p,i)=>'<div class="dog-line"><b>'+esc(p.name)+'</b> · '+esc(p.breed||"")+' · '+sizeLabel(p.size)+
    ' · '+esc((p.svcs||[]).map(id=>svcById(id).name||id).join(" + ")||"—")+' · '+money(petPrice(p))+(p.notes?'<br><span style="font-size:12px">📝 '+esc(p.notes)+'</span>':'')+'</div>').join("");
  const admin=isAdmin();
  let acts='<button class="btn btn-ghost btn-sm" onclick="openApptEdit(\''+a.id+'\')">🗓️ '+t("m_edit")+'</button>';
  acts+='<button class="btn btn-wa btn-sm" onclick="sendOnWay(\''+a.id+'\')">'+t("m_onway")+'</button>';
  if(admin)acts+='<button class="btn btn-ghost btn-sm" onclick="openDuplicate(\''+a.id+'\')">📋 '+t("m_duplicate")+'</button>';
  if(admin)acts+='<button class="btn btn-ghost btn-sm" onclick="openCharge(\''+a.id+'\')">💵 '+t("m_adjust")+'</button>';
  if(a.status==="done")acts+='<button class="btn btn-ghost btn-sm" onclick="undoDone(\''+a.id+'\')">↩︎ '+t("m_reopen")+'</button>';
  if(a.status!=="conf"&&a.status!=="done")acts+='<button class="btn btn-ghost btn-sm" onclick="setStatus(\''+a.id+'\',\'conf\')">'+t("m_confirm")+'</button>';
  if(a.status!=="done")acts+='<button class="btn btn-ghost btn-sm" onclick="setStatus(\''+a.id+'\',\'done\')">'+t("m_markDone")+'</button>';
  if(admin)acts+=(apptBalance(a)>0.009||apptPaidAmt(a)===0)?('<button class="btn btn-gold btn-sm" onclick="openCheckout(\''+a.id+'\')">'+t("m_charge",{amt:money(apptBalance(a))})+'</button>'):('<button class="btn btn-ghost btn-sm" disabled>'+t("m_paid")+'</button>');
  acts+='<button class="btn btn-danger btn-sm" onclick="openCancel(\''+a.id+'\')">'+t("m_cancel")+'</button>';
  openModal('<div class="modal-head">'+headAv+'<div><h2>'+esc(apptPetNames(a))+'</h2><div class="mh-sub">'+esc(apptBreeds(a))+'</div></div><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="mrow"><div class="mi">📅</div><div><div class="mk">'+t("m_dateTime")+'</div><div class="mv">'+fmtDate(a.when)+' · '+fmtTime(a.time)+' – '+fmtTime(addMin(a.time,apptDur(a)))+'</div>'+
    '<div class="mk">'+t("plan_appt",{d:fmtDur(apptDur(a)),b:bufferMin(),libre:fmtTime(addMin(a.time,apptFootprint(a)))})+'</div></div><div class="mr">'+badges(a)+'</div></div>'+
    '<div class="mrow"><div class="mi">✂️</div><div style="min-width:0"><div class="mk">'+t("m_service")+' · '+apptDur(a)+' '+t("m_min")+'</div>'+dogRows+chargeSummary(a)+'</div>'+
    '<div class="mr"><span style="font-family:Fraunces;color:var(--mauve-deep);font-weight:600">'+money(apptTotal(a))+'</span></div></div>'+
    '<div class="mrow"><div class="mi">👤</div><div><div class="mk">'+t("m_client")+'</div><div class="mv">'+esc(a.owner||"")+'</div></div><div class="mr"><a class="mv" href="tel:'+esc(a.phone)+'">'+esc(fmtPhone(a.phone))+'</a></div></div>'+
    '<div class="mrow"><div class="mi">📍</div><div style="min-width:0"><div class="mk">'+t("m_address")+' · '+esc(a.zone||"")+'</div><a class="mv" href="'+mapUrl+'" target="_blank">'+esc(a.addr||"—")+' ↗</a></div></div>'+
    (a.recurring?'<div class="mrow"><div class="mi">🔁</div><div><div class="mk">'+t("m_recurrence")+'</div><div class="mv">'+t("every_lbl",{n:a.recurring})+' · '+dowName(a.when)+' '+fmtTime(a.time)+'</div></div></div>':'')+
    (a.notes?'<div class="mrow"><div class="mi">📝</div><div><div class="mk">'+t("m_notes")+'</div><div class="mv" style="font-weight:400">'+esc(a.notes)+'</div></div></div>':'')+
    (admin?'<div class="mrow"><div class="mi">🚐</div><div style="flex:1"><div class="mk">'+t("m_van")+'</div><select class="input" style="margin-top:4px" onchange="setVan(\''+a.id+'\',this.value)">'+vopts+'</select></div></div>':'')+
    (admin?'<div class="mrow"><div class="mi">🧑‍🔧</div><div style="flex:1"><div class="mk">'+t("m_groomer")+'</div><select class="input" style="margin-top:4px" onchange="setGroomer(\''+a.id+'\',this.value)">'+gopts+'</select></div></div>':'')+
    (a.payments&&a.payments.length?('<div class="sec-title" style="font-size:14px">'+t("fin_payments")+'</div>'+a.payments.map(p=>payLogRow(p,a)).join("")):'')+
    '<div class="modal-actions">'+acts+'</div>');
}
/* ---- editar / reprogramar, con perros múltiples ---- */
let _edPets=[];
function openApptEdit(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  _edPets=JSON.parse(JSON.stringify(apptPets(a)));
  const slotSet=(STATE.slots||[]).slice().sort();
  if(slotSet.indexOf(a.time)<0)slotSet.push(a.time);
  const slotOpts=slotSet.sort().map(s=>'<option value="'+s+'" '+(s===a.time?'selected':'')+'>'+fmtTime(s)+'</option>').join("");
  openModal('<div class="modal-head"><div class="av">🗓️</div><div><h2>'+t("ed_title")+'</h2><div class="mh-sub">'+esc(a.owner||"")+'</div></div><button class="x" onclick="closeModal()">×</button></div>'+
    '<label class="lab-strong">'+t("na_dogs")+'</label><div id="edPets"></div>'+
    '<button class="mini-add" onclick="edAddPet(\''+id+'\')">➕ '+t("bk_addDog")+'</button>'+
    '<div class="row"><div class="field"><label>'+t("ed_date")+'</label><input class="input" id="ed_date" type="date" value="'+a.when+'" onchange="edRecalc(\''+id+'\')"></div>'+
    '<div class="field"><label>'+t("ed_time")+'</label><select class="input" id="ed_time" onchange="edRecalc(\''+id+'\')">'+slotOpts+'</select></div></div>'+
    '<div class="field"><label>'+t("ed_price")+'</label><input class="input" id="ed_price" type="number" inputmode="decimal" step="0.01" value="'+(+a.price||0)+'" oninput="this._touched=true"></div>'+
    '<div class="field"><label>'+t("ed_notes")+'</label><input class="input" id="ed_notes" value="'+esc(a.notes||"")+'"></div>'+
    '<div id="ed_warn" style="font-size:12.5px;font-weight:600;margin:2px 0 10px"></div>'+
    '<div class="modal-actions"><button class="btn btn-ghost btn-sm" onclick="openAppt(\''+id+'\')">'+t("back")+'</button>'+
    '<button class="btn btn-primary btn-sm" onclick="saveApptEdit(\''+id+'\')">'+t("ed_save")+'</button></div>');
  renderEdPets(id);edRecalc(id);
}
function edAddPet(id){_edPets.push({name:"",breed:"",size:"Medium",svcs:[],photo:"",notes:""});renderEdPets(id);edRecalc(id);}
function edDelPet(id,i){_edPets.splice(i,1);if(!_edPets.length)_edPets.push({name:"",breed:"",size:"Medium",svcs:[],photo:"",notes:""});renderEdPets(id);edRecalc(id);}
function edSet(id,i,f,v){if(_edPets[i]){_edPets[i][f]=v;if(f==="size"||f==="breed")edRecalc(id);}}
function edToggleSvc(id,i,sid){
  const p=_edPets[i];if(!p)return;
  const k=p.svcs.indexOf(sid);
  if(k>=0)p.svcs.splice(k,1);
  else{
    const cat=svcById(sid).cat;
    if(!catAllowsMulti(cat))p.svcs=p.svcs.filter(x=>svcById(x).cat!==cat);
    p.svcs.push(sid);
  }
  renderEdPets(id);edRecalc(id);
}
function renderEdPets(id){
  const el=document.getElementById("edPets");if(!el)return;
  el.innerHTML=_edPets.map((p,i)=>{
    const sizeOpts=SIZES.map(s=>'<option value="'+s+'" '+(p.size===s?"selected":"")+'>'+sizeLabel(s)+'</option>').join("");
    const svcs=STATE.services.map(s=>'<label class="ed-svc"><input type="checkbox" '+(p.svcs.indexOf(s.id)>=0?"checked":"")+' onchange="edToggleSvc(\''+id+'\','+i+',\''+s.id+'\')"><span>'+s.icon+' '+esc(s.name)+'</span><span class="pz">'+money(priceFor(s,p.size,p.breed))+'</span></label>').join("");
    return '<div class="dogcard"><div class="dh"><span class="idx">'+(i+1)+'</span><span class="dt">'+esc(p.name||("#"+(i+1)))+'</span><span class="dp">'+money(petPrice(p))+'</span>'+
      (_edPets.length>1?'<button class="vx" onclick="edDelPet(\''+id+'\','+i+')">✕</button>':'')+'</div>'+
      '<div class="row"><div class="field" style="margin-bottom:8px"><input class="input" placeholder="'+t("petName_ph")+'" value="'+esc(p.name)+'" oninput="edSet(\''+id+'\','+i+',\'name\',this.value)"></div>'+
      '<div class="field" style="margin-bottom:8px"><input class="input" list="breedDatalist" placeholder="'+t("breed_lbl")+'" value="'+esc(p.breed)+'" onchange="edSet(\''+id+'\','+i+',\'breed\',this.value);renderEdPets(\''+id+'\')"></div></div>'+
      '<div class="field" style="margin-bottom:8px"><select class="input" onchange="edSet(\''+id+'\','+i+',\'size\',this.value);renderEdPets(\''+id+'\')">'+sizeOpts+'</select></div>'+
      svcs+'</div>';
  }).join("");
}
function edRecalc(id){
  const a=STATE.appointments.find(x=>x.id===id);
  const pi=document.getElementById("ed_price");
  const total=_edPets.reduce((s,p)=>s+petPrice(p),0);
  if(pi&&!pi._touched)pi.value=total;
  const w=document.getElementById("ed_warn");if(!w)return;
  const dur=_edPets.reduce((s,p)=>s+petDur(p),0)||60;
  const st=slotState((document.getElementById("ed_date")||{}).value,(document.getElementById("ed_time")||{}).value,dur,id,false);
  if(st==="free"){w.textContent="✓ "+t("sl_ok");w.style.color="#2f6b4a";}
  else{w.textContent="⚠️ "+t("sl_"+st);w.style.color="#9c2740";}
}
function saveApptEdit(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const pets=_edPets.filter(p=>p.name&&p.name.trim()&&p.svcs.length);
  if(!pets.length){toast(t("na_needFields"));return;}
  const oldWhen=a.when,oldTime=a.time;
  a.pets=pets;
  a.when=document.getElementById("ed_date").value||a.when;
  a.time=document.getElementById("ed_time").value||a.time;
  const p=parseFloat(document.getElementById("ed_price").value);
  a.price=isNaN(p)?pets.reduce((s,x)=>s+petPrice(x),0):p;
  a.notes=document.getElementById("ed_notes").value.trim();
  a.reminded=false;delete a.conflict;
  if(slotState(a.when,a.time,apptDur(a),id,false)!=="free")a.conflict=true;
  const moved=(oldWhen!==a.when||oldTime!==a.time);
  const c=clientOf(a);if(c)mergePets(c.pets,pets);
  closeModal();refreshBiz();flushPersist();toast(t("t_apptUpdated"));
  if(moved&&confirm(t("ed_notify")+"?"))notifyReschedule(a,oldWhen,oldTime);
}
/* ---- duplicar cita a varias fechas ---- */
let _dupDates=[];
function openDuplicate(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const base=new Date(a.when+"T12:00");base.setDate(base.getDate()+7);
  _dupDates=[base.toISOString().slice(0,10)];
  renderDupModal(id,a);
}
function renderDupModal(id,a){
  const slotOpts=(STATE.slots||[]).slice().sort().map(s=>'<option value="'+s+'" '+(s===a.time?"selected":"")+'>'+fmtTime(s)+'</option>').join("");
  const rows=_dupDates.map((d,i)=>'<div class="row" style="gap:8px;margin-bottom:8px"><input class="input" type="date" value="'+d+'" onchange="_dupDates['+i+']=this.value;dupRefresh(\''+id+'\')">'+
    (_dupDates.length>1?'<button class="vx" style="flex:none" onclick="dupDel(\''+id+'\','+i+')">✕</button>':'')+'</div>').join("");
  openModal('<div class="modal-head"><div class="av">📋</div><div><h2>'+t("dup_title")+'</h2><div class="mh-sub">'+esc(apptPetNames(a))+' · '+esc(a.owner||"")+'</div></div><button class="x" onclick="closeModal()">×</button></div>'+
    '<p class="hint">'+t("dup_hint")+'</p>'+
    '<label class="lab-strong">'+t("dup_dates")+'</label><div id="dupRows">'+rows+'</div>'+
    '<button class="mini-add" onclick="dupAdd(\''+id+'\')">'+t("dup_addDate")+'</button>'+
    '<div class="field"><label>'+t("na_time")+'</label><select class="input" id="dup_time">'+slotOpts+'</select></div>'+
    '<div class="modal-actions"><button class="btn btn-ghost btn-sm" onclick="openAppt(\''+id+'\')">'+t("back")+'</button>'+
    '<button class="btn btn-primary btn-sm" onclick="doDuplicate(\''+id+'\')">'+t("dup_create",{n:_dupDates.length})+'</button></div>');
}
function dupAdd(id){
  const last=_dupDates[_dupDates.length-1]||addDays(0);
  const d=new Date(last+"T12:00");d.setDate(d.getDate()+7);
  _dupDates.push(d.toISOString().slice(0,10));
  dupRefresh(id);
}
function dupDel(id,i){_dupDates.splice(i,1);dupRefresh(id);}
function dupRefresh(id){const a=STATE.appointments.find(x=>x.id===id);if(a)renderDupModal(id,a);}
function doDuplicate(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const tt=(document.getElementById("dup_time")||{}).value||a.time;
  let made=0;
  _dupDates.filter(Boolean).forEach(iso=>{
    const c=JSON.parse(JSON.stringify(a));
    c.id=nid();c.when=iso;c.time=tt;c.status="conf";c.payments=[];c.tip=0;c.paid=false;c.paidAmt=0;c.discount=0;
    delete c._reqId;delete c.proposal;delete c.reminded;delete c.remindedAt;delete c.doneAt;delete c.onWayAt;
    delete c.conflict;delete c.seriesId;delete c.chargeNote;
    const v=pickVan(iso,tt,apptDur(c),{zone:c.zone,svcs:allSvcIds(c.pets)});
    if(v)c.vanId=v; else c.conflict=true;
    STATE.appointments.push(c);made++;touchAppts();
  });
  closeModal();refreshBiz();flushPersist();toast(t("t_dupCreated",{n:made}));
}
</script>
<script>
/* ============================================================
   AJUSTE DE MONTO Y COBRO
   ============================================================ */
function chNum(id){const el=document.getElementById(id);return el?(parseFloat(el.value)||0):0;}
function openCharge(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const svcSum=apptServicesTotal(a)||(+a.price||0);
  const comboOpts='<option value="">—</option>'+(STATE.combos||[]).map(c=>'<option value="'+c.id+'">'+esc(c.name)+' · '+money(c.price)+'</option>').join("");
  openModal('<div class="modal-head"><div class="av">💵</div><div><h2>'+t("ch_title")+'</h2><div class="mh-sub">'+esc(apptPetNames(a))+' · '+esc(a.owner||"")+'</div></div><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="ch-line"><span>'+t("ch_subtotal")+' ('+apptPets(a).length+' 🐾)</span><b id="ch_sub">'+money(svcSum)+'</b></div>'+
    ((STATE.combos||[]).length?('<div class="field"><label>'+t("combo_apply")+'</label><select class="input" id="ch_combo" onchange="chargeApplyCombo(\''+id+'\')">'+comboOpts+'</select><p class="hint" style="margin:6px 0 0">'+t("ch_comboHint")+'</p></div>'):'')+
    '<div class="row"><div class="field"><label>'+t("ch_discount")+'</label><input class="input" id="ch_disc" type="number" min="0" step="0.01" inputmode="decimal" value="'+(+a.discount||0)+'" oninput="chargeRecalc(\''+id+'\',\'disc\')"></div>'+
    '<div class="field"><label>'+t("ch_final")+'</label><input class="input" id="ch_price" type="number" min="0" step="0.01" inputmode="decimal" value="'+(+a.price||0)+'" oninput="chargeRecalc(\''+id+'\',\'price\')"></div></div>'+
    '<div class="row"><div class="field"><label>'+t("ch_tip")+'</label><input class="input" id="ch_tip" type="number" min="0" step="0.01" inputmode="decimal" value="'+(+a.tip||0)+'" oninput="chargeRecalc(\''+id+'\',\'tip\')"></div>'+
    '<div class="field"><label>'+t("ch_paidAmt")+'</label><input class="input" id="ch_paid" type="number" min="0" step="0.01" inputmode="decimal" value="'+apptPaidAmt(a)+'" oninput="chargeRecalc(\''+id+'\',\'paid\')"></div></div>'+
    '<div class="ch-quick"><button class="btn btn-ghost btn-sm" onclick="chargeQuick(\''+id+'\',10)">−10%</button><button class="btn btn-ghost btn-sm" onclick="chargeQuick(\''+id+'\',15)">−15%</button><button class="btn btn-ghost btn-sm" onclick="chargeQuick(\''+id+'\',20)">−20%</button><button class="btn btn-ghost btn-sm" onclick="chargeQuick(\''+id+'\',0)">'+t("ch_reset")+'</button><button class="btn btn-ghost btn-sm" onclick="chargeSettle(\''+id+'\')">'+t("ch_settle")+'</button></div>'+
    '<div class="field"><label>'+t("ch_note")+'</label><input class="input" id="ch_note" placeholder="'+t("ch_notePh")+'" value="'+esc(a.chargeNote||"")+'"></div>'+
    '<div class="co-total"><span>'+t("ch_total")+'</span><span id="ch_totalV">—</span></div>'+
    '<div class="ch-line big"><span>'+t("ch_balance")+'</span><b id="ch_balV">—</b></div>'+
    '<div class="modal-actions"><button class="btn btn-ghost btn-sm" onclick="openAppt(\''+id+'\')">'+t("back")+'</button><button class="btn btn-primary btn-sm" onclick="saveCharge(\''+id+'\')">'+t("save_btn")+'</button></div>');
  chargeRecalc(id);
}
function chargeApplyCombo(id){
  const sel=document.getElementById("ch_combo");if(!sel||!sel.value)return;
  const c=comboById(sel.value);if(!c)return;
  document.getElementById("ch_price").value=+c.price||0;
  const note=document.getElementById("ch_note");
  if(note&&!note.value)note.value=t("combo_applied",{n:c.name});
  chargeRecalc(id,"price");
}
function chargeRecalc(id,src){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const sub=apptServicesTotal(a)||(+a.price||0);
  let disc=Math.max(0,chNum("ch_disc")),price=Math.max(0,chNum("ch_price"));
  if(src==="disc"){price=Math.max(0,Math.round((sub-disc)*100)/100);document.getElementById("ch_price").value=price;}
  else if(src==="price"){disc=Math.max(0,Math.round((sub-price)*100)/100);document.getElementById("ch_disc").value=disc;}
  const tip=Math.max(0,chNum("ch_tip")),paid=Math.max(0,chNum("ch_paid"));
  const total=Math.round((price+tip)*100)/100;
  const bal=Math.round((total-paid)*100)/100;
  const tv=document.getElementById("ch_totalV");if(tv)tv.textContent=money(total);
  const bv=document.getElementById("ch_balV");
  if(bv){bv.textContent=bal<=0.009?(t("ch_settled")+(bal<-0.009?" · "+t("ch_change",{amt:money(-bal)}):"")):money(bal);
    bv.style.color=bal<=0.009?"#2f6b4a":"#9c2740";}
}
function chargeQuick(id,pct){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const sub=apptServicesTotal(a)||(+a.price||0);
  document.getElementById("ch_disc").value=Math.round(sub*pct)/100;
  chargeRecalc(id,"disc");
}
function chargeSettle(id){
  const price=Math.max(0,chNum("ch_price")),tip=Math.max(0,chNum("ch_tip"));
  document.getElementById("ch_paid").value=Math.round((price+tip)*100)/100;
  chargeRecalc(id,"paid");
}
function saveCharge(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  const price=Math.max(0,chNum("ch_price")),tip=Math.max(0,chNum("ch_tip")),paid=Math.max(0,chNum("ch_paid"));
  const disc=Math.max(0,chNum("ch_disc"));
  const note=document.getElementById("ch_note").value.trim();
  const sub=apptServicesTotal(a)||(+a.price||0);
  // Si tocaste el precio, hace falta la justificación: así el número siempre tiene explicación.
  if(Math.abs(price-sub)>0.01&&!note){toast(t("ch_needNote"));document.getElementById("ch_note").focus();return;}
  a.price=Math.round(price*100)/100;
  a.tip=Math.round(tip*100)/100;
  a.discount=Math.round(disc*100)/100;
  a.chargeNote=note;
  a.priceAdjusted=true;
  const cur=apptPaidAmt(a);
  const diff=Math.round((paid-cur)*100)/100;
  if(Math.abs(diff)>0.009){
    a.payments=a.payments||[];
    if(diff>0)a.payments.push({id:nid(),amt:diff,method:"manual",at:Date.now(),by:myStaffName(),note:note});
    else{ // ajuste a la baja: se recalcula desde cero
      a.payments=paid>0?[{id:nid(),amt:paid,method:"manual",at:Date.now(),by:myStaffName(),note:note}]:[];
    }
  }
  a.paidAmt=paid;a.paid=isSettled(a)&&paid>0;
  if(a.paid&&!a.paidAt)a.paidAt=Date.now();
  refreshBiz();flushPersist();closeModal();
  const bal=apptBalance(a);
  toast(t("t_chargeSaved",{amt:money(apptTotal(a))})+(bal>0.009?" · "+t("ch_balance")+" "+money(bal):""));
}
/* ---- checkout / punto de venta ---- */
let CO={id:null,tip:0,tipPct:0,method:null,amount:0,manualAmt:false};
function payMethods(){return (STATE.settings.payMethods||[]);}
function openCheckout(id){
  const a=STATE.appointments.find(x=>x.id===id);if(!a)return;
  CO={id:id,tip:+a.tip||0,tipPct:0,method:null,amount:0,manualAmt:false};
  renderCheckout();
}
function coTip(pct){const a=STATE.appointments.find(x=>x.id===CO.id);if(!a)return;CO.tipPct=pct;CO.tip=Math.round((+a.price||0)*pct)/100;renderCheckout();}
function coTipCustom(v){CO.tipPct=-1;CO.tip=Math.max(0,parseFloat(v)||0);coSyncAmount();coTotals();}
function coSyncAmount(){const a=STATE.appointments.find(x=>x.id===CO.id);if(!a||CO.manualAmt)return;CO.amount=Math.max(0,coDue(a));const el=document.getElementById("co_amt");if(el)el.value=CO.amount;}
function coMethod(m){CO.method=m;renderCheckout();}
function coDue(a){return Math.round(((+a.price||0)+CO.tip-apptPaidAmt(a))*100)/100;}
function renderCheckout(){
  const a=STATE.appointments.find(x=>x.id===CO.id);if(!a)return;
  const due=coDue(a);
  if(!CO.manualAmt||CO.amount>due+0.01)CO.amount=Math.max(0,due);
  const tipBtns=[0,15,18,20].map(p=>'<button class="tip-btn '+(CO.tipPct===p?'on':'')+'" onclick="coTip('+p+')">'+(p===0?t("co_noTip"):p+"%")+'</button>').join("")+
    '<input class="input tip-custom" type="number" inputmode="decimal" placeholder="$" value="'+(CO.tipPct===-1&&CO.tip?CO.tip:"")+'" oninput="coTipCustom(this.value)">';
  const methodBtns=payMethods().map(m=>'<button class="pay-m '+(CO.method===m.id?'on':'')+'" onclick="coMethod(\''+m.id+'\')"><span>'+m.icon+'</span>'+esc(m.name)+'</button>').join("");
  const already=apptPaidAmt(a);
  openModal('<div class="modal-head"><div class="av">💳</div><div><h2>'+t("co_title")+'</h2><div class="mh-sub">'+esc(apptPetNames(a))+' · '+esc(a.owner||"")+'</div></div><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="co-lines"><div class="col"><span>'+esc(apptSvcNames(a))+' ('+apptPets(a).length+' 🐾)</span><span>'+money(a.price)+'</span></div>'+
    (already>0?'<div class="col"><span>'+t("ch_paidAmt")+'</span><span>−'+money(already)+'</span></div>':'')+

function exportPayments(){
  const rows=[["date","client","phone","pets","services","method","amount","tip","by","note"]];
  allPayments().forEach(o=>{
    rows.push([new Date(o.p.at||0).toISOString(),o.a.owner||"",fmtPhone(o.a.phone),apptPetNames(o.a),apptSvcNames(o.a),
      payMethodName(o.p.method),o.p.amt,o.a.tip||0,o.p.by||"",(o.p.note||"").replace(/"/g,"'")]);
  });
  const csv=rows.map(r=>r.map(x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"').join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="pagos-"+addDays(0)+".csv";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

   FINANZAS
   ============================================================ */
function completedBetween(from,to){return STATE.appointments.filter(a=>isDone(a)&&apptRevDate(a)>=from&&apptRevDate(a)<=to);}
function renderFinance(){
  if(isStaff())return;
  const today=addDays(0);
  const month=completedBetween(addDays(-30),today);
  const tipsTotal=month.reduce((s,a)=>s+(+a.tip||0),0);
  // La propina es 100% de la groomer: entra y sale. No infla tu ganancia.
  const income=month.reduce((s,a)=>s+(+a.price||0),0);
  const comm={},tipsBy={};let commTotal=0;
  month.forEach(a=>{
    const g=staffByName(a.groomer);
    const tip=+a.tip||0;
    if(g){
      const c=(+a.price||0)*(+g.comm||0)/100;
      comm[g.name]=(comm[g.name]||0)+c;commTotal+=c;
      if(tip)tipsBy[g.name]=(tipsBy[g.name]||0)+tip;
    }else if(tip){
      const k=a.groomer||t("m_unassigned");tipsBy[k]=(tipsBy[k]||0)+tip;
    }
  });
  const exp=(STATE.expenses||[]).reduce((s,e)=>s+(+e.amt||0),0);
  const out=exp+commTotal;const net=income-out;const margin=income?Math.round(net/income*100):0;
  const owed=commTotal+tipsTotal;
  document.getElementById("finStats").innerHTML=
    '<div class="stat"><div class="k">'+t("fin_income")+'</div><div class="v" style="color:var(--ok)">'+money(income)+'</div><div class="d">'+t("fin_thisMonth")+'</div></div>'+
    '<div class="stat"><div class="k">'+t("fin_tipsPayable")+'</div><div class="v" style="color:var(--gold)">'+money(tipsTotal)+'</div><div class="d gold">'+t("fin_tipsNotIncome")+'</div></div>'+
    '<div class="stat"><div class="k">'+t("fin_expenses")+'</div><div class="v" style="color:var(--bad)">'+money(out)+'</div><div class="d">'+t("fin_inclComm")+'</div></div>'+
    '<div class="stat"><div class="k">'+t("fin_net")+'</div><div class="v">'+money(net)+'</div><div class="d" style="color:'+(net>=0?"var(--ok)":"var(--bad)")+'">'+(net>=0?"▲ ":"▼ ")+margin+'% '+t("fin_margin")+'</div></div>'+
    '<div class="stat"><div class="k">'+t("fin_toPay")+'</div><div class="v" style="color:var(--mauve-deep)">'+money(owed)+'</div><div class="d">'+t("fin_toPaySub")+'</div></div>';
  renderPipeline(today,month);
  const weeks=[0,0,0,0,0,0];
  STATE.appointments.filter(isDone).forEach(a=>{
    const diff=daysBetween(apptRevDate(a),today);
    if(diff>=0&&diff<42)weeks[5-Math.floor(diff/7)]+=(+a.price||0);
  });
  const max=Math.max.apply(null,weeks.concat([1]));
  document.getElementById("finChart").innerHTML=weeks.map((v,i)=>'<div class="bar"><span class="val">'+money(v)+'</span><div class="fill" style="height:'+Math.round(v/max*100)+'%"></div><span class="lab">S'+(i+1)+'</span></div>').join("");
  renderTipRows(month,tipsTotal);
  renderPayLog();
  const by={},cnt={};
  month.forEach(a=>{
    const ids=[];apptPets(a).forEach(p=>(p.svcs||[]).forEach(x=>ids.push(x)));
    const per=ids.length?(+a.price||0)/ids.length:0;
    ids.forEach(id=>{by[id]=(by[id]||0)+per;cnt[id]=(cnt[id]||0)+1;});
  });
  const cols=["#A8688A","#C2A24F","#823F61","#D08CA6","#7E6BA8","#4F8A6B"];
  document.getElementById("svcBreakdown").innerHTML=Object.keys(by).sort((a,b)=>by[b]-by[a]).map((id,i)=>{
    const sv=svcById(id);const c=cnt[id]||0;
    return '<div class="fin-row"><div class="lft"><span class="dot" style="background:'+cols[i%cols.length]+'"></span><div><div class="nm">'+esc(sv.name||id)+'</div><div class="sub">'+c+' '+(c===1?t("fin_apptOne"):t("fin_apptMany"))+'</div></div></div><span class="amt in">'+money(by[id])+'</span></div>';
  }).join("")||'<p class="hint">—</p>';
  const owedNames=Object.keys(comm);
  Object.keys(tipsBy).forEach(n=>{if(owedNames.indexOf(n)<0)owedNames.push(n);});
  document.getElementById("commRows").innerHTML=owedNames.map(n=>{
    const g=staffByName(n);
    const c=comm[n]||0,tp=tipsBy[n]||0;
    return '<div class="fin-row"><div class="lft"><span class="dot" style="background:var(--mauve)"></span><div><div class="nm">'+esc(n)+'</div>'+
      '<div class="sub">'+t("fin_commAndTips",{c:money(c),t:money(tp)})+' · '+(g?g.comm:0)+'%</div></div></div>'+
      '<span class="amt out">−'+money(c+tp)+'</span></div>';
  }).join("")||'<p class="hint">'+t("fin_noComm")+'</p>';
  renderExpenseRows();
}
function renderTipRows(month,total){
  const el=document.getElementById("tipRows");if(!el)return;
  const withTip=month.filter(a=>(+a.tip||0)>0);
  if(!withTip.length){el.innerHTML='<p class="hint">'+t("fin_noTips")+'</p>';return;}
  const byG={};withTip.forEach(a=>{const k=a.groomer||t("m_unassigned");byG[k]=byG[k]||{amt:0,n:0};byG[k].amt+=(+a.tip||0);byG[k].n++;});
  const pct=month.length?Math.round(withTip.length/month.length*100):0;
  let html=Object.keys(byG).sort((a,b)=>byG[b].amt-byG[a].amt).map(n=>
    '<div class="fin-row"><div class="lft"><span class="dot" style="background:var(--gold)"></span><div><div class="nm">'+esc(n)+'</div>'+
    '<div class="sub">'+byG[n].n+' '+(byG[n].n===1?t("fin_apptOne"):t("fin_apptMany"))+' · '+t("fin_tipAvg",{amt:money(byG[n].amt/byG[n].n)})+'</div></div></div>'+
    '<span class="amt in">'+money(byG[n].amt)+'</span></div>').join("");
  html+='<div class="fin-row"><div class="lft"><span class="dot" style="background:var(--burgundy)"></span><div><div class="nm">'+t("svc_total")+'</div><div class="sub">'+t("fin_tipPct",{p:pct})+'</div></div></div><span class="amt in">'+money(total)+'</span></div>';
  el.innerHTML=html;
}
function renderPipeline(today,doneMonth){
  const el=document.getElementById("finPipe");if(!el)return;
  const pend=STATE.appointments.filter(a=>isLive(a)&&!isDone(a));
  const overdue=pend.filter(a=>a.when<today);
  const upcoming=pend.filter(a=>a.when>=today);
  const unpaid=doneMonth.filter(a=>!isSettled(a));
  const sum=l=>l.reduce((s,a)=>s+(+a.price||0),0);
  const nAppt=n=>n+" "+t(n===1?"fin_apptOne":"fin_apptMany");
  const row=(icon,color,label,sub,amt,cls)=>'<div class="fin-row"><div class="lft"><span class="dot" style="background:'+color+'"></span><div><div class="nm">'+icon+' '+label+'</div><div class="sub">'+sub+'</div></div></div><span class="amt '+cls+'">'+money(amt)+'</span></div>';
  let html=row("✅","var(--ok)",t("fin_completed"),nAppt(doneMonth.length),sum(doneMonth),"in");
  if(unpaid.length)html+=row("💳","var(--gold)",t("fin_unpaid"),nAppt(unpaid.length),unpaid.reduce((s,a)=>s+apptBalance(a),0),"in");
  html+=row("📅","var(--mauve)",t("fin_booked"),nAppt(upcoming.length),sum(upcoming),"in");
  if(overdue.length)html+='<div class="fin-row overdue"><div class="lft"><span class="dot" style="background:var(--bad)"></span><div><div class="nm">⏰ '+t("fin_overdue")+'</div><div class="sub">'+t("fin_overdue_h",{n:overdue.length})+'</div></div></div><button class="btn btn-primary btn-sm" onclick="closeOverdue()">'+t("fin_closeAll")+'</button></div>';
  el.innerHTML=html;
}
function renderExpenseRows(){
  const el=document.getElementById("expenseRows");if(!el)return;
  el.innerHTML=(STATE.expenses||[]).map((e,i)=>'<div class="fin-row"><div class="lft"><span class="dot" style="background:var(--bad)"></span><div class="nm">'+esc(e.name)+'</div></div><div style="display:flex;align-items:center;gap:8px"><span class="amt out">−'+money(e.amt)+'</span><button onclick="editExpense('+i+')" style="color:var(--mauve);font-size:15px;padding:4px 6px">✎</button><button onclick="deleteExpense('+i+')" style="color:var(--bad);font-size:15px;padding:4px 6px">✕</button></div></div>').join("")||'<p class="hint">'+t("fin_noExp")+'</p>';

function editExpense(i){
  const e=STATE.expenses[i];if(!e)return;
  openModal('<div class="modal-head"><div class="av">💸</div><div><h2>'+t("fin_editExp")+'</h2></div><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="field"><label>'+t("fin_concept")+'</label><input class="input" id="ee_name" value="'+esc(e.name)+'"></div>'+

<script>
/* ============================================================
   NUEVA CITA MANUAL
   ============================================================ */
let NA={pets:[],client:null,addr:{addr:"",lat:null,lng:null,verified:false}};
function naNewPet(){return {uid:nid(),name:"",breed:"",size:"Medium",svcs:[],photo:"",notes:""};}
function openNewAppt(iso,clientId){
  iso=iso||addDays(0);
  const c=clientId?(STATE.clients||[]).find(x=>x.id===clientId):null;
  NA={pets:[],client:c||null,addr:{addr:c?c.addr:"",lat:c?c.lat:null,lng:c?c.lng:null,verified:!!(c&&c.addr)}};
  if(c&&(c.pets||[]).length)NA.pets=c.pets.map(p=>Object.assign(newNaPetFrom(p)));
  if(!NA.pets.length)NA.pets=[naNewPet()];
  const zoneOpts=(STATE.zones||[]).map(z=>'<option '+((c&&c.zone===z)?"selected":"")+'>'+esc(z)+'</option>').join("");
  const grList=isStaff()?STATE.staff.filter(x=>x.id===ME.staffId):STATE.staff;
  const grOpts=(isStaff()?'':'<option value="">'+t("m_unassigned")+'</option>')+grList.map(x=>'<option '+(isStaff()&&x.id===ME.staffId?"selected":"")+'>'+esc(x.name)+'</option>').join("");
  const vanOpts='<option value="">'+t("m_unassigned")+'</option>'+STATE.vans.map(v=>'<option value="'+v.id+'">'+esc(v.name)+'</option>').join("");
  const slotSet=(STATE.slots||[]).slice().sort();
  const slotOpts=slotSet.map(s=>'<option value="'+s+'">'+fmtTime(s)+'</option>').join("");
  openModal('<div class="modal-head"><div class="av">🐾</div><div><h2>'+t("na_title")+'</h2><div class="mh-sub">'+fmtDateLong(iso)+'</div></div><button class="x" onclick="closeModal()">×</button></div>'+
    '<div class="field"><label>'+t("na_existing")+'</label>'+
      '<div id="naClientBox">'+naClientBoxHtml()+'</div></div>'+
    '<div class="row"><div class="field"><label>'+t("m_client")+'</label><input class="input" id="na_client" value="'+esc(c?c.name:"")+'" oninput="naClientTyped()"></div>'+
    '<div class="field"><label>'+t("phone_lbl")+'</label><input class="input" id="na_phone" inputmode="tel" value="'+esc(c?c.phone:"")+'" oninput="naPhoneTyped()"></div></div>'+
    '<div class="field" id="naDupeMsg" style="display:none"></div>'+
    '<div class="field addr-field"><label>'+t("addr_lbl")+'</label><input class="input" id="na_addr" autocomplete="off" value="'+esc(c?c.addr:"")+'"><div class="addr-sug" id="na_sug"></div><div class="addr-state" id="na_state"></div></div>'+
    '<div class="row"><div class="field"><label>'+t("zone_lbl")+'</label><select class="input" id="na_zone">'+zoneOpts+'</select></div>'+
    '<div class="field"><label>Email</label><input class="input" id="na_email" inputmode="email" value="'+esc(c?c.email:"")+'"></div></div>'+
    '<label class="lab-strong">'+t("na_dogs")+'</label><div id="naPets"></div>'+
    '<button class="mini-add" onclick="naAddPet()">➕ '+t("bk_addDog")+'</button>'+
    '<div class="row"><div class="field"><label>'+t("date_lbl")+'</label><input class="input" id="na_date" type="date" value="'+iso+'" onchange="naRecalc()"></div>'+
    '<div class="field"><label>'+t("na_time")+'</label><select class="input" id="na_time" onchange="naRecalc()">'+slotOpts+'</select></div></div>'+
    '<div class="row"><div class="field"><label>'+t("m_groomer")+'</label><select class="input" id="na_groomer">'+grOpts+'</select></div>'+
    '<div class="field"><label>'+t("m_van")+'</label><select class="input" id="na_van">'+vanOpts+'</select></div></div>'+
    '<div class="field"><label>'+t("ed_price")+'</label><input class="input" id="na_price" type="number" step="0.01" inputmode="decimal" oninput="this._touched=true"></div>'+
    '<div class="field"><label>'+t("m_notes")+'</label><input class="input" id="na_notes"></div>'+
    '<label class="check-line"><input type="checkbox" id="na_recur" onchange="naRecalc()"><span><span class="t">'+t("na_recur")+'</span><span class="d">'+t("recur_d")+'</span></span></label>'+
    '<div class="field" id="naRecurWrap" style="display:none"><select class="input" id="na_recurEvery" onchange="naRecalc()">'+
      [2,3,4,6,8].map(n=>'<option value="'+n+'" '+(n===4?"selected":"")+'>'+t("every"+n)+'</option>').join("")+'</select>'+
      '<div class="hint" id="naRecurNote" style="margin-top:6px"></div></div>'+
    '<div id="na_warn" style="font-size:12.5px;font-weight:600;margin:2px 0 10px"></div>'+
    '<div class="modal-actions"><button class="btn btn-primary full" onclick="saveNewAppt()">'+t("na_save")+'</button></div>');
  renderNaPets();naRecalc();
  attachAddr("na_addr","na_sug","na_state",r=>{NA.addr=r;});
  if(c&&c.addr)setAddrState("okv","✓ "+t("addr_ok"),document.getElementById("na_state"));
}
function newNaPetFrom(p){return {uid:nid(),name:p.name||"",breed:p.breed||"",size:p.size||"Medium",svcs:[],photo:p.photo||"",notes:p.notes||""};}
function naClientBoxHtml(){
  if(NA.client)return '<div class="cli-card" style="margin:0"><div class="cli-avatar">👤</div><div class="ci"><div class="cn">'+esc(NA.client.name)+'</div><div class="cd">'+esc(fmtPhone(NA.client.phone))+' · '+esc((NA.client.pets||[]).map(p=>p.name).join(", ")||"—")+'</div></div><button class="vx" onclick="naClearClient()">✕</button></div>';
  return '<input class="input" id="na_search" placeholder="'+t("na_pickClient")+'" oninput="naSearchClients(this.value)" autocomplete="off"><div id="naResults"></div>';
}
function naSearchClients(q){
  const el=document.getElementById("naResults");if(!el)return;
  if(!q||q.length<2){el.innerHTML="";return;}
  const list=(STATE.clients||[]).filter(c=>matches(clientHaystack(c),q)).slice(0,6);
  el.innerHTML=list.length?list.map(c=>'<button class="cli-card" style="margin:8px 0 0" onclick="naPickClient(\''+c.id+'\')"><div class="cli-avatar">👤</div><div class="ci"><div class="cn">'+esc(c.name)+'</div><div class="cd">'+esc(fmtPhone(c.phone))+' · '+esc((c.pets||[]).map(p=>p.name).join(", ")||"—")+'</div></div></button>').join(""):'<div class="hint" style="padding:8px 2px">'+t("res_none",{q:esc(q)})+'</div>';
}
function naPickClient(cid){
  const c=(STATE.clients||[]).find(x=>x.id===cid);if(!c)return;
  NA.client=c;
  document.getElementById("naClientBox").innerHTML=naClientBoxHtml();
  const g=x=>document.getElementById(x);
  g("na_client").value=c.name||"";g("na_phone").value=c.phone||"";g("na_email").value=c.email||"";g("na_addr").value=c.addr||"";
  if(c.zone)g("na_zone").value=c.zone;
  NA.addr={addr:c.addr||"",lat:c.lat||null,lng:c.lng||null,verified:!!c.addr};
  setAddrState("okv","✓ "+t("addr_ok"),document.getElementById("na_state"));
  if((c.pets||[]).length){NA.pets=c.pets.map(newNaPetFrom);renderNaPets();naRecalc();}
  const d=document.getElementById("naDupeMsg");if(d)d.style.display="none";
}
function naClearClient(){NA.client=null;document.getElementById("naClientBox").innerHTML=naClientBoxHtml();}
function naClientTyped(){const d=document.getElementById("naDupeMsg");if(d)d.style.display="none";}
/* Avisa en el momento si ese teléfono ya es de un cliente: nunca se duplica. */
function naPhoneTyped(){
  const v=(document.getElementById("na_phone")||{}).value||"";
  const d=document.getElementById("naDupeMsg");if(!d)return;
  const c=findClientByPhone(v);
  if(c&&(!NA.client||NA.client.id!==c.id)){
    d.style.display="";
    d.innerHTML='<div class="hint" style="background:#fdf7e6;border:1px solid rgba(194,162,79,.6);color:#8a6d1f;padding:10px 12px;border-radius:10px">'+
      t("cli_dupe",{n:esc(c.name)})+' <button class="btn btn-ghost btn-sm" style="margin-left:6px" onclick="naPickClient(\''+c.id+'\')">'+t("cli_merge",{n:esc(c.name)})+'</button></div>';
  }else d.style.display="none";
}
function naAddPet(){NA.pets.push(naNewPet());renderNaPets();naRecalc();}
function naDelPet(uid){NA.pets=NA.pets.filter(p=>p.uid!==uid);if(!NA.pets.length)NA.pets=[naNewPet()];renderNaPets();naRecalc();}
function naSet(uid,f,v){const p=NA.pets.find(x=>x.uid===uid);if(!p)return;p[f]=v;if(f==="breed"||f==="size")naRecalc();}
function naToggleSvc(uid,sid){
  const p=NA.pets.find(x=>x.uid===uid);if(!p)return;
  const k=p.svcs.indexOf(sid);
  if(k>=0)p.svcs.splice(k,1);
  else{const cat=svcById(sid).cat;if(!catAllowsMulti(cat))p.svcs=p.svcs.filter(x=>svcById(x).cat!==cat);p.svcs.push(sid);}
  renderNaPets();naRecalc();
}
function renderNaPets(){
  const el=document.getElementById("naPets");if(!el)return;
  el.innerHTML=NA.pets.map((p,i)=>{
    const sizeOpts=SIZES.map(s=>'<option value="'+s+'" '+(p.size===s?"selected":"")+'>'+sizeLabel(s)+'</option>').join("");
    const svcs=STATE.services.map(s=>'<label class="ed-svc"><input type="checkbox" '+(p.svcs.indexOf(s.id)>=0?"checked":"")+' onchange="naToggleSvc(\''+p.uid+'\',\''+s.id+'\')"><span>'+s.icon+' '+esc(s.name)+'</span><span class="pz">'+money(priceFor(s,p.size,p.breed))+'</span></label>').join("");
    return '<div class="dogcard"><div class="dh"><span class="idx">'+(i+1)+'</span><span class="dt">'+esc(p.name||("#"+(i+1)))+'</span><span class="dp">'+money(petPrice(p))+'</span>'+
      (NA.pets.length>1?'<button class="vx" onclick="naDelPet(\''+p.uid+'\')">✕</button>':'')+'</div>'+
      '<div class="row"><div class="field" style="margin-bottom:8px"><input class="input" placeholder="'+t("petName_ph")+'" value="'+esc(p.name)+'" oninput="naSet(\''+p.uid+'\',\'name\',this.value)"></div>'+
      '<div class="field" style="margin-bottom:8px"><input class="input" list="breedDatalist" placeholder="'+t("breed_lbl")+'" value="'+esc(p.breed)+'" onchange="naSet(\''+p.uid+'\',\'breed\',this.value);renderNaPets()"></div></div>'+
      '<div class="field" style="margin-bottom:8px"><select class="input" onchange="naSet(\''+p.uid+'\',\'size\',this.value);renderNaPets()">'+sizeOpts+'</select></div>'+
      svcs+'</div>';
  }).join("");
}
function naRecalc(){
  const total=NA.pets.reduce((s,p)=>s+petPrice(p),0);
  const pi=document.getElementById("na_price");
  if(pi&&!pi._touched)pi.value=total;
  const rc=document.getElementById("na_recur"),wrap=document.getElementById("naRecurWrap");
  if(rc&&wrap)wrap.style.display=rc.checked?"":"none";
  const d=(document.getElementById("na_date")||{}).value,tt=(document.getElementById("na_time")||{}).value;
  const note=document.getElementById("naRecurNote");
  if(note&&rc&&rc.checked&&d&&tt)note.textContent=t("recur_note",{dow:dowName(d),time:fmtTime(tt),n:(document.getElementById("na_recurEvery")||{}).value||4});
  const w=document.getElementById("na_warn");if(!w)return;
  const zone=(document.getElementById("na_zone")||{}).value;
  const dur=NA.pets.reduce((s,p)=>s+petDur(p),0)||60;
  const o={zone:zone,svcs:allSvcIds(NA.pets)};
  const st=slotState(d,tt,dur,null,false,o);
  const free=freeVansAt(d,tt,dur,o),left=daySeatsLeft(d,o);
  const plan='<div class="time-plan">'+t("plan_line",{
      n:NA.pets.length,d:fmtDur(dur),b:bufferMin(),
      ini:fmtTime(tt),fin:fmtTime(addMin(tt,dur)),libre:fmtTime(addMin(tt,dur+bufferMin()))})+'</div>';
  if(st==="free"){
    w.innerHTML='<span style="color:#2f6b4a">✓ '+t("sl_ok")+' · '+
      t("seats_left",{n:left,v:esc((vanById(free[0].id)||free[0]).name||"")})+'</span>'+plan;
  }else{
    w.innerHTML='<span style="color:#9c2740">⚠️ '+t("sl_"+st)+(st==="full"?" · "+t("seats_none"):"")+'</span>'+plan;
  }
}
function allSvcIds(pets){const o=[];(pets||[]).forEach(p=>(p.svcs||[]).forEach(id=>{if(o.indexOf(id)<0)o.push(id);}));return o;}
function saveNewAppt(){
  const g=x=>document.getElementById(x);
  const client=g("na_client").value.trim();
  const phone=g("na_phone").value.trim();
  const pets=NA.pets.filter(p=>p.name.trim()&&p.svcs.length).map(p=>({name:p.name.trim(),breed:p.breed.trim(),size:p.size,svcs:p.svcs.slice(),photo:p.photo,notes:p.notes}));
  if(!client||!pets.length){toast(t("na_needFields"));return;}
  const zone=g("na_zone").value;
  const groomer=g("na_groomer").value||((STATE.staff[0]||{}).name||"");
  const st=staffByName(groomer);
  const addr=NA.addr.addr||g("na_addr").value.trim();
  const c=upsertClient({name:client,phone:phone,email:g("na_email").value.trim(),addr:addr,zone:zone,
    lat:NA.addr.lat,lng:NA.addr.lng,pets:pets},{keepName:true});
  const price=parseFloat(g("na_price").value);
  const a=normalizeAppt({id:nid(),pets:pets,owner:client,phone:phone,phoneKey:phoneKey(phone),email:g("na_email").value.trim(),
    addr:addr,lat:NA.addr.lat,lng:NA.addr.lng,zone:zone,when:g("na_date").value,time:g("na_time").value,
    price:isNaN(price)?pets.reduce((s,p)=>s+petPrice(p),0):price,
    groomer:groomer,staffId:st?st.id:"",
    vanId:g("na_van").value||pickVan(g("na_date").value,g("na_time").value,pets.reduce((s,x)=>s+petDur(x),0),{zone:zone,svcs:allSvcIds(pets)})||vanForGroomer(groomer,zone),
    status:"conf",paid:false,notes:g("na_notes").value.trim(),clientId:c.id,
    createdBy:(ME.staffId||"owner"),createdByName:(isStaff()?myStaffName():(ME.name||"")),createdAt:Date.now(),
    recurring:g("na_recur").checked?(+g("na_recurEvery").value||4):null,payments:[],tip:0,discount:0});
  if(slotState(a.when,a.time,apptDur(a),null,false)!=="free")a.conflict=true;
  STATE.appointments.push(a);
  let extra=0;
  if(a.recurring)extra=genRepeats(a);
  STATE.cal.sel=a.when;
  closeModal();refreshBiz();flushPersist();
  toast(t("t_apptCreated")+(extra?" · +"+extra:""));
}

/* ============================================================
   AJUSTES
   ============================================================ */
function setSetting(k,v){STATE.settings[k]=v;markDirty();}
function toggleRule(k,el){STATE.settings[k]=!STATE.settings[k];el.classList.toggle("on",!!STATE.settings[k]);markDirty();}
function toggleReminder(k,el){STATE.settings.reminders[k]=!STATE.settings.reminders[k];el.classList.toggle("on");renderReminderPreview();markDirty();}
function updateRules(){
  const n=(id,d)=>{const e=document.getElementById(id);const v=e?parseFloat(e.value):NaN;return isNaN(v)?d:v;};
  STATE.settings.deposit=n("depAmt",0);
  STATE.settings.vanDailyLimit=Math.max(1,n("vanSlots",4));
  STATE.settings.bufferMin=Math.max(0,n("bufMin",15));
  STATE.settings.minWindow=n("minWindow",12);
  STATE.settings.repeatCount=Math.max(1,Math.min(26,n("repCount",6)));
  STATE.settings.coldDays=Math.max(15,n("coldDays",60));
  STATE.settings.etaMin=Math.max(5,n("etaMin",20));
  markDirty();toast(t("t_rulesUpd"));
}
function renderConfig(){
  const g=x=>document.getElementById(x);
  if(g("cfgName"))g("cfgName").value=STATE.brand.name||"";
  if(g("cfgTag"))g("cfgTag").value=STATE.brand.tag||"";
  if(g("payLink"))g("payLink").value=STATE.settings.payLink||"";
  if(g("payNote"))g("payNote").value=STATE.settings.payNote||"";
  if(g("mapsKey"))g("mapsKey").value=STATE.settings.mapsKey||"";
  applyLogo();
  g("swatches").innerHTML=PALETTE.map(c=>'<div class="sw '+(STATE.brand.color===c?'on':'')+'" style="background:'+c+'" onclick="pickColor(\''+c+'\')"></div>').join("");
  renderZoneChips();renderVanEditor();renderStaffEditor();renderComboEditor();renderPayMethodEditor();
  g("svcEditor").innerHTML=STATE.categories.map(cat=>{
    const svs=STATE.services.filter(s=>s.cat===cat.id);
    const rows=svs.map(s=>{
      const lock=((s.groomers&&s.groomers.length)||(s.vans&&s.vans.length))?'<span class="svc-lock">🔒</span>':'';
      return '<button class="svc-edit2" onclick="openSvcEdit(\''+s.id+'\')"><span class="se-ic">'+s.icon+'</span><span class="se-nm">'+esc(s.name)+lock+'<br><span class="se-sub">'+s.dur+' '+t("m_min")+' · '+priceRange(s)+'</span></span><span class="se-go">✎</span></button>';
    }).join("")||'<div class="se-empty">'+t("svc_emptyCat")+'</div>';
    return '<div class="svc-cat"><div class="svc-cat-h"><span class="folder">📁 '+esc(cat.name)+'</span><button class="svc-cat-edit" onclick="openCatEdit(\''+cat.id+'\')">✎</button></div>'+rows+'</div>';
  }).join("");
  g("hoursGrid").innerHTML=STATE.hours.map((h,i)=>'<div class="hour-row '+(h.on?'':'off')+'"><span class="day">'+t("days")[i]+'</span><div class="toggle '+(h.on?'on':'')+'" onclick="toggleDay('+i+')"></div><div class="times"><input class="input" type="time" value="'+h.from+'" onchange="setHour('+i+',\'from\',this.value)">–<input class="input" type="time" value="'+h.to+'" onchange="setHour('+i+',\'to\',this.value)"></div></div>').join("");
  g("slotEditor").innerHTML=(STATE.slots||[]).slice().sort().map(s=>'<span class="chip">'+fmtTime(s)+'<button onclick="removeSlot(\''+s+'\')">×</button></span>').join("")||'<span class="hint">'+t("no_slots")+'</span>';
  const set=STATE.settings;
  if(g("depAmt"))g("depAmt").value=set.deposit;
  if(g("vanSlots"))g("vanSlots").value=+set.vanDailyLimit||4;
  if(g("bufMin"))g("bufMin").value=bufferMin();
  renderCapBox();
  if(g("minWindow"))g("minWindow").value=set.minWindow;
  if(g("repCount"))g("repCount").value=set.repeatCount;
  if(g("coldDays"))g("coldDays").value=set.coldDays;
  if(g("rmTiming"))g("rmTiming").value=set.reminders.timing;
  g("rmEmail").classList.toggle("on",!!set.reminders.email);
  g("rmSms").classList.toggle("on",!!set.reminders.sms);
  g("rmWa").classList.toggle("on",!!set.reminders.whatsapp);
  g("rlGeo").classList.toggle("on",set.midTnOnly!==false);
  const note=g("szNote");
  if(note)note.textContent=STATE.appointments.length+" "+t("tab_bookings").toLowerCase()+" · "+(STATE.clients||[]).length+" "+t("tab_clients").toLowerCase()+" · "+t("cfg_storageSub");
  renderReminderPreview();
}
/* Resumen legible: cuántas citas caben al día con las vans registradas. */
function renderCapBox(){
  const el=document.getElementById("capBox");if(!el)return;
  const vans=allVans();
  const total=vans.reduce((s,v)=>s+vanDailyCap(v),0);
  const detalle=vans.map(v=>esc(v.name)+" × "+vanDailyCap(v)).join("  ·  ");
  el.innerHTML='<div class="cap-total">'+t("cap_total",{n:total})+'</div>'+
    '<div class="cap-detail">'+detalle+'</div>'+
    '<div class="cap-hint">'+t("cap_hint")+' '+t("cap_buffer",{b:bufferMin()})+'</div>';
}
function priceRange(s){
  const vals=SIZES.map(sz=>basePriceFor(s,sz));
  const mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  const base=mn===mx?money(mn):money(mn)+"–"+money(mx);
  const n=(s.breedPrices||[]).length;
  return base+(n?' <span class="se-breed">🐕 '+n+'</span>':'');
}
function renderZoneChips(){document.getElementById("zoneChips").innerHTML=(STATE.zones||[]).map((z,i)=>'<span class="chip">'+esc(z)+'<button onclick="removeZone('+i+')">×</button></span>').join("");}
function addZone(){const e=document.getElementById("zoneInput");const v=e.value.trim();if(!v)return;STATE.zones.push(v);e.value="";renderConfig();renderZones();markDirty();toast(t("t_zoneAdded"));}
function removeZone(i){STATE.zones.splice(i,1);renderConfig();renderZones();markDirty();}
function addSlot(){const v=document.getElementById("slotInput").value;if(!v||!/^\d\d:\d\d$/.test(v))return;if((STATE.slots||[]).indexOf(v)<0){STATE.slots.push(v);STATE.slots.sort();renderConfig();markDirty();toast(t("t_slotAdded"));}}

async function saveStaff(sid){
  const g=x=>document.getElementById(x);
  const name=g("se_name").value.trim();
  if(!name){toast(t("staff_needName"));return;}
  const email=g("se_email").value.trim().toLowerCase();
  const comm=parseFloat(g("se_comm").value)||0;
  const role=g("se_role").value;
  let s=sid?(STATE.staff||[]).find(x=>x.id===sid):null;
  const oldName=s?s.name:"";
  if(!s){s={id:"g"+Date.now().toString(36),name:name,comm:comm,email:email,role:role,invited:false};STATE.staff.push(s);}
  else{
    s.name=name;s.comm=comm;s.role=role;
    if(oldName&&oldName!==name){
      STATE.appointments.forEach(a=>{if(a.groomer===oldName)a.groomer=name;});
      STATE.vans.forEach(v=>{if(v.groomer===oldName)v.groomer=name;});
    }
  }
  const emailChanged=s.email!==email;
  s.email=email;
  closeModal();refreshBiz();flushPersist();
  if(email&&emailChanged&&FB&&BIZ_ID&&isOwner()){
    try{
      await fbDB.collection("staffInvites").doc(email).set({bizId:BIZ_ID,staffId:s.id,name:name,role:role,
        bizName:STATE.brand.name||"",createdAt:Date.now()},{merge:true});
      s.invited=true;renderStaffEditor();flushPersist();toast(t("staff_invited"));
    }catch(e){console.warn("invite:",e);toast(t("staff_inviteErr")+" "+friendlyError(e));}
  }else toast(t("staff_saved"));
}
function deleteStaff(sid){
  if(!confirm(t("confirm_del")))return;
  STATE.staff=(STATE.staff||[]).filter(x=>x.id!==sid);
  closeModal();refreshBiz();flushPersist();toast(t("staff_deleted"));
}

function addBreedPrice(){
  const b=document.getElementById("bp_breed").value.trim();

  if(!b||isNaN(p)){toast(t("svc_breedNeed"));return;}

  openModal('<div class="modal-head"><div class="av">📁</div><div><h2>'+(isNew?t("svc_addCat"):t("svc_editCat"))+'</h2></div><button class="x" onclick="closeModal()">×</button></div>'+

function saveCat(id,isNew){
  const name=document.getElementById("cat_name").value.trim();if(!name){toast(t("svc_needName"));return;}
  const multi=!!document.getElementById("cat_multi").checked;
  if(isNew)STATE.categories.push({id:id,name:name,multi:multi});
  else{const c=catById(id);c.name=name;c.multi=multi;}
  // Si deja de aceptar varias, se limpian las selecciones sobrantes de las citas abiertas.
  if(!multi)STATE.appointments.forEach(a=>{
    if(!isLive(a)||isDone(a))return;
    apptPets(a).forEach(p=>{
      const seen={};
      p.svcs=(p.svcs||[]).filter(sid=>{const k=svcById(sid).cat;if(k!==id)return true;if(seen[k])return false;seen[k]=1;return true;});
    });
  });
  closeModal();refreshBiz();flushPersist();toast(t("t_catSaved"));
}
function deleteCat(id){
  if(STATE.categories.length<=1)return;
  const fallback=STATE.categories.find(c=>c.id!==id).id;
  STATE.services.forEach(s=>{if(s.cat===id)s.cat=fallback;});
  STATE.categories=STATE.categories.filter(c=>c.id!==id);
  closeModal();refreshBiz();flushPersist();toast(t("t_catDeleted"));
}

/* ===== marca ===== */
function pickColor(c){STATE.brand.color=c;applyColor(c);renderConfig();setupPWA();markDirty();}
function applyColor(c){
  document.documentElement.style.setProperty('--mauve',c);
  const bm=document.getElementById("brandMark");
  if(bm&&!STATE.brand.logo)bm.style.background='linear-gradient(150deg,'+c+','+shade(c,-28)+')';
}
function shade(hex,amt){
  try{let n=parseInt(String(hex).slice(1),16);
    let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
    r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
    return "#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");}catch(e){return hex;}
}
function applyBrand(){
  const n=document.getElementById("cfgName"),g=document.getElementById("cfgTag");
  if(n)STATE.brand.name=n.value;
  if(g)STATE.brand.tag=g.value;
  const bn=document.getElementById("brandName");if(bn)bn.textContent=STATE.brand.name||"—";
  const bt=document.getElementById("brandTag");if(bt)bt.textContent=STATE.brand.tag||t("default_tagline");
  const bz=document.getElementById("bizName");if(bz)bz.textContent=STATE.brand.name||"—";
  applyLogo();applyWordmark();setupPWA();renderReminderPreview();markDirty();
}
