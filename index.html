  if(!Array.isArray(STATE.reqHistory))STATE.reqHistory=[];
  if(!Array.isArray(STATE.cancellations))STATE.cancellations=[];
  if(!Array.isArray(STATE.expenses))STATE.expenses=[];
  (STATE.vans||[]).forEach(v=>{if(!Array.isArray(v.zones)){v.zones=v.zone?[v.zone]:[];delete v.zone;}});
  (STATE.staff||[]).forEach((s,i)=>{if(!s.id)s.id="g"+(i+1)+Date.now().toString(36);if(!s.role)s.role="groomer";if(s.email==null)s.email="";});
}
function migrateServices(){
  if(!STATE.categories||!STATE.categories.length)STATE.categories=[{id:"c1",name:"General"}];
  STATE.categories.forEach(c=>{if(c.multi===undefined)c.multi=looksLikeAddons(c.name);});
  (STATE.services||[]).forEach(s=>{
    if(!s.cat||!STATE.categories.find(c=>c.id===s.cat))s.cat=STATE.categories[0].id;
    if(s.prices){const p={};Object.keys(s.prices).forEach(k=>{p[fixSize(k)]=s.prices[k];});s.prices=p;}
    if(!s.prices){s.prices={};SIZES.forEach(sz=>s.prices[sz]=Math.round((s.base||0)*(SIZE_MULT[sz]||1)));}
    SIZES.forEach(sz=>{if(s.prices[sz]==null)s.prices[sz]=Math.round((s.base||0)*(SIZE_MULT[sz]||1));});
    if(!Array.isArray(s.groomers))s.groomers=[];
    if(!Array.isArray(s.vans))s.vans=[];
    if(!Array.isArray(s.breedPrices))s.breedPrices=[];
  });
}
function migrateClients(){
  (STATE.clients||[]).forEach(c=>{
    if(!c.id)c.id=nid();
    c.phoneKey=phoneKey(c.phone);
    if(!Array.isArray(c.pets))c.pets=[];
    c.pets.forEach(p=>{p.size=fixSize(p.size);if(p.name==null)p.name="";});
  });
  // Reconstruye clientes a partir de citas viejas si la lista está vacía.
  if(!(STATE.clients||[]).length&&(STATE.appointments||[]).length){
    const map={};
    STATE.appointments.forEach(a=>{
      const k=a.phoneKey||phoneKey(a.phone)||("n_"+norm(a.owner||""));
      if(!k)return;
      if(!map[k])map[k]={id:nid(),name:a.owner||"—",phone:a.phone||"",phoneKey:phoneKey(a.phone),email:a.email||"",
        addr:a.addr||"",zone:a.zone||"",lat:a.lat||null,lng:a.lng||null,pets:[],notes:"",createdAt:Date.now()};
      const c=map[k];
      if(a.when&&(!c.lastSeen||a.when>c.lastSeen))c.lastSeen=a.when;
      apptPets(a).forEach(p=>{if(p.name&&p.name!=="—"&&!c.pets.find(x=>norm(x.name)===norm(p.name)))
        c.pets.push({name:p.name,breed:p.breed||"",size:p.size||"Medium",photo:p.photo||"",notes:p.notes||""});});
    });
    STATE.clients=Object.values(map);
  }
}
function migrateAll(){
  migrateSettings();migrateServices();
  (STATE.appointments||[]).forEach(normalizeAppt);
  (STATE.reqHistory||[]).forEach(h=>{if(h.size)h.size=fixSize(h.size);});
  migrateClients();
}

/* ===== clientes: alta, dedupe y unión ===== */
function findClientByPhone(p){const k=phoneKey(p);if(!k||k.length<7)return null;return (STATE.clients||[]).find(c=>c.phoneKey===k)||null;}
/* Regla dura: dos clientes no pueden compartir el mismo numero. */
function phoneOwner(p,exceptId){const c=findClientByPhone(p);return (c&&c.id!==exceptId)?c:null;}
function validPhone(p){return phoneKey(p).length>=10;}
function findClientByName(n){const k=norm(n);if(!k)return null;return (STATE.clients||[]).find(c=>norm(c.name)===k)||null;}
function mergePets(dst,src){
  (src||[]).forEach(p=>{
    if(!p||!p.name)return;
    const ex=dst.find(x=>norm(x.name)===norm(p.name));
    if(ex){if(!ex.breed&&p.breed)ex.breed=p.breed;if(p.size&&ex.size==="Medium")ex.size=p.size;if(!ex.photo&&p.photo)ex.photo=p.photo;}
    else dst.push({name:p.name,breed:p.breed||"",size:p.size||"Medium",photo:p.photo||"",notes:p.notes||""});
  });
  return dst;
}
/* Devuelve el cliente (creado o unido). Nunca duplica por teléfono. */
function upsertClient(data,opts){
  opts=opts||{};
  const k=phoneKey(data.phone);
  let c=k&&k.length>=7?findClientByPhone(data.phone):null;
  if(!c&&opts.matchName!==false&&!k)c=findClientByName(data.name);
  if(c){
    let merged=false;
    if(data.name&&norm(data.name)!==norm(c.name)&&!opts.keepName){c.altNames=c.altNames||[];if(c.altNames.indexOf(data.name)<0&&data.name!==c.name)c.altNames.push(data.name);merged=true;}
    if(data.email&&!c.email)c.email=data.email;
    if(data.addr&&data.addr!==c.addr){c.addr=data.addr;if(data.lat)c.lat=data.lat;if(data.lng)c.lng=data.lng;}
    if(data.zone)c.zone=data.zone;
    if(data.notes&&!c.notes)c.notes=data.notes;
    if(data.phone&&!c.phone)c.phone=data.phone;
    mergePets(c.pets,data.pets);
    c.phoneKey=phoneKey(c.phone);
    if(merged&&opts.warn)toast(t("cli_dupe",{n:c.name}));
    return c;
  }
  c={id:nid(),name:data.name||"—",phone:data.phone||"",phoneKey:k,email:data.email||"",addr:data.addr||"",
     zone:data.zone||"",lat:data.lat||null,lng:data.lng||null,pets:[],notes:data.notes||"",createdAt:Date.now()};
  mergePets(c.pets,data.pets);
  STATE.clients.push(c);
  return c;
}
function clientOf(a){
  if(a.clientId){const c=(STATE.clients||[]).find(x=>x.id===a.clientId);if(c)return c;}
  return findClientByPhone(a.phone)||findClientByName(a.owner);
}
function clientAppts(c){
  const k=c.phoneKey;
  return STATE.appointments.filter(a=>(a.clientId&&a.clientId===c.id)||(k&&(a.phoneKey||phoneKey(a.phone))===k)||norm(a.owner)===norm(c.name));
}
function clientStats(c){
  const list=clientAppts(c);
  const done=list.filter(isDone);
  const spent=done.reduce((s,a)=>s+apptTotal(a),0);
  let last="";done.forEach(a=>{if(a.when>last)last=a.when;});
  if(!last&&c.lastSeen)last=c.lastSeen;
  const next=list.filter(a=>isLive(a)&&!isDone(a)&&a.when>=addDays(0)).sort((a,b)=>a.when.localeCompare(b.when))[0]||null;
  return {visits:done.length,spent:spent,last:last,next:next,all:list};
}
function isColdClient(c){
  const st=clientStats(c);
  if(st.next)return false;
  const d=+STATE.settings.coldDays||60;
  if(!st.last)return st.visits===0&&(!c.createdAt||daysBetween(new Date(c.createdAt).toISOString().slice(0,10),addDays(0))>d);
  return daysBetween(st.last,addDays(0))>d;
}

/* ============================================================
   DISPONIBILIDAD — modelo de cupos por van
   Regla: cada van tiene N cupos por día (4 por defecto).
   Una cita ocupa UN cupo de UNA van. El día se llena solo
   cuando todas las vans agotaron sus cupos.
   Escala sin problema: agregar vans suma capacidad, y los
   cálculos recorren únicamente las citas de ese día.
   ============================================================ */
function dowOf(iso){return (new Date(iso+"T12:00").getDay()+6)%7;}
function dayHours(iso){return (STATE.hours&&STATE.hours[dowOf(iso)])||{on:false,from:"08:00",to:"18:00"};}

/* Índice por fecha: evita recorrer todas las citas una y otra vez
   al pintar el calendario. Se reconstruye solo si algo cambió. */
let _idx={map:null,len:-1,ver:-1};
let APPT_VER=0;
function touchAppts(){APPT_VER++;}
function dayMap(){
  if(_idx.map&&_idx.ver===APPT_VER&&_idx.len===STATE.appointments.length)return _idx.map;
  const m=new Map();
  for(let i=0;i<STATE.appointments.length;i++){
    const a=STATE.appointments[i];
    if(!isLive(a)||!a.when)continue;
    let l=m.get(a.when);if(!l){l=[];m.set(a.when,l);}
    l.push(a);
  }
  _idx={map:m,len:STATE.appointments.length,ver:APPT_VER};
  return m;
}
function liveOn(iso){return dayMap().get(iso)||[];}

const DEFAULT_VAN_SLOTS=4;
function vanDailyCap(v){
  const per=v&&v.slotsPerDay;
  if(per!=null&&+per>0)return +per;
  return Math.max(1,+STATE.settings.vanDailyLimit||DEFAULT_VAN_SLOTS);
}
/* Si todavía no hay vans registradas, se trabaja con una unidad implícita. */
function allVans(){
  return (STATE.vans&&STATE.vans.length)?STATE.vans:[{id:null,name:t("van_unassigned"),color:"#b9a7ae"}];
}
function vansForZone(z){return STATE.vans.filter(v=>{const zs=Array.isArray(v.zones)?v.zones:[];return !zs.length||zs.indexOf(z)>=0;});}
/* Vans que pueden tomar esta cita (por zona y por servicios). Si el filtro
   deja cero, se ignora en vez de bloquear: es preferible avisar que trancar. */
function eligibleVans(opts){
  opts=opts||{};
  let pool=allVans();
  if(opts.zone&&STATE.vans.length){const z=vansForZone(opts.zone);if(z.length)pool=z;}
  if(opts.svcs&&opts.svcs.length){
    const f=pool.filter(v=>opts.svcs.every(id=>svcAllowsVan(svcById(id),v.id)));
    if(f.length)pool=f;
  }
  return pool;
}
function vanLoad(iso,vanId,excludeId){
  const list=liveOn(iso);let n=0;
  for(let i=0;i<list.length;i++){const a=list[i];if(a.id!==excludeId&&(a.vanId||null)===(vanId||null))n++;}
  return n;
}
/* Margen fijo de traslado entre una cita y la siguiente. */
function bufferMin(){const b=STATE.settings.bufferMin;return b==null?15:Math.max(0,+b||0);}
/* Lo que realmente ocupa una cita en la agenda de su van:
   la suma de los servicios de TODOS los perros + el margen de traslado. */
function apptFootprint(a){return (apptDur(a)||60)+bufferMin();}
function blockFor(dur){return (+dur>0?+dur:60)+bufferMin();}
/* Una van está ocupada si la cita nueva se cruza con algo que ya tiene. */
function vanBusyAt(iso,tt,dur,vanId,excludeId){
  const s=toMin(tt),e=s+blockFor(dur);
  const list=liveOn(iso);
  for(let i=0;i<list.length;i++){
    const a=list[i];
    if(a.id===excludeId||(a.vanId||null)!==(vanId||null))continue;
    const as=toMin(a.time),ae=as+apptFootprint(a);
    if(as<e&&s<ae)return true;
  }
  return false;
}
/* El servicio tiene que caber antes de la hora de cierre. */
function fitsBeforeClose(iso,tt,dur){
  const hh=dayHours(iso);
  return toMin(tt)+(+dur>0?+dur:60)<=toMin(hh.to);
}
function freeVansAt(iso,tt,dur,opts){
  opts=opts||{};
  return eligibleVans(opts).filter(v=>
    vanLoad(iso,v.id,opts.excludeId)<vanDailyCap(v)&&!vanBusyAt(iso,tt,dur,v.id,opts.excludeId));
}
/* Se elige la van menos cargada de ese día: reparte el trabajo solo. */
function pickVan(iso,tt,dur,opts){
  const free=freeVansAt(iso,tt,dur,opts);
  if(!free.length)return null;
  let best=free[0],bl=vanLoad(iso,best.id,opts&&opts.excludeId);
  for(let i=1;i<free.length;i++){
    const l=vanLoad(iso,free[i].id,opts&&opts.excludeId);
    if(l<bl){best=free[i];bl=l;}
  }
  return best.id;
}
function dayCapacity(iso,opts){return eligibleVans(opts).reduce((s,v)=>s+vanDailyCap(v),0);}
function dayUsed(iso,opts){
  const vans=eligibleVans(opts);
  return vans.reduce((s,v)=>s+vanLoad(iso,v.id,opts&&opts.excludeId),0);
}
function dayFull(iso,opts){
  opts=opts||{};
  return !eligibleVans(opts).some(v=>vanLoad(iso,v.id,opts.excludeId)<vanDailyCap(v));
}
function slotsForDay(iso){
  if(!iso)return [];
  const hh=dayHours(iso);if(!hh.on)return [];
  return (STATE.slots||[]).slice().sort().filter(s=>toMin(s)>=toMin(hh.from)&&toMin(s)<=toMin(hh.to));
}
/* El mínimo de anticipación solo aplica al cliente; el negocio agenda cuando quiera. */
function slotPassed(iso,tt,forClient){
  const min=forClient?(+STATE.settings.minWindow||0)*3600000:0;
  const ts=new Date(iso+"T"+(tt||"00:00")+":00").getTime();
  return isNaN(ts)?false:(ts<Date.now()+min);
}
/* free | past | full | busy | closed
   full = no quedan cupos en ninguna van ese día
   busy = quedan cupos, pero todas las vans ya tienen algo a esa hora */
function slotState(iso,tt,dur,excludeId,forClient,opts){
  if(!iso||!tt)return "closed";
  const hh=dayHours(iso);
  if(!hh.on||toMin(tt)<toMin(hh.from)||toMin(tt)>toMin(hh.to))return "closed";
  if(slotPassed(iso,tt,forClient!==false))return "past";
  if(!fitsBeforeClose(iso,tt,dur))return "late";
  const o=Object.assign({},opts||{},{excludeId:excludeId});
  if(dayFull(iso,o))return "full";
  return freeVansAt(iso,tt,dur,o).length?"free":"busy";
}
function dayFreeCount(iso,dur,opts){
  return slotsForDay(iso).filter(tt=>slotState(iso,tt,dur,null,true,opts)==="free").length;
}
function dayReason(iso,dur,opts){
  const hh=dayHours(iso);
  if(!hh.on)return "closed";
  const slots=slotsForDay(iso);
  if(!slots.length)return "closed";
  const states=slots.map(tt=>slotState(iso,tt,dur,null,true,opts));
  if(states.indexOf("free")>=0)return "open";
  if(states.every(s=>s==="past"))return "past";
  if(states.indexOf("full")>=0)return "full";
  if(states.every(s=>s==="late"||s==="past"))return "late";
  return "busy";
}
/* Cuántos cupos quedan hoy, para mostrárselo a la dueña. */
function daySeatsLeft(iso,opts){return Math.max(0,dayCapacity(iso,opts)-dayUsed(iso,opts));}
function svcsDur(ids){return (ids||[]).reduce((s,id)=>s+(svcById(id).dur||0),0)||60;}
function vanForGroomer(g,zone){
  const pool=zone?(vansForZone(zone).length?vansForZone(zone):STATE.vans):STATE.vans;
  const m=pool.filter(v=>v.groomer===g);
  if(m.length)return m[0].id;
  return pool.length?pool[0].id:null;
}
function svcAllowsVan(s,vanId){return !s.vans||!s.vans.length||s.vans.indexOf(vanId)>=0;}
function svcAllowsGroomer(s,name){return !s.groomers||!s.groomers.length||s.groomers.indexOf(name)>=0;}
function groomersForSvcs(ids){return STATE.staff.filter(g=>ids.every(id=>svcAllowsGroomer(svcById(id),g.name)));}
</script>

/* ============================================================
   DIRECCIONES
   - Google Places si hay clave (lo que usa la mayoría de las apps).
   - Sin clave, OpenStreetMap como respaldo.
   - Ordenadas por cercanía a quien está escribiendo; si no hay
     permiso de ubicación, se centra en Nashville / Tennessee.
   - No se limita a "street address": también salen negocios,
     complejos de apartamentos y puntos conocidos.
   ============================================================ */
let _gmaps=null,_gsvc=null,_gtoken=null,_gplaces=null;
function mapsKey(){return ((STATE.settings&&STATE.settings.mapsKey)||"").trim();}
function tnOnly(){return STATE.settings.midTnOnly!==false;}
function inMidTn(lat,lng,text){
  if(lat!=null&&lng!=null)return lat>=TN.minLat&&lat<=TN.maxLat&&lng>=TN.minLng&&lng<=TN.maxLng;
  const s=norm(text);
  return TN.words.some(w=>s.indexOf(w)>=0);
}
/* ---- ubicación de quien escribe (se pide una sola vez) ---- */
let GEO={lat:null,lng:null,at:0,asked:false,ok:false};
function geoCenter(){return GEO.ok?{lat:GEO.lat,lng:GEO.lng}:MIDTN.center;}
function requestGeo(){
  if(GEO.asked||!navigator.geolocation)return;
  GEO.asked=true;
  try{
    navigator.geolocation.getCurrentPosition(
      p=>{GEO.lat=p.coords.latitude;GEO.lng=p.coords.longitude;GEO.at=Date.now();GEO.ok=true;},
      ()=>{GEO.ok=false;},
      {timeout:8000,maximumAge:900000,enableHighAccuracy:false});
  }catch(e){GEO.ok=false;}
}
function miles(lat1,lng1,lat2,lng2){
  if(lat1==null||lat2==null)return null;
  const R=3958.8,rad=Math.PI/180;
  const dLat=(lat2-lat1)*rad,dLng=(lng2-lng1)*rad;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function sortByNear(list){
  const c=geoCenter();
  list.forEach(x=>{
    if(x.dist==null&&x.lat!=null)x.dist=miles(c.lat,c.lng,x.lat,x.lng);
  });
  return list.slice().sort((a,b)=>{
    if(a.dist==null&&b.dist==null)return 0;
    if(a.dist==null)return 1;
    if(b.dist==null)return -1;
    return a.dist-b.dist;
  });
}
function loadGoogleMaps(){
  if(_gmaps)return Promise.resolve(_gmaps);
  const key=mapsKey();if(!key)return Promise.resolve(null);
  if(window.google&&window.google.maps&&window.google.maps.places){_gmaps=window.google.maps;return Promise.resolve(_gmaps);}
  return new Promise(res=>{
    const s=document.createElement("script");
    s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(key)+"&libraries=places&region=US&language="+(STATE.lang==="en"?"en":"es");
    s.async=true;
    s.onload=()=>{try{_gmaps=window.google.maps;res(_gmaps);}catch(e){res(null);}};
    s.onerror=()=>{console.warn("maps: no cargó (revisa la clave)");res(null);};
    document.head.appendChild(s);
  });
}
function gPredict(req){
  return new Promise(res=>{
    _gsvc.getPlacePredictions(req,(pred,st)=>{
      const g=_gmaps;
      if(!pred||(g&&st!==g.places.PlacesServiceStatus.OK)){res([]);return;}
      res(pred);
    });
  });
}
async function suggestGoogle(q){
  const g=await loadGoogleMaps();if(!g)return null;
  if(!_gsvc)_gsvc=new g.places.AutocompleteService();
  if(!_gtoken&&g.places.AutocompleteSessionToken)_gtoken=new g.places.AutocompleteSessionToken();
  const c=geoCenter();
  // Sin filtro de tipo: salen casas, negocios y complejos, como en Google Maps.
  const base={input:q,componentRestrictions:{country:"us"},sessionToken:_gtoken};
  try{if(g.LatLng)base.origin=new g.LatLng(c.lat,c.lng);}catch(e){}
  let req=Object.assign({},base);
  if(tnOnly()&&g.LatLngBounds){
    try{
      req.bounds=new g.LatLngBounds(new g.LatLng(TN.minLat,TN.minLng),new g.LatLng(TN.maxLat,TN.maxLng));
      req.strictBounds=true;
    }catch(e){}
  }else{
    try{if(g.LatLng){req.location=new g.LatLng(c.lat,c.lng);req.radius=60000;}}catch(e){}
  }
  let pred=await gPredict(req);
  // Si el filtro estricto no devolvió nada, se reintenta suave para no dejar al usuario atascado.
  if(!pred.length&&tnOnly()){
    const soft=Object.assign({},base);
    try{if(g.LatLng){soft.location=new g.LatLng(c.lat,c.lng);soft.radius=90000;}}catch(e){}
    pred=await gPredict(soft);
  }
  const out=pred.slice(0,8).map(p=>({
    id:p.place_id,
    main:(p.structured_formatting&&p.structured_formatting.main_text)||p.description,
    sub:(p.structured_formatting&&p.structured_formatting.secondary_text)||"",
    full:p.description,
    dist:(p.distance_meters!=null)?p.distance_meters/1609.34:null,
    src:"google"}));
  return sortByNear(out).slice(0,6);
}
function detailsGoogle(placeId){
  return new Promise(res=>{
    const g=_gmaps;if(!g){res(null);return;}
    const host=document.getElementById("addrSug")||document.body;
    if(!_gplaces)_gplaces=new g.places.PlacesService(host);
    _gplaces.getDetails({placeId:placeId,fields:["formatted_address","name","geometry"],sessionToken:_gtoken},(pl,st)=>{
      _gtoken=g.places.AutocompleteSessionToken?new g.places.AutocompleteSessionToken():null;
      if(st!==g.places.PlacesServiceStatus.OK||!pl){res(null);return;}
      res({addr:pl.formatted_address,name:pl.name||"",
           lat:pl.geometry&&pl.geometry.location?pl.geometry.location.lat():null,
           lng:pl.geometry&&pl.geometry.location?pl.geometry.location.lng():null});
    });
  });
}
function osmMap(j){
  return (j||[]).map(x=>{
    const parts=String(x.display_name||"").split(",");
    const a=x.address||{};
    const line1=[a.house_number,a.road].filter(Boolean).join(" ")||a.amenity||a.shop||a.building||parts[0];
    const line2=[a.city||a.town||a.village||a.hamlet,a.state,a.postcode].filter(Boolean).join(", ");
    const full=(line1&&line2)?(line1+", "+line2):String(x.display_name).replace(/, United States$/,"");
    return {id:String(x.place_id),main:line1||parts[0],sub:line2||parts.slice(2).join(",").trim(),
            full:full,lat:+x.lat,lng:+x.lon,dist:null,src:"osm"};
  });
}
async function osmFetch(url){
  try{
    const r=await fetch(url,{headers:{"Accept":"application/json"}});
    if(!r.ok)return [];
    return osmMap(await r.json());
  }catch(e){return [];}
}
async function suggestOSM(q){
  const c=geoCenter();
  const base="https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&countrycodes=us&limit=10&q=";
  // Primero cerca de quien escribe; si no hay nada, se abre a todo Tennessee.
  const box=[c.lng-0.9,c.lat+0.7,c.lng+0.9,c.lat-0.7];   // ~60 mi alrededor
  let list=await osmFetch(base+encodeURIComponent(q)+"&viewbox="+box.join(",")+"&bounded=1");
  if(!list.length&&tnOnly())
    list=await osmFetch(base+encodeURIComponent(q)+"&viewbox="+TN.minLng+","+TN.maxLat+","+TN.maxLng+","+TN.minLat+"&bounded=1");
  if(!list.length)
    list=await osmFetch(base+encodeURIComponent(q+(tnOnly()?", Tennessee":"")));
  if(tnOnly())list=list.filter(x=>inMidTn(x.lat,x.lng,x.full));
  return sortByNear(list).slice(0,6);
}
function setAddrState(kind,msg,el){
  el=el||document.getElementById("addrState");if(!el)return;

function hideAddrSug(id){const s=document.getElementById(id||"addrSug");if(s){s.classList.remove("show");s.innerHTML="";}}
/* Autocompletado reutilizable: portal del cliente y formularios del panel. */
function attachAddr(inputId,sugId,stateId,onPick){
  const inp=document.getElementById(inputId);if(!inp)return;
  let seq=0,tmr=null,list=[];
  const render=()=>{
    const box=document.getElementById(sugId);if(!box)return;
    if(!list.length){box.classList.remove("show");box.innerHTML="";setAddrState("warn",t("addr_none"),document.getElementById(stateId));return;}
    box.innerHTML=list.map((s,i)=>{
      const d=(s.dist!=null&&isFinite(s.dist))?'<span class="sug-km">'+(s.dist<0.2?t("addr_here"):t("addr_mi",{n:s.dist<10?s.dist.toFixed(1):Math.round(s.dist)}))+'</span>':'';
      return '<button type="button" data-i="'+i+'">📍 '+esc(s.main)+d+(s.sub?'<span class="sug-sub">'+esc(s.sub)+'</span>':'')+'</button>';
    }).join("")+
      '<div class="addr-attrib">'+(list[0].src==="google"?t("addr_byGoogle"):(t("addr_byOSM")+(isAdmin()&&!PUBLIC?' · '+t("addr_addKey"):'')))+
      (GEO.ok?' · '+t("addr_nearYou"):'')+'</div>';
    box.classList.add("show");
    box.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
      const s=list[+b.dataset.i];if(!s)return;
      box.classList.remove("show");
      let addr=s.full,lat=s.lat,lng=s.lng;
      if(s.src==="google"){setAddrState("",t("addr_confirming"),document.getElementById(stateId));
        const d=await detailsGoogle(s.id);if(d&&d.addr){addr=d.addr;lat=d.lat;lng=d.lng;}}
      inp.value=addr;
      setAddrState("okv","✓ "+t("addr_ok"),document.getElementById(stateId));
      if(onPick)onPick({addr:addr,lat:lat||null,lng:lng||null,verified:true});
    });
    setAddrState("",t("addr_choose"),document.getElementById(stateId));
  };
  inp.addEventListener("focus",requestGeo);
  inp.addEventListener("input",()=>{
    const q=inp.value.trim();
    if(onPick)onPick({addr:q,lat:null,lng:null,verified:false});
    clearTimeout(tmr);
    if(q.length<4){hideAddrSug(sugId);setAddrState("","",document.getElementById(stateId));return;}
    setAddrState("",t("addr_searching"),document.getElementById(stateId));
    const my=++seq;
    tmr=setTimeout(async()=>{
      let r=null;
      if(mapsKey())r=await suggestGoogle(q);
      if(!r)r=await suggestOSM(q);
      if(my!==seq)return;
      list=r||[];render();
    },420);
  });
  inp.addEventListener("blur",()=>setTimeout(()=>hideAddrSug(sugId),230));
}

/* ===== calendario de 30 días ===== */
const DP_RANGE=45;
let _dpView=null;
function monthKey(y,m){return y+"-"+String(m).padStart(2,"0");}
function dpBounds(){return {min:isoAdd(0),max:isoAdd(DP_RANGE-1)};}
function bkDur(){return SEL.dogs.reduce((s,d)=>s+petDur(d),0)||60;}
function buildDateOptions(){
  touchAppts();
  const dur=bkDur();
  if(!SEL.date||dayFreeCount(SEL.date,dur)===0){
    SEL.date=null;
    for(let i=0;i<DP_RANGE;i++){const iso=isoAdd(i);if(dayFreeCount(iso,dur)>0){SEL.date=iso;break;}}
    _dpView=null;
  }
  if(!_dpView){const d=SEL.date?new Date(SEL.date+"T12:00"):new Date();_dpView=monthKey(d.getFullYear(),d.getMonth()+1);}
  renderDayPicker();buildSlots();
}
function renderDayPicker(){
  const grid=document.getElementById("dpGrid");if(!grid)return;
  const dur=bkDur(),B=dpBounds();
  if(!_dpView){const d=SEL.date?new Date(SEL.date+"T12:00"):new Date();_dpView=monthKey(d.getFullYear(),d.getMonth()+1);}
  const yy=+_dpView.split("-")[0],mm=+_dpView.split("-")[1];
  const ws=(STATE.lang==="en")?0:1;
  const dow=document.getElementById("dpDow");
  if(dow){let hd="";for(let i=0;i<7;i++){const d=new Date(2024,0,7+((ws+i)%7));hd+='<span>'+d.toLocaleDateString(loc(),{weekday:"short"}).replace(".","").slice(0,3)+'</span>';}dow.innerHTML=hd;}
  const first=new Date(yy,mm-1,1,12);
  const lead=(first.getDay()-ws+7)%7;
  const dim=new Date(yy,mm,0).getDate();
  let html="",freeCount=0;
  for(let i=0;i<lead;i++)html+='<span class="dp-cell blank"></span>';
  for(let d=1;d<=dim;d++){
    const dt=new Date(yy,mm-1,d,12);
    const iso=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const inRange=iso>=B.min&&iso<=B.max;
    const free=inRange?dayFreeCount(iso,dur):0;
    const off=!inRange||free===0;
    if(!off)freeCount++;
    let foot="";
    if(inRange)foot=free>0?(free+" "+t("dp_open")):t("dp_"+dayReason(iso,dur));
    html+='<button type="button" class="dp-cell'+(iso===SEL.date?' on':'')+(off?' off':'')+(iso===B.min?' today':'')+'" '+
      (off?'disabled':'onclick="pickDay(\''+iso+'\')"')+'><span class="dn">'+d+'</span><span class="dfr">'+foot+'</span></button>';
  }
  grid.innerHTML=html;
  document.getElementById("dpMonth").textContent=first.toLocaleDateString(loc(),{month:"long",year:"numeric"});
  const pv=document.getElementById("dpPrev"),nx=document.getElementById("dpNext");
  if(pv)pv.disabled=monthKey(yy,mm)<=B.min.slice(0,7);
  if(nx)nx.disabled=monthKey(yy,mm)>=B.max.slice(0,7);
  const note=document.getElementById("dpNote");
  if(note)note.textContent=SEL.date?t("dp_picked",{d:fmtDateLong(SEL.date)}):(freeCount?t("dp_pick"):t("no_days"));
}
function dpShift(dir){
  const B=dpBounds();
  let yy=+_dpView.split("-")[0],mm=+_dpView.split("-")[1]+dir;
  if(mm<1){mm=12;yy--;}else if(mm>12){mm=1;yy++;}
  const k=monthKey(yy,mm);
  if(k<B.min.slice(0,7)||k>B.max.slice(0,7))return;
  _dpView=k;renderDayPicker();
}
function pickDay(iso){SEL.date=iso;SEL.time=null;renderDayPicker();buildSlots();updateRecurNote();}
function buildSlots(){
  const dur=bkDur();
  const list=SEL.date?slotsForDay(SEL.date):[];
  if(SEL.time&&list.indexOf(SEL.time)<0)SEL.time=null;
  let html="";
  list.forEach(tt=>{
    const st=slotState(SEL.date,tt,dur,null,true);const off=st!=="free";
    if(off&&SEL.time===tt)SEL.time=null;
    const tag=off?' · '+t("sl_"+st):'';
    html+='<button type="button" class="slot '+(off?'off':'')+' '+(SEL.time===tt?'sel':'')+'" '+(off?'disabled':'onclick="pickSlot(\''+tt+'\')"')+'>'+fmtTime(tt)+tag+'</button>';
  });
  document.getElementById("slotList").innerHTML=html||'<div class="empty" style="padding:14px">'+t("no_slots")+'</div>';
  const info=document.getElementById("slotInfo");
  if(info)info.innerHTML=SEL.dogs.length?('<div class="time-plan">'+t("plan_client",{
    n:SEL.dogs.length,d:fmtDur(dur)})+(SEL.time?' · '+t("plan_ends",{fin:fmtTime(addMin(SEL.time,dur))}):'')+'</div>'):'';
  validateStep3();
}
function pickSlot(tt){SEL.time=tt;buildSlots();updateRecurNote();}
function toggleRecur(){document.getElementById("recurOpts").classList.toggle("show",document.getElementById("recurChk").checked);updateRecurNote();}
function toggleCustomRecur(){const c=document.getElementById("recurEvery").value==="custom";document.getElementById("recurCustomWrap").style.display=c?"":"none";updateRecurNote();}
function recurWeeks(){const v=document.getElementById("recurEvery").value;return v==="custom"?Math.max(1,+document.getElementById("recurCustom").value||1):+v;}
function updateRecurNote(){
  const el=document.getElementById("recurNote");if(!el)return;
  const on=document.getElementById("recurChk").checked;
  el.textContent=(on&&SEL.date&&SEL.time)?t("recur_note",{dow:dowName(SEL.date),time:fmtTime(SEL.time),n:recurWeeks()}):"";
}
function validateStep3(){
  const ok=!!(SEL.zone&&SEL.addr&&SEL.date&&SEL.time&&SEL.addrVerified);
  const b=document.getElementById("next3");if(b)b.disabled=!ok;
  const st=document.getElementById("addrState");
  if(st&&SEL.addr&&!SEL.addrVerified&&SEL.addr.length>=4&&st.textContent.indexOf(t("addr_searching"))<0&&st.textContent.indexOf(t("addr_choose"))<0){
    st.className="addr-state warn";
    st.innerHTML=t("addr_needConfirm")+' <button class="btn btn-ghost btn-sm" style="margin-left:6px" onclick="useAddrAsTyped()">'+t("addr_useTyped")+'</button>';
  }
}
function buildSummary(){
  const p=SEL.dogs.reduce((s,d)=>s+petPrice(d),0);SEL.price=p;
  const dep=+STATE.settings.deposit||0;
  const on=document.getElementById("recurChk").checked;
  const recurTxt=on?t("sum_yesEvery",{n:recurWeeks()}):t("sum_no");

    esc((d.svcs||[]).map(id=>svcById(id).name||id).join(" + "))+' · '+sizeLabel(d.size)+' · '+money(petPrice(d))+'</span></div>').join("");
  document.getElementById("bookSummary").innerHTML=
    '<div class="ln"><span class="k">'+t("sum_pets")+'</span><span class="v">'+SEL.dogs.length+'</span></div>'+dogLines+
    '<div class="ln"><span class="k">'+t("sum_address")+'</span><span class="v">'+esc(SEL.addr)+'</span></div>'+
    '<div class="ln"><span class="k">'+t("sum_date")+'</span><span class="v">'+fmtDate(SEL.date)+' · '+fmtTime(SEL.time)+'</span></div>'+
    '<div class="ln"><span class="k">'+t("sum_recurring")+'</span><span class="v">'+recurTxt+'</span></div>'+
    '<div class="total"><span class="k">'+t("sum_total")+'</span><span class="t">'+money(p)+'</span></div>'+
    (dep>0?'<div class="deposit-tag">'+t("deposit_text",{amt:money(dep)})+'</div>':'');
}
function confirmBooking(){
  const name=document.getElementById("ownerName").value.trim();
  const phone=document.getElementById("ownerPhone").value.trim();
  const email=document.getElementById("ownerEmail").value.trim();
  if(!name||!phone){toast(t("t_needNamePhone"));return;}
  if(slotState(SEL.date,SEL.time,bkDur(),null,true)!=="free"){toast(t("slot_gone"));buildDateOptions();goStep(3);return;}
  const allSvcs=[];SEL.dogs.forEach(d=>d.svcs.forEach(s=>{if(allSvcs.indexOf(s)<0)allSvcs.push(s);}));
  const allowedG=groomersForSvcs(allSvcs);
  const vanId=pickVan(SEL.date,SEL.time,bkDur(),{zone:SEL.zone,svcs:allSvcs});
  const van=vanById(vanId);
  const groomer=(van&&van.groomer)||((allowedG[0]||STATE.staff[0]||{}).name)||"—";
  const recurOn=document.getElementById("recurChk").checked;
  SEL.recur=recurOn?recurWeeks():null;
  const base={
    pets:SEL.dogs.map(d=>({name:d.name.trim(),breed:d.breed.trim(),size:d.size,svcs:d.svcs.slice(),photo:d.photo,notes:d.notes.trim()})),
    owner:name,phone:phone,phoneKey:phoneKey(phone),email:email,
    addr:SEL.addr,lat:SEL.lat||null,lng:SEL.lng||null,addrVerified:!!SEL.addrVerified,zone:SEL.zone,
    price:SEL.price,groomer:groomer,vanId:vanId,recurring:SEL.recur,when:SEL.date,time:SEL.time,
    tip:0,discount:0,payments:[]
  };
  const b=document.getElementById("confirmBtn");if(b)b.disabled=true;
  if(PUBLIC){submitPublicRequest(base);return;}
  const appt=normalizeAppt(Object.assign({id:nid(),status:"requested",paid:false},base));
  STATE.appointments.push(appt);
  upsertClient({name:name,phone:phone,email:email,addr:SEL.addr,zone:SEL.zone,lat:SEL.lat,lng:SEL.lng,pets:base.pets});
  document.getElementById("doneMsg").innerHTML=t("done_msg",{date:fmtDate(SEL.date),time:fmtTime(SEL.time),extra:recurOn?t("done_extra_recur"):""});
  persist();
  goStep("done");document.querySelectorAll('.steps .s').forEach(s=>{s.classList.add('done');s.classList.remove('cur');});
  if(b)b.disabled=false;
}
function resetBooking(){
  SEL.dogs=[newDog()];
  Object.assign(SEL,{zone:(STATE.zones||[])[0],addr:"",addrVerified:false,lat:null,lng:null,date:null,time:null,recur:null,price:0});
  hideAddrSug();setAddrState("","");
  ["bookAddr","ownerName","ownerPhone","ownerEmail"].forEach(id=>{const e=document.getElementById(id);if(e)e.value="";});
  const rc=document.getElementById("recurChk");if(rc)rc.checked=false;
  const ro=document.getElementById("recurOpts");if(ro)ro.classList.remove("show");
  renderBkDogs();checkStep1();
  const n2=document.getElementById("next2");if(n2)n2.disabled=true;
  goStep(1);
}

/* ============================================================
   PANEL DEL NEGOCIO
   ============================================================ */
let CURVIEW="biz";
function showView(v){
  CURVIEW=v;
  document.getElementById("view-client").classList.toggle("on",v==="client");
  document.getElementById("view-biz").classList.toggle("on",v==="biz");
  document.getElementById("sw-client").classList.toggle("on",v==="client");

let CURTAB="dash";
function showTab(tb,btn){
  CURTAB=tb;
  document.querySelectorAll('#view-biz .tabs button').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
  document.querySelectorAll('#view-biz .panel').forEach(p=>p.classList.toggle('on',p.dataset.tab===tb));
  if(tb==="reqs")setTimeout(markCancelsSeen,1200);

function updateFab(){
  const f=document.getElementById("fabNew");if(!f)return;
  const show=CURVIEW==="biz"&&!PUBLIC&&["dash","appts","cal","clients"].indexOf(CURTAB)>=0;
  f.classList.toggle("hide",!show);
}
function setSearch(k,v){STATE.search[k]=v;
  const box=document.getElementById("sb"+k.charAt(0).toUpperCase()+k.slice(1));
  if(box)box.classList.toggle("has",!!v);
  if(k==="appts")renderAllAppts();
  else if(k==="clients")renderClients();
  else if(k==="reqs")renderRequests();

function clearSearch(k){
  STATE.search[k]="";
  const box=document.getElementById("sb"+k.charAt(0).toUpperCase()+k.slice(1));
  if(box){box.classList.remove("has");const i=box.querySelector("input");if(i)i.value="";}

function apptHaystack(a){
  const c=clientOf(a);
  return norm([apptPetNames(a),apptBreeds(a),apptSvcNames(a),a.owner,a.phone,fmtPhone(a.phone),a.addr,a.zone,a.groomer,
    (vanById(a.vanId)||{}).name,a.when,a.time,a.notes,a.chargeNote,c?c.name:""].join(" "));
}
function matches(hay,q){
  const terms=norm(q).split(/\s+/).filter(Boolean);
  return terms.every(x=>hay.indexOf(x)>=0);
}
function refreshBiz(){
  touchAppts();
  migrateServices();
  document.getElementById("bizName").textContent=STATE.brand.name||"—";
  document.getElementById("todayLabel").textContent=fmtDateLong(addDays(0));
  applyRoleUI();
  renderDash();renderAllAppts();renderCalendar();renderClients();renderFinance();renderEarnings();
  if(isAdmin())renderConfig();

/* El groomer no ve finanzas, ajustes ni solicitudes. */
function applyRoleUI(){
  const qc=document.getElementById("qaClient");
  if(qc)qc.style.display=isStaff()?"none":"";
  const hide=isStaff()?["reqs","fin","cfg","clients"]:["earn"];
  document.querySelectorAll('#bizTabs button').forEach(b=>{
    const k=b.dataset.tab;

  });
  if(hide.indexOf(CURTAB)>=0){
    const first=document.querySelector('#bizTabs button[data-tab="dash"]');
    showTab("dash",first);

function badges(a){
  const map={conf:["b-conf","b_confirmed"],done:["b-done","b_completed"],pend:["b-pend","b_pending"],
    requested:["b-pend","b_requested"],modProposed:["b-pend","b_modProposed"],declined:["b-unpaid","b_declined"]};
  const m=map[a.status]||["b-pend","b_pending"];
  let html='<span class="badge '+m[0]+'">'+t(m[1])+'</span>';
  if(a.onWayAt&&a.status!=="done")html+='<span class="badge b-conf">'+t("b_onway")+'</span>';
  if(isLive(a)&&isAdmin()){
    const bal=apptBalance(a);
    if(bal<=0.009&&apptPaidAmt(a)>0)html+='<span class="badge b-paid">'+t("b_paid")+'</span>';
    else if(apptPaidAmt(a)>0)html+='<span class="badge b-unpaid">'+t("b_balance",{amt:money(bal)})+'</span>';
    else if(a.status==="done")html+='<span class="badge b-unpaid">'+t("b_unpaid")+'</span>';
  }
  if(+a.discount>0)html+='<span class="badge b-conf">−'+money(a.discount)+'</span>';
  if(a.conflict)html+='<span class="badge b-unpaid">'+t("conflict_badge")+'</span>';
  return html;
}
function apptRow(a){
  const d=new Date(a.when+"T12:00");const v=vanById(a.vanId);
  const vc=v?v.color:"#ddd";
  const vtag=v?'<span class="vantag"><span class="vd" style="background:'+v.color+'"></span>'+esc(v.name)+'</span>':'';
  const ph=apptPhoto(a);const n=apptPets(a).length;
  const pic=ph?('<div class="pic-stack"><img class="pic" src="'+esc(ph)+'" alt="">'+(n>1?'<span class="n">×'+n+'</span>':'')+'</div>'):'';
  const canDone=isLive(a)&&a.status!=="done";
  const done=canDone?'<button class="qdone" title="'+t("m_done")+'" onclick="event.stopPropagation();markDone(\''+a.id+'\')">✓</button>':'';
  return '<div class="appt" role="button" tabindex="0" onclick="openAppt(\''+a.id+'\')"><span class="vanstrip" style="background:'+vc+'"></span>'+
    '<div class="when"><div class="d">'+d.getDate()+'</div><div class="m">'+d.toLocaleDateString(loc(),{month:"short"})+'</div><div class="h">'+esc(a.time)+'</div></div>'+pic+
    '<div class="info"><div class="pet">'+esc(apptPetNames(a))+(n>1?' <span style="color:var(--muted);font-weight:400">· '+n+' 🐾</span>':'')+'</div>'+
    '<div class="det">'+apptIcon(a)+' '+esc(apptSvcNames(a))+' · '+esc(a.owner||"")+' · '+esc(a.zone||"")+'</div>'+vtag+'</div>'+
    '<div class="rgt">'+badges(a)+'<span class="price">'+money(apptTotal(a))+'</span></div>'+done+'</div>';

function renderDash(){
  const today=addDays(0);
  const mine=visibleAppts();
  const live=mine.filter(isLive);
  const todays=live.filter(a=>a.when===today);
  const week=[];for(let i=0;i<7;i++)week.push(addDays(i));
  const weekly=live.filter(a=>week.indexOf(a.when)>=0);
  const doneMonth=mine.filter(a=>isDone(a)&&apptRevDate(a)<=today&&apptRevDate(a)>=addDays(-30));
  const monthRev=doneMonth.reduce((s,a)=>s+(+a.price||0),0);
  const tips=doneMonth.reduce((s,a)=>s+(+a.tip||0),0);
  const cards=[
    {k:t("st_today"),v:todays.length,d:todays.length?("▲ "+money(todays.reduce((s,a)=>s+apptTotal(a),0))+" "+t("st_booked")):t("st_noAppts"),c:"up"},
    {k:t("st_week"),v:weekly.length,d:t("st_bookings"),c:""},
    {k:t("st_revenue"),v:money(monthRev),d:t("st_active"),c:"up"}
  ];
  if(isStaff()){
    const wk=weekStart(addDays(0));
    const e=earningsFor(wk,weekEnd(wk),myCommPct());
    cards.push({k:t("earn_weekTotal"),v:money(e.total),d:weekLabel(wk),c:"up"});
    cards.push({k:t("earn_tips"),v:money(e.tips),d:t("earn_thisWeek"),c:"gold"});
  }
  if(isAdmin()){
    cards.push({k:t("st_tips"),v:money(tips),d:t("fin_tipsNotIncome"),c:"gold"});
    cards.push({k:t("st_clients"),v:(STATE.clients||[]).length,d:t("st_registered"),c:"gold"});
  }
  document.getElementById("dashStats").innerHTML=cards.map(c=>
    '<div class="stat"><div class="k">'+c.k+'</div><div class="v">'+c.v+'</div><div class="d '+c.c+'">'+c.d+'</div></div>').join("");
  const up=live.filter(a=>a.when>=today).sort((a,b)=>((a.when+a.time)).localeCompare(b.when+b.time)).slice(0,8);
  document.getElementById("upcomingList").innerHTML=up.length?up.map(apptRow).join(""):'<div class="empty">'+t("no_upcoming")+'</div>';
  renderReminders();
  if(isAdmin())renderRequests();
}
/* Lo que gana la groomer: su comisión sobre el servicio + el 100% de sus propinas. */
function myCommPct(){const s=(STATE.staff||[]).find(x=>x.id===ME.staffId)||staffByName(myStaffName());return s?(+s.comm||0):0;}
function earningsFor(from,to,pct){
  const mine=visibleAppts().filter(a=>isDone(a)&&apptRevDate(a)>=from&&apptRevDate(a)<=to);
  let comm=0,tips=0,svc=0;
  mine.forEach(a=>{comm+=(+a.price||0)*pct/100;tips+=(+a.tip||0);svc+=(+a.price||0);});
  return {list:mine,comm:comm,tips:tips,svc:svc,total:comm+tips,n:mine.length};
}
let EARN_WEEK=null;                       // semana que se está mirando (domingo)
function myEarnings(){
  const pct=myCommPct();
  const wk=EARN_WEEK||weekStart(addDays(0));
  const e=earningsFor(wk,weekEnd(wk),pct);
  e.pct=pct;e.week=wk;e.isCurrent=(wk===weekStart(addDays(0)));
  return e;
}
function earnShift(n){
  const cur=EARN_WEEK||weekStart(addDays(0));
  const next=weekShift(cur,n);
  if(next>weekStart(addDays(0)))return;    // no se mira hacia el futuro
  EARN_WEEK=next;renderEarnings();
}
function earnThisWeek(){EARN_WEEK=null;renderEarnings();}
function renderEarnings(){
  const host=document.getElementById("earnStats");if(!host||!isStaff())return;
  const e=myEarnings();
  host.innerHTML=
    '<div class="stat"><div class="k">'+t("earn_total")+'</div><div class="v" style="color:var(--ok)">'+money(e.total)+'</div><div class="d up">'+weekLabel(e.week)+'</div></div>'+
    '<div class="stat"><div class="k">'+t("earn_comm")+'</div><div class="v">'+money(e.comm)+'</div><div class="d">'+e.pct+'% '+t("commission")+'</div></div>'+
    '<div class="stat"><div class="k">'+t("earn_tips")+'</div><div class="v" style="color:var(--gold)">'+money(e.tips)+'</div><div class="d gold">100%</div></div>'+
    '<div class="stat"><div class="k">'+t("earn_appts")+'</div><div class="v">'+e.n+'</div><div class="d">'+(e.isCurrent?t("earn_thisWeek"):weekLabel(e.week))+'</div></div>';
  const nav=document.getElementById("earnNav");
  if(nav)nav.innerHTML='<button class="cal-nav" onclick="earnShift(-1)">‹</button>'+
    '<div class="cal-title">'+(e.isCurrent?t("earn_thisWeek"):weekLabel(e.week))+'</div>'+
    '<button class="cal-nav" onclick="earnShift(1)"'+(e.isCurrent?' disabled style="opacity:.3"':'')+'>›</button>'+
    (e.isCurrent?'':'<button class="cal-today" onclick="earnThisWeek()">'+t("earn_now")+'</button>');
  const note=document.getElementById("earnNote");
  if(note)note.textContent=t("earn_note",{p:e.pct,a:weekLabel(e.week)});
  const list=document.getElementById("earnList");
  if(list)list.innerHTML=e.list.slice().sort((a,b)=>(b.when||"").localeCompare(a.when||"")).map(a=>{
    const c=(+a.price||0)*e.pct/100,tp=+a.tip||0;
    return '<div class="fin-row"><div class="lft"><span class="dot" style="background:var(--mauve)"></span><div>'+
      '<div class="nm">'+esc(apptPetNames(a))+' · '+esc(a.owner||"")+'</div>'+
      '<div class="sub">'+fmtDate(a.when)+' · '+t("earn_row",{c:money(c),t:money(tp)})+'</div></div></div>'+
      '<span class="amt in">'+money(c+tp)+'</span></div>';
  }).join("")||'<div class="empty">'+t("earn_none")+'</div>';
  // Resumen de las 4 semanas anteriores para que vea su tendencia.
  const hist=document.getElementById("earnHist");
  if(hist){
    let h="";
    for(let i=1;i<=4;i++){
      const w=weekShift(e.week,-i);
      const p=earningsFor(w,weekEnd(w),e.pct);
      h+='<div class="fin-row"><div class="lft"><span class="dot" style="background:var(--line)"></span><div>'+
        '<div class="nm">'+weekLabel(w)+'</div><div class="sub">'+p.n+' '+(p.n===1?t("fin_apptOne"):t("fin_apptMany"))+' · '+t("earn_row",{c:money(p.comm),t:money(p.tips)})+'</div></div></div>'+
        '<span class="amt in">'+money(p.total)+'</span></div>';
    }
    hist.innerHTML=h;
  }
}
function setApptView(v){
  STATE.apptView=v;
  ["list","van","all"].forEach(k=>{const b=document.getElementById("vt"+k.charAt(0).toUpperCase()+k.slice(1));if(b)b.classList.toggle("on",v===k);});
  renderAllAppts();
}
function renderAllAppts(){
  const today=addDays(0);const cont=document.getElementById("allAppts");if(!cont)return;
  const q=STATE.search.appts;
  let pool=visibleAppts().filter(isLive);
  if(q)pool=pool.filter(a=>matches(apptHaystack(a),q));
  const cnt=document.getElementById("apptCount");
  if(cnt)cnt.textContent=q?t("res_found",{n:pool.length}):"";
  if(q&&!pool.length){cont.innerHTML='<div class="empty">'+t("res_none",{q:esc(q)})+'</div>';return;}
  if(STATE.apptView==="van"){
    const up=pool.filter(a=>a.when>=today||q).sort((a,b)=>(a.when+a.time).localeCompare(b.when+b.time));
    let h="";const groups=STATE.vans.concat([{id:null,name:t("van_unassigned"),color:"#ccc"}]);
    groups.forEach(v=>{const list=up.filter(a=>(a.vanId||null)===v.id);if(!list.length)return;
      const total=list.reduce((s,a)=>s+apptTotal(a),0);
      h+='<div class="van-group"><div class="vg-head"><span class="vg-dot" style="background:'+v.color+'"></span><span class="vg-name">'+esc(v.name)+'</span><span class="vg-meta">'+t("vg_appts",{n:list.length,amt:money(total)})+'</span></div>'+list.map(apptRow).join("")+'</div>';});
    cont.innerHTML=h||'<div class="empty">'+t("no_bookings")+'</div>';return;
  }
  if(STATE.apptView==="all"||q){
    const all=pool.slice().sort((a,b)=>(b.when+b.time).localeCompare(a.when+a.time));
    cont.innerHTML=all.map(apptRow).join("")||'<div class="empty">'+t("no_bookings")+'</div>';return;
  }
  const up=pool.filter(a=>a.when>=today).sort((a,b)=>(a.when+a.time).localeCompare(b.when+b.time));
  const past=pool.filter(a=>a.when<today).sort((a,b)=>(b.when+b.time).localeCompare(a.when+a.time)).slice(0,10);
  let h="";
  if(up.length)h+='<div class="sec-title">'+t("sec_upcoming")+' ('+up.length+')</div>'+up.map(apptRow).join("");
  if(past.length)h+='<div class="sec-title">'+t("sec_recentDone")+'</div>'+past.map(apptRow).join("");
  cont.innerHTML=h||'<div class="empty">'+t("no_bookings")+'</div>';
}

function tpl(k){const s=(STATE.settings.templates||{})[k];return s||((TPL_DEFAULT[STATE.lang]||TPL_DEFAULT.es)[k]||"");}
function setTpl(k,v){STATE.settings.templates=STATE.settings.templates||{};STATE.settings.templates[k]=v;renderReminderPreview();markDirty();}
function fill(str,map){let s=String(str||"");Object.keys(map).forEach(k=>{s=s.split("{"+k+"}").join(map[k]);});return s;}
function apptVars(a,extra){
  return Object.assign({pet:apptPetNames(a),owner:(a.owner||"").split(" ")[0]||a.owner||"",
    date:fmtDate(a.when),time:fmtTime(a.time),svc:apptSvcNames(a),biz:STATE.brand.name||"",
    eta:String(+STATE.settings.etaMin||20)},extra||{});
}
function waOpen(phone,text){
  const ph=cleanPhone(phone);
  if(!ph){toast(t("rm_nophone"));return false;}
  window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(text),"_blank");
  return true;
}
function dueReminders(){
  const hrs=+((STATE.settings.reminders||{}).timing||24);const now=Date.now();
  return visibleAppts().filter(a=>a.status==="conf"||a.status==="pend").filter(a=>{
    const ts=new Date(a.when+"T"+(a.time||"09:00")+":00").getTime();
    return !isNaN(ts)&&ts>now&&(ts-now)<=hrs*3600000;
  }).sort((a,b)=>((a.when||"")+(a.time||"")).localeCompare((b.when||"")+(b.time||"")));
}
function renderReminders(){
  const el=document.getElementById("remList");if(!el)return;
  const due=dueReminders();
  const c=document.getElementById("remCount");
  if(c){c.textContent=due.length||"";c.style.display=due.length?"":"none";}
  el.innerHTML=due.length?due.map(a=>{
    const sent=a.reminded?'<span class="badge b-done">'+t("rm_sent")+'</span>':'';
    return '<div class="rem-row"><div style="min-width:0"><b>'+esc(apptPetNames(a))+'</b> · '+esc(a.owner||"")+
      '<div class="rs">'+fmtDate(a.when)+' · '+fmtTime(a.time)+' · '+esc(apptSvcNames(a))+'</div>'+
      '<div class="rs">📲 '+t("rm_to",{n:fmtPhone(a.phone)||"—"})+'</div></div>'+
      '<div class="ra">'+sent+'<button class="btn btn-wa btn-sm" onclick="sendReminder(\''+a.id+'\')">'+t("rm_send")+'</button>'+
      '<button class="btn btn-ghost btn-sm" onclick="sendOnWay(\''+a.id+'\')">🚐</button></div></div>';
  }).join(""):'<div class="empty">'+t("rm_empty")+'</div>';
