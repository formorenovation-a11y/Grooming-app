  pl.innerHTML=img+'<b>'+esc(STATE.brand.name||"Mobile Grooming")+'</b>';
}
function applyLogo(){
  const lg=brandLogo();
  const bizLogo=document.getElementById("bizLogo");
  if(bizLogo){bizLogo.style.display=lg?"block":"none";if(lg)bizLogo.src=lg;}
  const bm=document.getElementById("brandMark");
  if(bm){
    if(lg){bm.style.backgroundImage="url("+lg+")";bm.style.backgroundSize="cover";bm.style.backgroundPosition="center";bm.textContent="";}
    else{bm.style.backgroundImage="";bm.textContent=((STATE.brand.name||"B")[0]||"B").toUpperCase();}
  }
  const li=document.getElementById("logoImg"),lic=document.getElementById("logoIc"),lr=document.getElementById("logoRemove");
  const rs=document.getElementById("logoRestore");
  if(li){
    if(lg){li.src=lg;li.style.display="block";if(lic)lic.style.display="none";if(lr)lr.style.display="";}
    else{li.style.display="none";if(lic)lic.style.display="";if(lr)lr.style.display="none";}
  }
  if(rs)rs.style.display=(STATE.brand.logo==="none")?"":"none";
}
function onBrandLogo(input){
  readImg(input,async url=>{
    const small=await resizeImage(url,512);
    STATE.brand.logo=small;applyLogo();applyWordmark();setupPWA();markDirty();
    uploadPhoto(small,"logo",u=>{STATE.brand.logo=u;applyLogo();applyWordmark();setupPWA();markDirty();});
  });
}
function removeLogo(){STATE.brand.logo="none";_iconCache={src:"",out:""};applyLogo();applyWordmark();setupPWA();markDirty();toast(t("logo_removed"));}
function restoreLogo(){STATE.brand.logo="";_iconCache={src:"",out:""};applyLogo();applyWordmark();setupPWA();markDirty();toast(t("logo_restored"));}
function saveSettings(){applyBrand();forceSave();}

/* ===== login ===== */
function doLogin(target){
  if(target==="client"){document.getElementById("login").classList.add("hide");showView("client");return;}
  if(FB){
    const em=document.getElementById("logEmail").value.trim(),pw=document.getElementById("logPass").value;
    if(!em||!pw){showLogErr(t("err_needCreds"));return;}
    showLogInfo(t("connecting"));
    fbAuth.signInWithEmailAndPassword(em,pw).catch(e=>showLogErr(friendlyError(e)));
    return;
  }
  document.getElementById("login").classList.add("hide");showView("biz");
}
function doSignup(){
  if(!FB){doLogin();return;}
  const em=document.getElementById("logEmail").value.trim(),pw=document.getElementById("logPass").value;
  if(!em||!pw){showLogErr(t("err_needCreds"));return;}
  showLogInfo(t("connecting"));
  fbAuth.createUserWithEmailAndPassword(em,pw).catch(e=>showLogErr(friendlyError(e)));
}
function doReset(){
  if(!FB)return;
  const em=document.getElementById("logEmail").value.trim();
  if(!em){showLogErr(t("err_needCreds"));return;}
  fbAuth.sendPasswordResetEmail(em).then(()=>showLogInfo(t("reset_sent"))).catch(e=>showLogErr(friendlyError(e)));
}

/* ===== idioma ===== */
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=t(el.dataset.i18n);if(typeof v==="string")el.textContent=v;});
  document.querySelectorAll('[data-ph]').forEach(el=>{el.placeholder=t(el.dataset.ph);});
  document.documentElement.lang=STATE.lang;
  const lb=document.getElementById("langBtn");if(lb)lb.textContent="🌐 "+(STATE.lang==="es"?"EN":"ES");
  const bt=document.getElementById("brandTag");if(bt)bt.textContent=STATE.brand.tag||t("default_tagline");
  const cn=document.getElementById("clientNote");if(cn)cn.innerHTML=t("client_note");
  renderBkDogs();renderServices();
  if(document.getElementById("view-biz").classList.contains("on"))refreshBiz();else renderZones();
  try{if(document.getElementById("dpGrid"))renderDayPicker();}catch(e){}
  try{if(document.getElementById("slotList"))buildSlots();}catch(e){}
  try{refreshSaveBadge();}catch(e){}
  const s4=document.querySelector('#view-client .step[data-step="4"]');
  if(s4&&s4.style.display!=="none")buildSummary();
}
function setLang(l){
  if(l!=="es"&&l!=="en")return;
  STATE.lang=l;
  try{localStorage.setItem("mg_lang",l);}catch(e){}
  closeModal();applyLang();
}
function toggleLang(){setLang(STATE.lang==="es"?"en":"es");}
