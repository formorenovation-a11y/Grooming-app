<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mobile Grooming — Reservas y gestión de grooming a domicilio</title>
<meta name="theme-color" content="#A8688A" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mobile Grooming" id="appTitleMeta">
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="icon" id="favIcon" href="">
<link rel="manifest" id="manifestLink" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6F2;--blush:#F4DEE4;--blush-soft:#FBEDF0;
  --mauve:#A8688A;--mauve-deep:#823F61;--burgundy:#43202F;
  --ink:#3C2530;--muted:#9A7C87;--gold:#C2A24F;
  --line:#EAD7DC;--white:#FFFFFF;--ok:#4F8A6B;--warn:#B07A1E;--bad:#C0556B;
  --shadow:0 12px 40px -18px rgba(67,32,47,.35);
  --shadow-sm:0 4px 18px -10px rgba(67,32,47,.30);
  --r:18px;--r-sm:12px;--r-md:14px;--r-pill:999px;
  --tap:46px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.01em;color:var(--burgundy)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
::selection{background:var(--blush);color:var(--burgundy)}
a{color:var(--mauve-deep)}

.demo-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-top));background:rgba(251,246,242,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.demo-bar .pl{font-family:'Fraunces';font-weight:600;font-size:15px;color:var(--mauve-deep);margin-right:auto;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang-btn{display:flex;align-items:center;gap:5px;background:var(--blush-soft);border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 12px;font-size:12px;font-weight:700;color:var(--mauve-deep);flex:none}
.seg{display:flex;background:var(--blush-soft);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;flex:none}
.seg button{padding:8px 14px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--mauve-deep);transition:.2s}
.seg button.on{background:var(--burgundy);color:#fff;box-shadow:var(--shadow-sm)}

.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 90px}
.view{display:none;animation:fade .35s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#login{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#2c1420,#43202F 55%,#5c2c44);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .4s;overflow:auto}
#login.hide{display:none}
.login-card{width:100%;max-width:380px;text-align:center}
.login-logo{font-family:'Fraunces';font-size:40px;color:#fff;letter-spacing:-.02em;margin-bottom:4px}
.login-logo .paw{color:var(--gold)}
.login-mark{width:78px;height:78px;border-radius:22px;object-fit:cover;margin:0 auto 12px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.login-sub{color:#F0D9E1;font-size:13.5px;margin-bottom:26px}
.login-box{background:var(--cream);border:1px solid rgba(255,255,255,.5);border-radius:var(--r);padding:24px 20px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.login-box .field{margin-bottom:14px;text-align:left}
.login-box label{display:block;font-size:12.5px;color:var(--burgundy);font-weight:700;margin-bottom:6px}
.login-box input{width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink);outline:none;font-size:16px}
.login-box input::placeholder{color:#b89aa6}
.login-box input:focus{border-color:var(--mauve);box-shadow:0 0 0 3px rgba(168,104,138,.15)}
.login-btn{width:100%;padding:15px;border-radius:var(--r-pill);background:var(--gold);color:#3a2e10;font-weight:700;font-size:15px;margin-top:6px}
.login-alt{margin-top:16px;font-size:13px;color:var(--muted)}
.login-alt button{color:var(--mauve-deep);font-weight:700;text-decoration:underline}
.login-feat{display:flex;gap:16px;justify-content:center;margin-top:24px;color:#d9b9c6;font-size:11.5px;flex-wrap:wrap}
.login-feat span{display:flex;align-items:center;gap:5px}
.login-lang{margin-top:20px}.login-lang button{color:#E7C9D4;font-size:12px;font-weight:600;padding:6px 8px;text-decoration:underline}
.login-role{display:flex;gap:6px;background:rgba(255,255,255,.12);border-radius:var(--r-pill);padding:4px;margin-bottom:18px}
.login-role button{flex:1;padding:9px 10px;border-radius:var(--r-pill);font-size:12.5px;font-weight:700;color:#E7C9D4}
.login-role button.on{background:var(--cream);color:var(--burgundy)}

.brand{display:flex;align-items:center;gap:13px;margin:8px 0 24px}
.brand .mark{width:52px;height:52px;border-radius:16px;flex:none;background:linear-gradient(150deg,var(--mauve),var(--mauve-deep));display:grid;place-items:center;color:#fff;font-family:'Fraunces';font-size:24px;box-shadow:var(--shadow-sm);background-size:cover;background-position:center}
.brand .name{font-family:'Fraunces';font-size:22px;color:var(--burgundy);line-height:1.15}
.brand .tag{font-size:12.5px;color:var(--muted)}

.steps{display:flex;gap:6px;margin-bottom:22px}
.steps .s{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps .s.done{background:var(--gold)}.steps .s.cur{background:var(--mauve)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mauve);font-weight:600;margin-bottom:6px}
.step h2{font-size:25px;margin:0 0 4px}
.step .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--burgundy);margin-bottom:7px}
.field .opt-note{color:var(--muted);font-weight:400}
.input,select.input,textarea.input{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--cream);color:var(--ink);transition:.15s;outline:none;min-height:var(--tap)}
.input:focus{border-color:var(--mauve);background:#fff;box-shadow:0 0 0 4px var(--blush-soft)}
textarea.input{resize:vertical;min-height:74px}
.hint{font-size:13px;color:var(--muted)}

.combo{position:relative}
.combo .results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);max-height:240px;overflow:auto;display:none}
.combo .results.show{display:block}
.combo .results button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:12px 15px;text-align:left;border-bottom:1px solid var(--blush-soft);font-size:14.5px;color:var(--ink)}
.combo .results button:hover,.combo .results button.hl{background:var(--blush-soft)}
.combo .results button:last-child{border-bottom:none}
.combo .results .sz{font-size:11px;color:var(--muted);background:var(--blush-soft);padding:3px 9px;border-radius:var(--r-pill)}
.empty-res{padding:14px 15px;color:var(--muted);font-size:13.5px}

.opt-grid{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--cream);text-align:left;width:100%;transition:.15s}
.opt:hover{border-color:var(--mauve)}
.opt.sel{border-color:var(--mauve);background:var(--blush-soft);box-shadow:0 0 0 3px var(--blush-soft)}
.opt .ic{width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex:none}
.opt .tl{font-weight:600;color:var(--burgundy);font-size:15px}
.opt .ds{font-size:12.5px;color:var(--muted)}
.opt .pr{margin-left:auto;font-weight:700;color:var(--mauve-deep);font-family:'Fraunces'}
.opt .dur{font-size:11px;color:var(--muted);display:block;text-align:right}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.slot{padding:12px 8px;text-align:center;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--cream);font-size:14px;font-weight:600;color:var(--burgundy);transition:.15s;min-height:var(--tap)}
.slot:hover{border-color:var(--mauve)}.slot.sel{background:var(--burgundy);color:#fff;border-color:var(--burgundy)}
.slot.off{opacity:.42;cursor:not-allowed;text-decoration:line-through}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.check-line{display:flex;align-items:center;gap:11px;padding:13px 15px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--cream);cursor:pointer;margin-bottom:10px}
.check-line input{width:20px;height:20px;accent-color:var(--mauve);flex:none}
.check-line .t{font-size:14px;font-weight:600;color:var(--burgundy)}
.check-line .d{font-size:12px;color:var(--muted)}
.sub-inline{margin-top:10px;display:none}.sub-inline.show{display:block}

.actions{display:flex;gap:10px;margin-top:22px}
.btn{padding:14px 22px;border-radius:var(--r-pill);font-weight:600;font-size:15px;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap)}
.btn-primary{background:var(--burgundy);color:#fff;flex:1;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:#341824}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:#fff;color:var(--mauve-deep);border:1.5px solid var(--line)}
.btn-gold{background:var(--gold);color:#3a2e10}
.btn-sm{padding:10px 15px;font-size:13px;min-height:40px}
.btn-danger{background:#fff;color:var(--bad);border:1.5px solid #F0CDD4}
.btn-wa{background:#25D366;color:#08351b}

.summary{background:var(--blush-soft);border-radius:var(--r-sm);padding:16px 18px;margin-bottom:18px}
.summary .ln{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line);gap:12px}
.summary .ln:last-child{border:none}
.summary .ln .k{color:var(--muted);flex:none}.summary .ln .v{font-weight:600;color:var(--burgundy);text-align:right}
.summary .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:12px;border-top:1.5px solid var(--line)}
.summary .total .t{font-family:'Fraunces';font-size:26px;color:var(--mauve-deep)}
.deposit-tag{font-size:12.5px;color:var(--warn);margin-top:6px;font-weight:600}

.done-state{text-align:center;padding:18px 8px}
.done-state .check{width:70px;height:70px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px;margin:0 auto 16px;box-shadow:0 10px 30px -10px rgba(79,138,107,.6)}

.biz-head{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 18px;flex-wrap:wrap;gap:12px}
.biz-head h1{font-size:29px;margin:0;line-height:1.1}
.biz-head .meta{font-size:13px;color:var(--muted)}
.pl-badge{font-family:'Fraunces';font-size:13px;color:var(--mauve);border:1px solid var(--line);padding:6px 13px;border-radius:var(--r-pill);background:#fff}
.role-badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:var(--r-pill);background:var(--blush-soft);color:var(--mauve-deep);border:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:var(--blush-soft);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 15px;border-radius:var(--r-pill);font-size:13.5px;font-weight:600;color:var(--mauve-deep);white-space:nowrap;transition:.18s;flex:none}
.tabs button.on{background:#fff;color:var(--burgundy);box-shadow:var(--shadow-sm)}
.panel{display:none}.panel.on{display:block;animation:fade .3s ease}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--shadow-sm)}
.stat .k{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.stat .v{font-family:'Fraunces';font-size:28px;color:var(--burgundy);margin-top:4px;line-height:1}
.stat .d{font-size:12px;margin-top:5px;font-weight:600}
.stat .up{color:var(--ok)}.stat .gold{color:var(--gold)}

.sec-title{font-size:15px;font-family:'Fraunces';color:var(--burgundy);margin:22px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:0}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.view-toggle{display:flex;gap:4px;background:var(--blush-soft);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;margin-bottom:14px;width:fit-content;max-width:100%;overflow:auto}
.view-toggle button{padding:8px 15px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--mauve-deep);white-space:nowrap}
.view-toggle button.on{background:#fff;color:var(--burgundy);box-shadow:var(--shadow-sm)}

.searchbar{position:relative;margin-bottom:14px}
.searchbar input{width:100%;padding:13px 40px 13px 40px;border:1.5px solid var(--line);border-radius:var(--r-pill);background:#fff;outline:none;font-size:15px;min-height:var(--tap)}
.searchbar input:focus{border-color:var(--mauve);box-shadow:0 0 0 4px var(--blush-soft)}
.searchbar .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}
.searchbar .sx{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;padding:6px 10px;display:none}
.searchbar.has .sx{display:block}
.res-count{font-size:12px;color:var(--muted);margin:-6px 0 12px 4px}

.appt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px 13px 19px;margin-bottom:10px;box-shadow:var(--shadow-sm);text-align:left;width:100%;transition:.15s;position:relative;overflow:hidden;cursor:pointer}
.appt .vanstrip{position:absolute;left:0;top:0;bottom:0;width:5px}
.appt:hover{border-color:var(--mauve);transform:translateY(-1px)}
.appt .when{text-align:center;flex:none;width:52px}
.appt .when .d{font-family:'Fraunces';font-size:21px;color:var(--mauve-deep);line-height:1}
.appt .when .m{font-size:10.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.appt .when .h{font-size:12px;color:var(--burgundy);font-weight:600;margin-top:3px}
.appt .info{flex:1;min-width:0}
.appt .info .pet{font-weight:700;color:var(--burgundy);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appt .info .det{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appt .info .vantag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;margin-top:3px;color:var(--mauve-deep)}
.appt .info .vantag .vd{width:8px;height:8px;border-radius:50%}
.appt .rgt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:var(--r-pill);white-space:nowrap}
.b-conf{background:#E9F3ED;color:var(--ok)}.b-pend{background:#FBF0E1;color:var(--warn)}
.b-done{background:#EEE7F0;color:var(--mauve-deep)}.b-paid{background:#E9F3ED;color:var(--ok)}.b-unpaid{background:#FBE7EB;color:var(--bad)}
.appt .price{font-family:'Fraunces';font-weight:600;color:var(--mauve-deep)}
.appt .pic{width:42px;height:42px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--line)}
.appt .pic-stack{position:relative;flex:none;width:42px;height:42px}
.appt .pic-stack .n{position:absolute;right:-4px;bottom:-4px;background:var(--burgundy);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px;border:2px solid #fff}
.qdone{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ok);background:#fff;color:var(--ok);font-size:17px;line-height:1;cursor:pointer;font-family:inherit}
.qdone:hover{background:var(--ok);color:#fff}
.qdone:active{transform:scale(.92)}

.van-group{margin-bottom:22px}
.van-group .vg-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.van-group .vg-dot{width:14px;height:14px;border-radius:50%;flex:none}
.van-group .vg-name{font-family:'Fraunces';font-size:17px;color:var(--burgundy)}
.van-group .vg-meta{font-size:12px;color:var(--muted);margin-left:auto;text-align:right}

.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding:14px 4px 0;margin-top:6px}
.chart .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar .fill{width:100%;max-width:42px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--mauve),var(--mauve-deep));transition:height .6s cubic-bezier(.2,.8,.2,1)}
.chart .bar .lab{font-size:11px;color:var(--muted);font-weight:600}
.chart .bar .val{font-size:10px;color:var(--mauve-deep);font-weight:700}

.fin-rows{margin-top:8px}
.fin-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--blush-soft);gap:10px}
.fin-row .lft{display:flex;align-items:center;gap:11px;min-width:0}
.fin-row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.fin-row .nm{font-size:14px;color:var(--burgundy);font-weight:500}
.fin-row .sub{font-size:12px;color:var(--muted)}
.fin-row .amt{font-weight:700;font-family:'Fraunces';white-space:nowrap}
.amt.in{color:var(--ok)}.amt.out{color:var(--bad)}
.fin-row.overdue{border-left:3px solid var(--bad);padding-left:9px}

.cli-card{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow-sm);text-align:left;width:100%;transition:.15s}
.cli-card:hover{border-color:var(--mauve);transform:translateY(-1px)}
.cli-avatar{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px;background:var(--blush-soft);border:1px solid var(--line);overflow:hidden}
.cli-avatar img{width:100%;height:100%;object-fit:cover}
.cli-card .ci{flex:1;min-width:0}
.cli-card .cn{font-weight:700;color:var(--burgundy);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli-card .cd{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli-card .cv{text-align:right;flex:none}
.cli-card .cv .tot{font-family:'Fraunces';font-weight:600;color:var(--mauve-deep)}
.cli-card .cv .vis{font-size:11px;color:var(--muted)}
.cli-card.cold{border-left:4px solid var(--gold)}

.cfg-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:19px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.cfg-card h3{font-size:17px;margin:0 0 4px}
.cfg-card p.hint{margin:0 0 16px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--blush-soft);border:1px solid var(--line);color:var(--mauve-deep);padding:9px 13px;border-radius:var(--r-pill);font-size:13px;font-weight:600}
.chip button{color:var(--mauve);font-size:16px;line-height:1;opacity:.7;padding:2px 4px}.chip button:hover{opacity:1}
.add-inline{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.add-inline .input{flex:1;min-width:120px}.add-inline .btn{flex:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:12px;cursor:pointer;border:3px solid transparent;transition:.15s}
.sw.on{border-color:var(--burgundy);transform:scale(1.06)}
.hours-grid{display:grid;gap:8px}
.hour-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--blush-soft);flex-wrap:wrap}
.hour-row .day{width:104px;font-weight:600;color:var(--burgundy);font-size:13.5px}
.toggle{width:46px;height:28px;border-radius:var(--r-pill);background:var(--line);position:relative;transition:.2s;flex:none;cursor:pointer}
.toggle.on{background:var(--mauve)}
.toggle::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.on::after{left:21px}
.hour-row .times{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.hour-row .times input{width:96px;padding:8px 9px;min-height:40px}
.hour-row.off .times{opacity:.35;pointer-events:none}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--blush-soft);flex-wrap:wrap}
.setting-row:last-child{border:none}
.setting-row .sl{flex:1;min-width:150px}
.setting-row .st{font-weight:600;color:var(--burgundy);font-size:14px}
.setting-row .ss{font-size:12px;color:var(--muted)}
.setting-row .num{width:90px}
.staff-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--blush-soft);flex-wrap:wrap}
.staff-row .av{width:40px;height:40px;border-radius:11px;background:var(--blush-soft);display:grid;place-items:center;font-weight:700;color:var(--mauve-deep);flex:none}
.staff-row .sn{flex:1;min-width:120px;font-weight:600;color:var(--burgundy);font-size:14px}
.staff-row .se{font-size:11.5px;color:var(--muted);font-weight:400;display:block}
.staff-row .comm{width:76px}
.van-row2{border:1px solid var(--line);border-radius:var(--r-md);padding:10px;margin-bottom:10px;background:#fff}
.van-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.van-row2 .vcolor{width:38px;height:38px;border-radius:10px;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;position:relative;overflow:hidden}
.van-row2 .vcolor input{position:absolute;inset:-6px;opacity:0;cursor:pointer}
.van-row2 .vn{flex:1;min-width:110px}
.van-row2 .vsel{min-width:120px;flex:1}
.vx{color:var(--mauve);padding:6px 9px;font-size:16px}
.van-zones{margin-top:9px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.vz-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding-top:8px;flex:0 0 auto}
.zchips{display:flex;flex-wrap:wrap;gap:6px}
.zchip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:7px 12px;font-size:12px;font-family:inherit;cursor:pointer}
.zchip.on{background:var(--mauve);border-color:var(--mauve);color:#fff;font-weight:600}
.reminder-preview{background:var(--blush-soft);border-radius:var(--r-sm);padding:14px 16px;font-size:13px;color:var(--ink);line-height:1.6;margin-top:12px}
.reminder-preview .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:6px}

.modal-bg{position:fixed;inset:0;z-index:150;background:rgba(43,20,32,.5);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex;animation:fade .25s}
.modal{background:var(--cream);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:slideUp .3s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.modal .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 14px;position:sticky;top:0}
.modal-head{display:flex;align-items:flex-start;gap:13px;margin-bottom:16px}
.modal-head .av{width:54px;height:54px;border-radius:16px;background:linear-gradient(150deg,var(--mauve),var(--mauve-deep));display:grid;place-items:center;font-size:26px;flex:none;overflow:hidden;color:#fff}
.modal-head .av img{width:100%;height:100%;object-fit:cover}
.modal-head h2{font-size:22px;margin:0;line-height:1.15}
.modal-head .mh-sub{font-size:13px;color:var(--muted)}
.modal-head .x{margin-left:auto;font-size:26px;color:var(--muted);line-height:1;padding:2px 8px}
.mrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.mrow .mi{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:16px;flex:none}
.mrow .mk{font-size:12px;color:var(--muted)}
.mrow .mv{font-weight:600;color:var(--burgundy);font-size:14px}
.mrow a.mv{text-decoration:none}
.mrow .mr{margin-left:auto;text-align:right}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.modal-actions .btn{width:100%}
.modal-actions .full{grid-column:1/-1}
.pet-pill{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:var(--r-pill);padding:7px 13px;font-size:13px;font-weight:600;color:var(--burgundy);margin:4px 6px 4px 0}
.hist-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--blush-soft);font-size:13.5px;gap:10px}
.hist-item .hk{color:var(--ink)}.hist-item .hv{color:var(--mauve-deep);font-weight:600;white-space:nowrap}

.photo-up{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.photo-up .pbox{width:80px;height:80px;border-radius:18px;border:2px dashed var(--line);background:var(--cream);display:grid;place-items:center;cursor:pointer;overflow:hidden;flex:none;transition:.15s}
.photo-up .pbox:hover{border-color:var(--mauve);background:var(--blush-soft)}
.photo-up .pbox img{width:100%;height:100%;object-fit:cover}
.photo-up .pbox .ic{font-size:28px}
.photo-up .pbox input{display:none}
.photo-up .ptxt{font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--burgundy);color:#fff;padding:13px 22px;border-radius:var(--r-pill);font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;z-index:300;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.6}
.note b{color:var(--mauve-deep)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:36px 20px}
.tab-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--mauve-deep);color:#fff;font-size:11px;font-weight:700;vertical-align:middle}

.req-card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--r-md);padding:15px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.req-card.proposed{border-left-color:var(--mauve)}
.req-top{display:flex;gap:12px;align-items:flex-start}
.req-card .pic{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--line)}
.req-card .ph{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--blush-soft);font-size:22px}
.req-card .rt-info{flex:1;min-width:0}
.req-card .rt-pet{font-family:'Fraunces';font-size:17px;color:var(--burgundy)}
.req-card .rt-meta{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5;word-break:break-word}
.req-card .rt-price{font-family:'Fraunces';font-weight:600;color:var(--mauve-deep);font-size:16px;text-align:right;flex:none}
.req-when{display:flex;align-items:center;gap:8px;margin:12px 0;padding:10px 12px;background:var(--cream);border-radius:10px;font-size:13.5px;color:var(--burgundy);font-weight:600;flex-wrap:wrap}
.req-when .pin{text-decoration:line-through;color:var(--muted);font-weight:400}
.req-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hist-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
.hist-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hist-pet{font-weight:600;color:var(--burgundy);font-size:14.5px}
.hist-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.hist-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

.save-bar{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(to top,var(--cream) 72%,transparent);margin-top:8px;z-index:5}
.svc-cat{margin-bottom:16px}
.svc-cat-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.svc-cat-h .folder{font-family:'Fraunces';font-size:15px;color:var(--burgundy)}
.svc-cat-edit{color:var(--mauve);font-size:15px;padding:6px 9px}
.svc-edit2{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:.15s}
.svc-edit2:hover{border-color:var(--mauve);background:var(--blush-soft)}
.svc-edit2 .se-ic{font-size:20px;flex:none}
.svc-edit2 .se-nm{flex:1;font-weight:600;color:var(--burgundy);font-size:14.5px;min-width:0}
.svc-edit2 .se-sub{font-weight:400;color:var(--muted);font-size:12.5px}
.svc-edit2 .se-go{color:var(--mauve);flex:none}
.svc-lock{font-size:11px;margin-left:5px}
.se-empty{font-size:13px;color:var(--muted);padding:6px 2px 10px}
.se-breed{font-size:10px;background:var(--blush-soft);color:var(--mauve-deep);border-radius:10px;padding:1px 6px;margin-left:4px}
.price-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lab-strong{display:block;font-weight:700;color:var(--burgundy);font-size:13px;margin:14px 0 8px}
.chk-row{display:flex;flex-wrap:wrap;gap:10px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--burgundy);background:var(--blush-soft);border:1px solid var(--line);padding:8px 12px;border-radius:var(--r-pill);cursor:pointer}
.chk input{accent-color:var(--mauve);width:17px;height:17px}
.bk-cat{font-family:'Fraunces';font-size:14px;color:var(--mauve-deep);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bk-cat .one.many{color:var(--ok)}
.bk-cat .one{font-family:'Inter';font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
body.public-mode .demo-bar .seg{display:none}
.link-row{display:flex;gap:8px;flex-wrap:wrap}
.link-row .input{flex:1;min-width:180px;font-size:13px;color:var(--mauve-deep)}
.co-lines{margin:4px 0 10px}
.co-lines .col{display:flex;justify-content:space-between;padding:8px 0;font-size:14.5px;color:var(--burgundy);border-bottom:1px solid var(--line);gap:10px}
.co-lines .tip-line{color:var(--mauve-deep)}
.tip-row{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 14px}
.tip-btn{flex:1;min-width:62px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 6px;font-weight:600;font-size:13px;color:var(--burgundy)}
.tip-btn.on{background:var(--mauve);color:#fff;border-color:var(--mauve)}
.tip-custom{flex:1;min-width:70px;padding:10px}
.co-total{display:flex;justify-content:space-between;align-items:center;background:var(--burgundy);color:#fff;border-radius:14px;padding:14px 18px;font-family:'Fraunces';font-size:20px;margin-bottom:6px;gap:10px}
.pay-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pay-m{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-size:12.5px;font-weight:600;color:var(--burgundy);min-height:66px;justify-content:center}
.pay-m span{font-size:20px}
.pay-m.on{border-color:var(--mauve);background:var(--blush-soft);box-shadow:0 0 0 1.5px var(--mauve)}
.install-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);color:var(--mauve-deep);font-weight:600;font-size:13px;padding:11px 18px;border-radius:var(--r-pill);box-shadow:var(--shadow-sm)}
.install-chip:active{transform:scale(.97)}
.install-steps{margin:6px 0 4px;padding-left:22px;font-size:14px;line-height:1.85;color:var(--burgundy)}
.install-steps li{margin-bottom:4px}
.install-steps b{color:var(--mauve-deep)}

.cal-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.cal-nav{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--mauve-deep);font-size:20px;font-weight:700;flex:none;box-shadow:var(--shadow-sm)}
.cal-nav:hover{border-color:var(--mauve);background:var(--blush-soft)}
.cal-title{font-family:'Fraunces';font-size:19px;color:var(--burgundy);flex:1;text-align:center}
.cal-today{border:1px solid var(--line);background:var(--blush-soft);color:var(--mauve-deep);font-size:12px;font-weight:600;padding:10px 13px;border-radius:var(--r-pill);flex:none}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{min-height:104px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;flex-direction:column;gap:3px;padding:6px 5px 5px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.cal-cell:hover{border-color:var(--mauve);background:var(--blush-soft)}
.cal-cell.empty-day{background:transparent;border:none;cursor:default}
.cal-cell.empty-day:hover{background:transparent}
.cal-cell .dn{font-size:13px;font-weight:600;color:var(--burgundy);line-height:1;align-self:flex-start;width:23px;height:23px;display:grid;place-items:center;border-radius:50%;flex:none}
.cal-cell.today .dn{background:var(--mauve);color:#fff}
.cal-cell.sel{border-color:var(--burgundy);box-shadow:0 0 0 2px var(--burgundy);background:#fff}
.cal-evs{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-ev{display:flex;align-items:center;gap:5px;padding:2px 6px;border-radius:6px;font-size:10.5px;font-weight:600;color:var(--burgundy);line-height:1.3;text-align:left;width:100%;overflow:hidden;border-left:3px solid var(--vc,#ccc)}
.cal-ev .ed{width:7px;height:7px;border-radius:50%;flex:none}
.cal-ev .et{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-more{font-size:10px;font-weight:700;color:var(--mauve-deep);padding-left:5px}
.cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0 4px;justify-content:center}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.cal-legend .ld{width:9px;height:9px;border-radius:50%}

.save-dot{font-size:11px;font-weight:600;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);white-space:nowrap;cursor:pointer;font-family:inherit}
.save-dot:active{transform:scale(.96)}
.save-dot.sv-w{color:#8a6d1f;border-color:rgba(194,162,79,.6);background:#fdf7e6}
.save-dot.sv-ok{color:#2f6b4a;border-color:rgba(79,138,107,.5);background:#e9f4ee}
.save-dot.sv-err{color:#9c2740;border-color:rgba(192,85,107,.5);background:#fbe4e8}
#loadBanner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fbe4e8;border:1px solid rgba(192,85,107,.5);color:#9c2740;font-size:13px;padding:11px 14px;border-radius:12px;margin-bottom:14px;flex-wrap:wrap}
.rem-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;flex-wrap:wrap}
.rem-row .rs{font-size:12px;color:var(--muted);margin-top:2px}
.rem-row .ra{display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.ed-svc{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff;cursor:pointer}
.ed-svc input{width:19px;height:19px;accent-color:var(--mauve)}
.ed-svc .pz{margin-left:auto;font-family:'Fraunces';color:var(--mauve-deep);font-weight:600}

.daypick{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 12px 8px}
.dp-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px;gap:8px}
.dp-month{font-family:'Fraunces';font-size:15.5px;font-weight:600;color:var(--burgundy);text-transform:capitalize}
.dp-nav{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--mauve-deep);font-size:19px;line-height:1;cursor:pointer;flex:none}
.dp-nav:disabled{opacity:.25;cursor:default}
.dp-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-bottom:6px}
.dp-dow span{text-align:center;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dp-cell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:11px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-family:inherit;padding:2px;transition:.12s}
.dp-cell.blank{border:0;background:none;cursor:default}
.dp-cell .dn{font-family:'Fraunces';font-size:16px;font-weight:600;color:var(--burgundy);line-height:1}
.dp-cell .dfr{font-size:8.5px;color:#2f6b4a;font-weight:600;line-height:1.1;text-align:center}
.dp-cell.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.dp-cell.off{opacity:.42;background:var(--blush-soft);cursor:not-allowed}
.dp-cell.off .dfr{color:#a2727f;font-weight:500}
.dp-cell:not(.off):not(.blank):hover{border-color:var(--mauve)}
.dp-cell.on{background:var(--mauve);border-color:var(--mauve)}
.dp-cell.on .dn,.dp-cell.on .dfr{color:#fff}
.dp-note{font-size:12px;color:var(--muted);padding:9px 2px 2px}

.ch-line{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;font-size:13.5px;color:var(--muted);gap:10px}
.ch-line b{font-family:'Fraunces';font-size:16px;color:var(--burgundy)}
.ch-line.big{font-size:15px;color:var(--burgundy);font-weight:600}
.ch-line.big b{font-size:22px;color:var(--mauve-deep)}
.ch-quick{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.cs-line{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.cs-line .cs-disc{color:#2f6b4a;font-weight:600}
.cs-line .cs-bal{color:#9c2740;font-weight:600}

.addr-field{position:relative}
.addr-sug{position:absolute;left:0;right:0;top:100%;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(67,32,47,.16);overflow:hidden;display:none;margin-top:4px;max-height:270px;overflow-y:auto}
.addr-sug.show{display:block}
.addr-sug button{display:block;width:100%;text-align:left;padding:12px 13px;border:0;background:#fff;font-family:inherit;font-size:13.5px;color:var(--burgundy);cursor:pointer;border-bottom:1px solid var(--blush-soft)}
.addr-sug button:last-child{border-bottom:0}
.addr-sug button:hover,.addr-sug button.hi{background:var(--blush-soft)}
.addr-sug .sug-km{float:right;font-size:11px;color:var(--mauve-deep);background:var(--blush-soft);border-radius:10px;padding:2px 8px;margin-left:8px;font-weight:600}
.addr-sug .sug-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.addr-state{font-size:12px;margin-top:6px;min-height:16px}
.addr-state.okv{color:#2f6b4a;font-weight:600}
.addr-state.warn{color:#8a6d1f}
.addr-attrib{font-size:10px;color:var(--muted);padding:6px 13px;background:var(--cream)}

.bp-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff;font-size:13px}
.bp-row .bp-b{flex:1;font-weight:600;color:var(--burgundy)}
.bp-row .bp-p{font-family:'Fraunces';color:var(--mauve-deep);font-weight:600}
.bp-row .bp-m{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.dogcard{border:1px solid var(--line);border-radius:14px;background:#fff;padding:13px;margin-bottom:10px}
.dogcard .dh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dogcard .dh .idx{width:28px;height:28px;border-radius:9px;background:var(--blush-soft);color:var(--mauve-deep);font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
.dogcard .dh .dt{flex:1;font-weight:700;color:var(--burgundy);font-size:14.5px;min-width:0}
.dogcard .dh .dp{font-family:'Fraunces';color:var(--mauve-deep);font-weight:600;font-size:15px}
.dog-sum{display:flex;justify-content:space-between;align-items:center;background:var(--blush-soft);border-radius:12px;padding:12px 15px;margin:10px 0;font-weight:600;color:var(--burgundy);gap:10px}
.dog-sum .t{font-family:'Fraunces';font-size:20px;color:var(--mauve-deep)}
.dog-line{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--muted);padding:3px 0}
.dog-line b{color:var(--burgundy);font-weight:600}
.mini-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px dashed var(--line);background:#fff;color:var(--mauve-deep);border-radius:12px;padding:13px;font-weight:600;font-size:14px;margin-bottom:10px}
.mini-add:hover{border-color:var(--mauve);background:var(--blush-soft)}

.quick-row{display:grid;grid-template-columns:1fr auto auto;gap:9px;margin-bottom:18px}
.quick-main{display:flex;align-items:center;gap:12px;background:var(--burgundy);color:#fff;border-radius:var(--r);padding:15px 18px;text-align:left;box-shadow:0 12px 30px -14px rgba(67,32,47,.7);min-height:62px;min-width:0}
.quick-main:active{transform:scale(.985)}
.quick-main .qi{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:18px;flex:none}
.quick-main .qt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.quick-main .qt b{font-family:'Fraunces';font-weight:600;font-size:16.5px}
.quick-main .qt span{font-size:11.5px;opacity:.72}
.quick-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;font-size:11px;font-weight:600;color:var(--mauve-deep);min-height:62px;box-shadow:var(--shadow-sm)}
.quick-side span:first-child{font-size:18px}
.quick-side:active{transform:scale(.96)}
.quick-side:hover{border-color:var(--mauve);background:var(--blush-soft)}
@media(max-width:420px){
 .quick-row{grid-template-columns:1fr 1fr}
 .quick-main{grid-column:1/-1}
}
.time-plan{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:5px;line-height:1.5}
.cap-box{background:var(--blush-soft);border-radius:12px;padding:13px 15px;margin-top:6px}
.cap-total{font-family:'Fraunces';font-size:17px;color:var(--burgundy)}
.cap-detail{font-size:12.5px;color:var(--mauve-deep);margin-top:5px;font-weight:600}
.cap-hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.van-cap{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap}
.van-cap input{width:82px;min-height:40px}
.van-cap .hint{font-size:11.5px}
.seat-pill{font-family:'Inter';font-size:11px;font-weight:700;background:#E9F3ED;color:var(--ok);border-radius:20px;padding:3px 10px;margin-left:6px;white-space:nowrap}
.seat-pill.none{background:#FBE7EB;color:var(--bad)}
.dupe-warn{background:#fbe4e8;border:1px solid rgba(192,85,107,.5);color:#9c2740;font-size:12.5px;padding:11px 13px;border-radius:11px;line-height:1.5}
.hist-card.unseen{border-left:4px solid var(--bad);background:#fffafb}
.cancel-why{font-size:12.5px;color:var(--burgundy);background:var(--blush-soft);border-radius:9px;padding:7px 10px;margin:7px 0 4px;line-height:1.45}
#earnNav .cal-title{font-size:15px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:90;display:flex;align-items:center;gap:8px;background:var(--burgundy);color:#fff;border-radius:var(--r-pill);padding:15px 20px;font-weight:700;font-size:14.5px;box-shadow:0 14px 34px -10px rgba(67,32,47,.6)}
.fab:active{transform:scale(.96)}
.fab.hide{display:none}

.pay-log{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--blush-soft);gap:10px}
.pay-log .pm{width:36px;height:36px;border-radius:10px;background:var(--blush-soft);display:grid;place-items:center;font-size:17px;flex:none}
.pay-log .pi{flex:1;min-width:0}
.pay-log .pn{font-size:14px;font-weight:600;color:var(--burgundy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay-log .ps{font-size:12px;color:var(--muted)}
.pay-log .pa{font-family:'Fraunces';font-weight:700;color:var(--ok);white-space:nowrap}

.tpl-box{margin-bottom:14px}
.tpl-box label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--burgundy);margin-bottom:6px;gap:8px}
.tpl-box .vars{font-size:11px;color:var(--muted);font-weight:400}
.tpl-box textarea{min-height:78px}

@media(max-width:640px){
 .wrap{padding:16px 13px 100px}
 .biz-head h1{font-size:23px}
 .biz-head{margin-bottom:14px}
 .row{flex-direction:column;gap:0}
 .modal-actions{grid-template-columns:1fr}
 .modal{max-height:96vh;padding:8px 15px calc(26px + env(safe-area-inset-bottom))}
 .req-actions{grid-template-columns:1fr}
 .price-grid{grid-template-columns:repeat(3,1fr)}
 .pay-grid{grid-template-columns:1fr 1fr}
 .stat-grid{grid-template-columns:1fr 1fr;gap:10px}
 .stat{padding:13px 14px}
 .stat .v{font-size:24px}
 .card{padding:17px}
 .cfg-card{padding:16px}
 .chart{gap:5px;height:150px}
 .chart .bar .val{font-size:9px}
 .appt{padding:12px 12px 12px 17px;gap:10px}
 .appt .when{width:46px}
 .appt .price{font-size:14px}
 .cal-cell{min-height:76px;border-radius:9px;padding:4px 3px 3px;gap:2px}
 .cal-cell .dn{font-size:11px;width:18px;height:18px}
 .cal-ev{font-size:9px;padding:1px 4px;gap:3px}
 .cal-ev .ed{display:none}
 .cal-ev .etime{display:none}
 .cal-more{font-size:9px;padding-left:2px}
 .cal-title{font-size:16px}
 .hour-row .day{width:88px;font-size:12.5px}
 .hour-row .times input{width:84px}
 .demo-bar .pl{font-size:13.5px}
 .add-inline{gap:7px}
 .add-inline .btn{width:100%}
 .modal-head h2{font-size:19px}
 .login-logo{font-size:33px}
}
@media(max-width:380px){
 .stat-grid{grid-template-columns:1fr}
 .slots{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <img id="loginMark" class="login-mark" alt="">
    <div class="login-logo" id="loginWord">Mobile <span class="paw">Grooming</span> 🐾</div>
    <div class="login-sub" data-i18n="login_sub"></div>
    <div class="login-box">
      <div class="login-role">
        <button id="lrOwner" class="on" onclick="setLoginRole('owner')" data-i18n="login_asOwner"></button>
        <button id="lrStaff" onclick="setLoginRole('staff')" data-i18n="login_asStaff"></button>
      </div>
      <div class="field"><label data-i18n="login_email"></label><input id="logEmail" type="email" autocomplete="username" inputmode="email" placeholder="tucorreo@ejemplo.com"></div>
      <div class="field"><label data-i18n="login_pass"></label><input id="logPass" type="password" autocomplete="current-password"></div>
      <div id="logErr" style="display:none;font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:12px"></div>
      <button class="login-btn" data-i18n="login_enter" onclick="doLogin()"></button>
      <div class="login-alt" id="signupRow"><span data-i18n="login_noAccount"></span> <button data-i18n="login_signup" onclick="doSignup()"></button></div>
      <div class="login-alt"><button data-i18n="login_forgot" onclick="doReset()"></button></div>
      <div class="login-alt" id="clientRow"><span data-i18n="login_seeClient"></span> <button data-i18n="login_viewClient" onclick="doLogin('client')"></button></div>
    </div>
    <div class="login-feat">
      <span>📅 <span data-i18n="feat_booking"></span></span><span>🔔 <span data-i18n="feat_reminders"></span></span><span>📍 <span data-i18n="feat_routes"></span></span><span>💰 <span data-i18n="feat_finances"></span></span>
    </div>
    <div class="login-lang"><button onclick="setLang('es')">Español</button> · <button onclick="setLang('en')">English</button></div>
  </div>
</div>

<div class="demo-bar">
  <span class="pl" id="wordmark">Mobile Grooming 🐾</span>
  <button class="lang-btn" id="langBtn" onclick="toggleLang()">🌐 EN</button>
  <div class="seg" id="viewSeg">
    <button id="sw-client" onclick="showView('client')" data-i18n="sw_client"></button>
    <button id="sw-biz" class="on" onclick="showView('biz')" data-i18n="sw_biz"></button>
  </div>
</div>

<div class="wrap">

<section id="view-client" class="view">
  <div class="brand">
    <div class="mark" id="brandMark">B</div>
    <div><div class="name" id="brandName">Lubis Mobile Grooming</div><div class="tag" id="brandTag"></div></div>
  </div>

  <div class="steps"><div class="s cur" data-s="1"></div><div class="s" data-s="2"></div><div class="s" data-s="3"></div><div class="s" data-s="4"></div></div>

  <div class="card">
    <div class="step" data-step="1">
      <div class="eyebrow" data-i18n="step_1_4"></div><h2 data-i18n="s1_title"></h2>
      <p class="sub" data-i18n="s1_sub"></p>
      <div id="bkDogs"></div>
      <button class="mini-add" onclick="bkAddDog()">➕ <span data-i18n="bk_addDog"></span></button>
      <div class="actions"><button class="btn btn-primary" id="next1" disabled onclick="goStep(2)" data-i18n="continue"></button></div>
    </div>

    <div class="step" data-step="2" style="display:none">
      <div class="eyebrow" data-i18n="step_2_4"></div><h2 data-i18n="s2_title"></h2>
      <p class="sub" data-i18n="s2_sub"></p>
      <div id="serviceList"></div>
      <div id="svcTotal" style="text-align:right;margin-top:14px;font-size:14px;color:var(--mauve-deep)"></div>
      <div class="actions"><button class="btn btn-ghost" onclick="goStep(1)" data-i18n="back"></button><button class="btn btn-primary" id="next2" disabled onclick="goStep(3)" data-i18n="continue"></button></div>
    </div>

    <div class="step" data-step="3" style="display:none">
      <div class="eyebrow" data-i18n="step_3_4"></div><h2 data-i18n="s3_title"></h2>
      <p class="sub" data-i18n="s3_sub"></p>
      <div class="field"><label data-i18n="zone_lbl"></label><select class="input" id="zoneSelect"></select></div>
      <div class="field addr-field"><label data-i18n="addr_lbl"></label>
        <input class="input" id="bookAddr" data-ph="addr_ph" autocomplete="off">
        <div class="addr-sug" id="addrSug"></div>
        <div class="addr-state" id="addrState"></div>
      </div>
      <div class="field"><label data-i18n="date_lbl"></label>
        <div class="daypick">
          <div class="dp-head"><button class="dp-nav" id="dpPrev" onclick="dpShift(-1)" aria-label="prev">‹</button><span class="dp-month" id="dpMonth"></span><button class="dp-nav" id="dpNext" onclick="dpShift(1)" aria-label="next">›</button></div>
          <div class="dp-dow" id="dpDow"></div>
          <div class="dp-grid" id="dpGrid"></div>
          <div class="dp-note" id="dpNote"></div>
        </div>
      </div>
      <div class="field"><label data-i18n="slots_lbl"></label><div class="slots" id="slotList"></div><div id="slotInfo"></div></div>
      <label class="check-line"><input type="checkbox" id="recurChk" onchange="toggleRecur()"><span><span class="t" data-i18n="recur_t"></span><span class="d" data-i18n="recur_d"></span></span></label>
      <div class="sub-inline" id="recurOpts">
        <div class="field"><select class="input" id="recurEvery" onchange="toggleCustomRecur()">
          <option value="2" data-i18n="every2"></option><option value="3" data-i18n="every3"></option>
          <option value="4" selected data-i18n="every4"></option><option value="6" data-i18n="every6"></option>
          <option value="8" data-i18n="every8"></option><option value="custom" data-i18n="everyCustom"></option></select></div>
        <div class="field" id="recurCustomWrap" style="display:none"><input class="input" id="recurCustom" type="number" min="1" max="52" value="3" placeholder="#"></div>
        <div class="hint" id="recurNote"></div>
      </div>
      <div class="actions"><button class="btn btn-ghost" onclick="goStep(2)" data-i18n="back"></button><button class="btn btn-primary" id="next3" disabled onclick="goStep(4)" data-i18n="continue"></button></div>
    </div>

    <div class="step" data-step="4" style="display:none">
      <div class="eyebrow" data-i18n="step_4_4"></div><h2 data-i18n="s4_title"></h2>
      <p class="sub" data-i18n="s4_sub"></p>
      <div class="summary" id="bookSummary"></div>
      <div class="row"><div class="field"><label data-i18n="yourName_lbl"></label><input class="input" id="ownerName" data-ph="yourName_ph" autocomplete="name"></div><div class="field"><label data-i18n="phone_lbl"></label><input class="input" id="ownerPhone" data-ph="phone_ph" inputmode="tel" autocomplete="tel"></div></div>
      <div class="field"><label><span data-i18n="email_lbl"></span> <span class="opt-note" data-i18n="email_note"></span></label><input class="input" id="ownerEmail" data-ph="email_ph" inputmode="email" autocomplete="email"></div>
      <div class="actions"><button class="btn btn-ghost" onclick="goStep(3)" data-i18n="back"></button><button class="btn btn-primary" id="confirmBtn" onclick="confirmBooking()" data-i18n="bookBtn"></button></div>
    </div>

    <div class="step" data-step="done" style="display:none">
      <div class="done-state"><div class="check">✓</div><h2 style="font-size:26px" data-i18n="done_title"></h2><p class="sub" id="doneMsg" style="margin-bottom:22px"></p><button class="btn btn-gold" style="width:100%" onclick="resetBooking()" data-i18n="another"></button></div>
    </div>
  </div>
  <p class="note" id="clientNote"></p>
  <div style="text-align:center;margin-top:8px"><button class="install-chip" onclick="promptInstall()">📲 <span data-i18n="pwa_install"></span></button></div>

<script>
/* ============================================================
   FIREBASE — pega aquí la config de tu proyecto para activar la nube.
   Con apiKey vacío la app corre en MODO DEMO (en memoria).
   ============================================================ */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyArMFhZ-15v5t6FpsuUR9gPDIDjunyKDCk",
  authDomain:"grooming-c6ae7.firebaseapp.com",
  projectId:"grooming-c6ae7",
  storageBucket:"grooming-c6ae7.firebasestorage.app",
  messagingSenderId:"351255112534",
  appId:"1:351255112534:web:32d65510846fd9571784f7",
  measurementId:"G-6JCKKEDFHG"
};
let FB=false,fbAuth=null,fbDB=null,fbStore=null,fbUser=null,_loading=false;
let SAFE=false,_saveState="idle",_reqUnsub=null;
let BIZ_ID=null;                 // id del negocio cargado (uid del dueño)
let ME={role:"owner",name:"",staffId:"",email:""};
const LS_PREFIX="mg_backup_";
let LOGIN_ROLE="owner";

/* ===== errores legibles: nunca mostramos códigos crudos ===== */
const ERR_MAP={
  "permission-denied":"err_perm","insufficient permissions":"err_perm",
  "unavailable":"err_net","deadline-exceeded":"err_net","timeout":"err_net","network":"err_net",
  "invalid-argument":"err_data","not-found":"err_notfound","already-exists":"err_dupe",
  "resource-exhausted":"err_quota","failed-precondition":"err_index","unauthenticated":"err_session",
  "auth/wrong-password":"err_auth","auth/user-not-found":"err_auth","auth/invalid-credential":"err_auth",
  "auth/invalid-email":"err_email","auth/email-already-in-use":"err_inuse","auth/weak-password":"err_weak",
  "auth/too-many-requests":"err_many","auth/network-request-failed":"err_net"
};
function friendlyError(e){
  const raw=((e&&(e.code||e.message))||"").toString().toLowerCase();
  for(const k in ERR_MAP){if(raw.indexOf(k)>=0)return t(ERR_MAP[k]);}
  return t("err_generic");
}

function fbInit(){
  try{
    if(typeof firebase==="undefined"||!FIREBASE_CONFIG.apiKey)return false;
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth=firebase.auth();fbDB=firebase.firestore();
    try{fbDB.settings({experimentalAutoDetectLongPolling:true,merge:true});}catch(e){}
    try{fbDB.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}
    try{fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){}
    try{fbStore=firebase.storage();}catch(e){fbStore=null;}
    fbAuth.onAuthStateChanged(async u=>{
      fbUser=u||null;
      if(PUBLIC)return;
      if(u){await resolveAccess(u);}
      else{SAFE=false;BIZ_ID=null;ME={role:"owner",name:"",staffId:"",email:""};stopWatchRequests();setSaveState("idle");document.getElementById("login").classList.remove("hide");}
    });
    return true;
  }catch(e){console.warn("Firebase init:",e);return false;}
}

/* ============================================================
   ACCESO: dueño = su propio negocio · groomer = enlace a un negocio
   ============================================================ */
async function resolveAccess(u){
  showLogInfo(t("connecting"));
  try{
    const link=await withTimeout(fbDB.collection("staffLinks").doc(u.uid).get(),12000);
    if(link.exists){
      const d=link.data()||{};
      BIZ_ID=d.bizId;ME={role:d.role||"groomer",name:d.name||u.email,staffId:d.staffId||"",email:u.email};
      return loadBiz(BIZ_ID);
    }
  }catch(e){console.warn("staffLink:",e);}
  // ¿Hay una invitación esperando a este correo?
  try{
    const em=(u.email||"").trim().toLowerCase();
    if(em){
      const inv=await withTimeout(fbDB.collection("staffInvites").doc(em).get(),12000);
      if(inv.exists){
        const d=inv.data()||{};
        const rec={bizId:d.bizId,staffId:d.staffId||"",name:d.name||u.email,role:d.role||"groomer",email:em,at:Date.now()};
        try{await fbDB.collection("staffLinks").doc(u.uid).set(rec);}catch(e){console.warn("link set:",e);}
        try{await fbDB.collection("staffInvites").doc(em).set({claimedBy:u.uid,claimedAt:Date.now()},{merge:true});}catch(e){}
        BIZ_ID=rec.bizId;ME={role:rec.role,name:rec.name,staffId:rec.staffId,email:em};
        return loadBiz(BIZ_ID);
      }
    }
  }catch(e){console.warn("invite:",e);}
  if(LOGIN_ROLE==="staff"){
    showLogErr(t("err_noInvite"));
    try{await fbAuth.signOut();}catch(e){}
    return;
  }
  BIZ_ID=u.uid;ME={role:"owner",name:u.email,staffId:"",email:u.email};
  return loadBiz(BIZ_ID);
}
function isOwner(){return ME.role==="owner";}
function isAdmin(){return ME.role==="owner"||ME.role==="admin";}
function isStaff(){return ME.role==="groomer";}
function myStaffName(){const s=(STATE.staff||[]).find(x=>x.id===ME.staffId);return s?s.name:ME.name;}
/* El groomer solo ve lo suyo. */
function visibleAppts(){
  if(!isStaff())return STATE.appointments;
  const n=myStaffName();
  return STATE.appointments.filter(a=>a.groomer===n||a.staffId===ME.staffId||(a.createdBy&&a.createdBy===ME.staffId));
}

/* ============================================================
   SINCRONIZACIÓN
   ============================================================ */
const CFG_KEYS=["brand","zones","categories","services","combos","staff","vans","hours","settings","slots","expenses"];
const ALL_KEYS=CFG_KEYS.concat(["appointments","reqHistory","clients","cancellations"]);
const AUTOSAVE_MS=60000,DEBOUNCE_MS=4000;
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);}
function bizRef(){return fbDB.collection("businesses").doc(BIZ_ID);}
function apptCol(){return bizRef().collection("appointments");}
function histCol(){return bizRef().collection("reqHistory");}
function cliCol(){return bizRef().collection("clients");}
function cancelCol(){return bizRef().collection("cancellations");}

let DIRTY=false,_saving=false,_queued=false,_autoT=null,_legacy=false;
let _written={cfg:"",appts:{},hist:{},clis:{},cancels:{}};
let SYNC={lastOk:0,lastErr:"",fails:0};

function clean(v){
  if(v===null)return null;
  if(Array.isArray(v))return v.map(clean);
  if(typeof v==="number")return isFinite(v)?v:0;
  if(typeof v==="object"){
    const o={};
    Object.keys(v).forEach(k=>{
      const val=v[k];
      if(val===undefined||typeof val==="function"||typeof val==="symbol")return;
      if(k.indexOf("__")===0)return;
      o[k]=clean(val);
    });
    return o;
  }
  if(typeof v==="undefined"||typeof v==="function")return null;
  return v;
}
function isTransient(e){
  const c=((e&&(e.code||e.message))||"").toString().toLowerCase();
  return /unavailable|deadline|timeout|internal|aborted|cancelled|network/.test(c);
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function withRetry(fn,tries){
  tries=tries||3;let last=null;
  for(let i=0;i<tries;i++){
    try{return await fn();}
    catch(e){last=e;if(!isTransient(e)||i===tries-1)throw e;await sleep(600*Math.pow(2,i));}
  }
  throw last;
}
function setSaveState(s){
  _saveState=s;
  const el=document.getElementById("saveDot");if(!el)return;
  const map={idle:["",""],saving:["sv-w",t("sv_saving")],ok:["sv-ok",t("sv_ok")],
    dirty:["sv-w",t("sv_dirty")],err:["sv-err",t("sv_err")],locked:["sv-err",t("sv_locked")]};
  const m=map[s]||map.idle;
  el.className="save-dot "+m[0];el.textContent=m[1];el.style.display=m[1]?"":"none";
  el.title=SYNC.lastErr||"";
}
function refreshSaveBadge(){
  if(!FB||!fbUser)return;
  if(!SAFE){setSaveState("locked");return;}
  if(_saving){setSaveState("saving");return;}
  setSaveState(DIRTY?"dirty":(SYNC.lastErr?"err":"ok"));
}
function serializeCfg(){const o={updatedAt:Date.now()};CFG_KEYS.forEach(k=>o[k]=STATE[k]);return o;}
function serializeBiz(){const o=serializeCfg();o.appointments=STATE.appointments;o.reqHistory=STATE.reqHistory;o.clients=STATE.clients;o.cancellations=STATE.cancellations;return o;}
function stripPhotos(list){return (list||[]).map(x=>{const c=JSON.parse(JSON.stringify(x||{}));
  if(c.photo&&String(c.photo).indexOf("data:")===0)c.photo="";
  if(Array.isArray(c.pets))c.pets.forEach(p=>{if(p.photo&&String(p.photo).indexOf("data:")===0)p.photo="";});
  return c;});}
function backupLocal(){
  try{
    const o=serializeCfg();o.appointments=stripPhotos(STATE.appointments);o.reqHistory=stripPhotos(STATE.reqHistory);o.clients=stripPhotos(STATE.clients);o.cancellations=STATE.cancellations;
    localStorage.setItem(LS_PREFIX+(BIZ_ID||"local"),JSON.stringify({at:Date.now(),data:o}));
  }catch(e){}
}
function readBackup(id){try{const raw=localStorage.getItem(LS_PREFIX+id);return raw?JSON.parse(raw):null;}catch(e){return null;}}
function downloadBackup(){
  try{
    const blob=new Blob([JSON.stringify(serializeBiz(),null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download=(STATE.brand.name||"backup").replace(/\s+/g,"-").toLowerCase()+"-"+addDays(0)+".json";
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  }catch(e){toast(friendlyError(e));}
}
let _debT=null;
function markDirty(){
  if(PUBLIC||!FB||!fbUser||_loading)return;
  DIRTY=true;backupLocal();

  const cfg=clean(serializeCfg());
  delete cfg.updatedAt;
  const j=JSON.stringify(cfg);
  if(j===_written.cfg)return false;
  cfg.updatedAt=Date.now();
  await withRetry(()=>bizRef().set(cfg,{merge:true}));
  _written.cfg=j;return true;
}
async function writeCollection(col,items,keyField,store){
  const now={};
  items.forEach(x=>{
    if(!x[keyField])x[keyField]=nid();
    now[x[keyField]]=JSON.stringify(clean(x));
  });
  const ops=[];
  items.forEach(x=>{const k=x[keyField];if(store[k]!==now[k])ops.push({t:"set",k:k,v:clean(x)});});
  Object.keys(store).forEach(k=>{if(now[k]===undefined)ops.push({t:"del",k:k});});
  for(let i=0;i<ops.length;i+=200){
    const chunk=ops.slice(i,i+200);
    await withRetry(()=>{
      const bt=fbDB.batch();
      chunk.forEach(o=>{if(o.t==="set")bt.set(col().doc(o.k),o.v);else bt.delete(col().doc(o.k));});
      return bt.commit();
    });
    chunk.forEach(o=>{if(o.t==="set")store[o.k]=now[o.k];else delete store[o.k];});
  }
}
async function saveNow(opts){
  opts=opts||{};
  if(PUBLIC||!FB||!fbUser||!SAFE||!BIZ_ID)return false;
  if(_saving){_queued=true;return false;}
  clearTimeout(_debT);
  _saving=true;setSaveState("saving");
  try{
    await writeCfg();
    await writeCollection(apptCol,STATE.appointments,"id",_written.appts);
    await writeCollection(cancelCol,STATE.cancellations||[],"id",_written.cancels);
    if(!isStaff()){
      await writeCollection(histCol,STATE.reqHistory||[],"hid",_written.hist);
      await writeCollection(cliCol,STATE.clients||[],"id",_written.clis);
      try{publishPublic();}catch(e){}
    }
    _saving=false;DIRTY=false;SYNC.lastOk=Date.now();SYNC.lastErr="";SYNC.fails=0;
    backupLocal();refreshSaveBadge();
    if(!opts.silent)toast(t("t_saved"));
    if(_queued){_queued=false;return saveNow({silent:true});}
    return true;
  }catch(e){
    _saving=false;_queued=false;
    SYNC.lastErr=friendlyError(e);SYNC.fails++;
    console.warn("saveNow:",e);
    setSaveState("err");
    if(!opts.silent)toast(SYNC.lastErr);
    else if(SYNC.fails===1||SYNC.fails%5===0)toast(t("save_retry"));
    return false;
  }
}

async function loadBiz(id,attempt){
  attempt=attempt||1;
  if(!id)return;
  _loading=true;SAFE=false;
  if(attempt===1){_legacy=false;_written={cfg:"",appts:{},hist:{},clis:{},cancels:{}};}
  document.getElementById("login").classList.add("hide");
  showView("biz");showLoadBanner("");setSaveState("saving");
  try{
    const ref=fbDB.collection("businesses").doc(id);
    const snap=await withRetry(()=>withTimeout(ref.get(),20000));
    let oldAppts=null,oldHist=null;
    if(snap.exists){
      const d=snap.data();
      CFG_KEYS.forEach(k=>{if(d[k]!==undefined)STATE[k]=d[k];});
      if(Array.isArray(d.appointments))oldAppts=d.appointments;
      if(Array.isArray(d.reqHistory))oldHist=d.reqHistory;
    }else if(isOwner()){
      STATE.appointments=[];STATE.reqHistory=[];STATE.clients=[];
      await withRetry(()=>withTimeout(ref.set(clean(serializeCfg())),20000));
    }
    const res=await Promise.all([
      withRetry(()=>withTimeout(ref.collection("appointments").get(),30000)),
      isStaff()?Promise.resolve({forEach:function(){}}):withRetry(()=>withTimeout(ref.collection("reqHistory").get(),30000)),
      isStaff()?Promise.resolve({forEach:function(){}}):withRetry(()=>withTimeout(ref.collection("clients").get(),30000)),
      withRetry(()=>withTimeout(ref.collection("cancellations").get(),30000))
    ]);
    const appts=[],hist=[],clis=[],cancels=[];
    res[0].forEach(d=>appts.push(Object.assign({},d.data(),{id:d.id})));
    res[1].forEach(d=>hist.push(Object.assign({},d.data(),{hid:d.id})));
    res[2].forEach(d=>clis.push(Object.assign({},d.data(),{id:d.id})));
    res[3].forEach(d=>cancels.push(Object.assign({},d.data(),{id:d.id})));
    STATE.cancellations=cancels.sort((a,b)=>(b.at||0)-(a.at||0));
    if(appts.length||!oldAppts)STATE.appointments=appts;
    if(hist.length||!oldHist)STATE.reqHistory=hist;
    STATE.clients=clis;
    if(oldAppts&&!appts.length){STATE.appointments=oldAppts.map(a=>Object.assign({},a,{id:a.id||nid()}));_legacy=true;}
    if(oldHist&&!hist.length){STATE.reqHistory=oldHist.map(x=>Object.assign({},x,{hid:x.hid||nid()}));_legacy=true;}
    (STATE.reqHistory||[]).sort((a,b)=>(b.at||0)-(a.at||0));
    migrateAll();
    if(!_legacy){
      const _c0=clean(serializeCfg());delete _c0.updatedAt;_written.cfg=JSON.stringify(_c0);
      STATE.appointments.forEach(a=>_written.appts[a.id]=JSON.stringify(clean(a)));
      (STATE.reqHistory||[]).forEach(x=>_written.hist[x.hid]=JSON.stringify(clean(x)));
      (STATE.clients||[]).forEach(x=>_written.clis[x.id]=JSON.stringify(clean(x)));
      (STATE.cancellations||[]).forEach(x=>_written.cancels[x.id]=JSON.stringify(clean(x)));
    }
    if(!isStaff())mergeRequests(await loadRequests(id));
    _loading=false;SAFE=true;DIRTY=false;SYNC.lastErr="";SYNC.fails=0;
    backupLocal();if(!isStaff())watchRequests(id);startAutosave();
    applyLang();refreshBiz();
    if(_legacy){const ok=await saveNow({silent:true});if(ok)await finishMigration(ref);}
    DIRTY=false;refreshSaveBadge();
  }catch(e){
    console.warn("loadBiz:",e);
    if(attempt<3&&isTransient(e)){await sleep(900*attempt);return loadBiz(id,attempt+1);}
    _loading=false;SAFE=false;
    const bk=readBackup(id);
    if(bk&&bk.data)ALL_KEYS.forEach(k=>{if(bk.data[k]!==undefined)STATE[k]=bk.data[k];});
    migrateAll();applyLang();refreshBiz();
    setSaveState("locked");
    showLoadBanner(friendlyError(e)+" "+t("load_safe"));
  }
}

function pawIconDataURL(color){
  try{const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");
    x.fillStyle=color||"#A8688A";const r=96;x.beginPath();x.moveTo(r,0);x.arcTo(512,0,512,512,r);x.arcTo(512,512,0,512,r);x.arcTo(0,512,0,0,r);x.arcTo(0,0,512,0,r);x.fill();
    x.font="300px serif";x.textAlign="center";x.textBaseline="middle";x.fillText("🐾",256,280);
    return c.toDataURL("image/png");
  }catch(e){return "";}
}
/* Icono cuadrado del logo, con relleno del color de marca: se ve bien en la pantalla de inicio. */
function squareIcon(src,color){
  return new Promise(res=>{
    try{
      const img=new Image();img.crossOrigin="anonymous";
      img.onload=()=>{
        try{
          const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");
          const ar=img.width/img.height;
          if(ar>0.88&&ar<1.14){
            // Ya es cuadrado (como el logo de Lubi's): se dibuja a sangre, sin marcos.
            const side=Math.min(img.width,img.height);
            x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,512,512);
          }else{
            // Logo alargado: se centra sobre su propio color de fondo.
            let bg=color||"#FFFFFF";
            try{
              const t=document.createElement("canvas");t.width=t.height=1;
              const tx=t.getContext("2d");tx.drawImage(img,0,0,1,1);
              const d=tx.getImageData(0,0,1,1).data;
              if(d[3]>200)bg="rgb("+d[0]+","+d[1]+","+d[2]+")";
            }catch(e){}
            x.fillStyle=bg;x.fillRect(0,0,512,512);
            const sc=Math.min(512/img.width,512/img.height)*0.86;
            const w=img.width*sc,h=img.height*sc;
            x.drawImage(img,(512-w)/2,(512-h)/2,w,h);
          }
          res(c.toDataURL("image/png"));
        }catch(e){res(src);}
      };
      img.onerror=()=>res(pawIconDataURL(color));
      img.src=src;
    }catch(e){res(pawIconDataURL(color));}
  });
}

/* ===== utilidades ===== */
function addDays(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function isoAdd(n){return addDays(n);}
function money(n){const v=Math.round((+n||0)*100)/100;return "$"+(Math.abs(v-Math.round(v))<0.005?Math.round(v).toLocaleString("en-US"):v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));}
function loc(){return STATE.lang==="en"?"en-US":"es-ES";}
function fmtDate(iso){if(!iso)return "—";return new Date(iso+"T12:00").toLocaleDateString(loc(),{weekday:"short",day:"numeric",month:"short"});}
function fmtDateLong(iso){if(!iso)return "—";return new Date(iso+"T12:00").toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"});}
function fmtDur(min){
  min=Math.max(0,Math.round(+min||0));
  const h=Math.floor(min/60),m=min%60;
  if(!h)return m+" "+t("m_min");
  return h+" h"+(m?" "+m+" "+t("m_min"):"");
}
function addMin(hhmm,min){
  const v=toMin(hhmm)+(+min||0);
  const h=Math.floor(v/60)%24,m=v%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function fmtTime(hhmm){if(!hhmm)return "—";const p=String(hhmm).split(":");let h=+p[0]||0;const m=p[1]||"00";const ap=h<12?"AM":"PM";let h12=h%12;if(h12===0)h12=12;return h12+":"+m+" "+ap;}
function dowName(iso){return new Date(iso+"T12:00").toLocaleDateString(loc(),{weekday:"long"});}
/* La semana laboral va de domingo a sábado: al terminar el sábado, arranca una nueva. */
function weekStart(iso){
  const d=new Date((iso||addDays(0))+"T12:00");
  d.setDate(d.getDate()-d.getDay());          // getDay(): 0 = domingo
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function weekEnd(iso){
  const d=new Date(weekStart(iso)+"T12:00");d.setDate(d.getDate()+6);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function weekShift(isoStart,n){
  const d=new Date(isoStart+"T12:00");d.setDate(d.getDate()+7*n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function weekLabel(isoStart){
  const a=new Date(isoStart+"T12:00"),b=new Date(weekEnd(isoStart)+"T12:00");
  const f=d=>d.toLocaleDateString(loc(),{day:"numeric",month:"short"});
  return f(a)+" – "+f(b);
}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/86400000);}
function toMin(hhmm){const p=String(hhmm||"00:00").split(":");return (+p[0]||0)*60+(+p[1]||0);}
function svcById(id){return STATE.services.find(s=>s.id===id)||{};}
function vanById(id){return STATE.vans.find(v=>v.id===id)||null;}
function catById(id){return STATE.categories.find(c=>c.id===id)||{name:"—"};}
/* Solo las categorías marcadas como complementos aceptan varias opciones a la vez. */
const ADDON_WORDS=["add-on","addon","add on","extra","complement","adicional","opcional","upgrade","plus"];
function looksLikeAddons(name){const n=norm(name);return ADDON_WORDS.some(w=>n.indexOf(w)>=0);}
function catAllowsMulti(catId){const c=catById(catId);return !!(c&&c.multi);}
function comboById(id){return (STATE.combos||[]).find(c=>c.id===id)||null;}
function staffByName(n){return (STATE.staff||[]).find(s=>s.name===n)||null;}
function initials(n){return String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();}
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2600);}
function normBreed(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
/* Clave de teléfono: así "615-555-0123", "(615) 5550123" y "+16155550123" son el mismo cliente. */
function phoneKey(p){let d=String(p||"").replace(/\D/g,"");if(d.length>10)d=d.slice(-10);return d;}
function cleanPhone(p){let d=String(p||"").replace(/\D/g,"");if(d.length===10)d="1"+d;return d;}
function fmtPhone(p){const d=phoneKey(p);if(d.length!==10)return p||"";return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6);}

/* ===== precios ===== */
function breedRule(svc,breed){
  if(!svc||!Array.isArray(svc.breedPrices)||!breed)return null;
  const b=normBreed(breed);if(!b)return null;
  let best=null;
  svc.breedPrices.forEach(r=>{
    const k=normBreed(r.breed);if(!k)return;
    if(b===k||b.indexOf(k)>=0||k.indexOf(b)>=0){if(!best||k.length>normBreed(best.breed).length)best=r;}
  });
  return best;
}
function basePriceFor(svc,size){if(svc&&svc.prices&&svc.prices[size]!=null)return +svc.prices[size]||0;return Math.round(((svc&&svc.base)||0)*(SIZE_MULT[size]||1));}
function priceFor(svc,size,breed){
  const r=breedRule(svc,breed);
  if(r){if(r.mode==="add")return Math.round(basePriceFor(svc,size)+(+r.price||0));return Math.round(+r.price||0);}
  return basePriceFor(svc,size);
}
function petPrice(p){return (p.svcs||[]).reduce((s,id)=>s+priceFor(svcById(id),p.size,p.breed),0);}
function petDur(p){return (p.svcs||[]).reduce((s,id)=>s+(svcById(id).dur||0),0);}
function apptPets(a){return (a&&Array.isArray(a.pets)&&a.pets.length)?a.pets:[];}
function apptServicesTotal(a){return apptPets(a).reduce((s,p)=>s+petPrice(p),0);}
function apptSubtotal(a){
  if(a.comboOn&&a.comboPrice!=null)return +a.comboPrice||0;
  const s=apptServicesTotal(a);
  return s||(+a.price||0);
}
function apptDur(a){const d=apptPets(a).reduce((s,p)=>s+petDur(p),0);return d||60;}
function apptPetNames(a){const ps=apptPets(a);return ps.map(p=>p.name).filter(Boolean).join(", ")||"—";}
function apptSvcNames(a){
  const ps=apptPets(a);
  const all=[];ps.forEach(p=>(p.svcs||[]).forEach(id=>{const n=svcById(id).name||id;if(all.indexOf(n)<0)all.push(n);}));
  return all.join(" + ")||"—";
}
function apptIcon(a){const ps=apptPets(a);const first=(ps[0]&&ps[0].svcs&&ps[0].svcs[0])||null;return first?(svcById(first).icon||"🐾"):"🐾";}
function apptPhoto(a){const p=apptPets(a).find(x=>x.photo);return p?p.photo:"";}
function apptBreeds(a){return apptPets(a).map(p=>p.breed).filter(Boolean).join(", ");}
function apptTotal(a){return (+a.price||0)+(+a.tip||0);}
function apptPaidAmt(a){
  if(Array.isArray(a.payments)&&a.payments.length)return a.payments.reduce((s,p)=>s+(+p.amt||0),0);
  if(a.paidAmt!=null)return +a.paidAmt||0;
  if(a.paidTotal!=null)return +a.paidTotal||0;
  return a.paid?apptTotal(a):0;
}
function apptBalance(a){return Math.round((apptTotal(a)-apptPaidAmt(a))*100)/100;}
function isSettled(a){return apptBalance(a)<=0.009;}
function isDone(a){return a.status==="done";}
function isLive(a){return a.status!=="requested"&&a.status!=="declined"&&a.status!=="modProposed";}
function apptRevDate(a){if(a.doneAt){try{return new Date(a.doneAt).toISOString().slice(0,10);}catch(e){}}return a.when;}

/* ===== migraciones ===== */
const LEGACY_SIZE={"Pequeño":"Small","Pequeno":"Small","Mediano":"Medium","Grande":"Large","Gigante":"Giant","Extra Grande":"Giant","Extra Large":"Giant"};
function fixSize(s){return LEGACY_SIZE[s]||s||"Medium";}
function normalizeAppt(a){
  if(!a||typeof a!=="object")return a;
  if(!Array.isArray(a.pets)||!a.pets.length){
    const svcs=(Array.isArray(a.svcs)&&a.svcs.length)?a.svcs.slice():(a.svc?[a.svc]:[]);
    a.pets=[{name:a.pet||"—",breed:a.breed||"",size:fixSize(a.size),svcs:svcs,photo:a.photo||"",notes:a.notes||""}];
  }
  a.pets.forEach(p=>{
    p.size=fixSize(p.size);
    if(!Array.isArray(p.svcs))p.svcs=p.svc?[p.svc]:[];
    if(p.name==null)p.name="—";
    if(p.breed==null)p.breed="";
    if(p.photo==null)p.photo="";
  });
  delete a.pet;delete a.breed;delete a.size;delete a.svc;delete a.svcs;delete a.photo;
  if(a.price==null||isNaN(+a.price))a.price=apptServicesTotal(a);
  a.price=+a.price||0;
  if(a.tip==null)a.tip=0;
  if(a.discount==null)a.discount=0;
  if(!Array.isArray(a.payments)){
    a.payments=[];
    const paid=(a.paidAmt!=null?+a.paidAmt:(a.paidTotal!=null?+a.paidTotal:(a.paid?apptTotal(a):0)))||0;
    if(paid>0)a.payments.push({id:nid(),amt:paid,method:a.payMethod||"cash",at:a.paidAt||Date.now(),by:"",note:""});
  }
  if(!a.phoneKey)a.phoneKey=phoneKey(a.phone);
  a.paid=isSettled(a)&&apptPaidAmt(a)>0;
  return a;
}

  const d={deposit:0,maxDay:10,slotCapacity:2,minWindow:12,repeatCount:6,coldDays:60,etaMin:20,

  if(!STATE.settings.reminders)STATE.settings.reminders={email:true,sms:false,whatsapp:true,timing:24};

  if(!Array.isArray(STATE.hours)||STATE.hours.length!==7)STATE.hours=[0,1,2,3,4,5,6].map(i=>({on:i<6,from:"08:00",to:"18:00"}));
